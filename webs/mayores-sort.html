<script>
/* ==========================================================
   BASE DE LOS JUEGOS PARA MAYORES
   Lo común a todos: barra de arriba, tamaño de letra, voz, sonidos suaves,
   memoria del nivel y protección contra toques dobles.

   Uso:
     const M = Mayores.iniciar({ id: 'compra', nivelMaximo: 8 });
     M.tocar(boton, () => ...);   M.decir('texto');   M.sonar('bien');
     M.mostrar('juego');   M.nivel   M.anotar('bien' | 'mal')
   ========================================================== */
const Mayores = (() => {
    /* 18, 21, 23 y 26 px. Un escalón de 29 px se probó y en un móvil de
       360 de ancho dejaba ocho letras por renglón: el refrán solo ocupaba
       media pantalla y no cabían ni dos respuestas. */
    const ESCALAS = [1, 1.15, 1.3, 1.45];
    const ANTIRREBOTE_MS = 450;

    /* localStorage falla en navegación privada y en algunos iframes: se
       cae a memoria y el juego sigue, solo que sin recordar entre visitas */
    const memoria = {};
    function leer(clave, porDefecto) {
        try {
            const v = localStorage.getItem(clave);
            return v === null ? porDefecto : JSON.parse(v);
        } catch (e) {
            return clave in memoria ? memoria[clave] : porDefecto;
        }
    }
    function guardar(clave, valor) {
        memoria[clave] = valor;
        try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
    }

    /* ---------- VOZ ----------
       La del propio navegador: en Android e iPhone habla castellano sin
       instalar nada. Un poco más lenta que la normal (0,9). */
    let vozElegida = null;
    function elegirVoz() {
        if (!('speechSynthesis' in window)) return;
        const voces = speechSynthesis.getVoices();
        vozElegida = voces.find(v => v.lang === 'es-ES') ||
                     voces.find(v => /^es[-_]/i.test(v.lang)) || null;
    }
    if ('speechSynthesis' in window) {
        elegirVoz();
        /* En Chrome la lista de voces llega más tarde que la página */
        speechSynthesis.addEventListener('voiceschanged', elegirVoz);
    }

    /* ---------- SONIDOS ----------
       El acierto suena a campanilla; el error, a un «toc» grave y corto.
       Nada de zumbidos de «has fallado». El contexto de audio se crea con
       el primer toque, que es cuando el navegador deja. */
    let ctxAudio = null;
    function audio() {
        if (ctxAudio) return ctxAudio;
        try { ctxAudio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctxAudio = null; }
        return ctxAudio;
    }
    function nota(frec, inicio, dur, vol) {
        const ctx = audio();
        if (!ctx) return;
        const t = ctx.currentTime + inicio;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = frec;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(ctx.destination);
        o.start(t);
        o.stop(t + dur + 0.05);
    }

    /* Tarjeta de objeto (producto, cosa de la mesa): dibujo y nombre siempre
       juntos. El dibujo cambia de un móvil a otro y la palabra es lo que de
       verdad se recuerda. */
    function tarjeta(p, etiqueta) {
        const el = document.createElement(etiqueta || 'div');
        el.className = 'producto';
        if (etiqueta === 'button') el.type = 'button';
        el.innerHTML = '<span class="icono" aria-hidden="true"></span><span class="nombre"></span>';
        el.querySelector('.icono').textContent = p.icono;
        el.querySelector('.nombre').textContent = p.nombre;
        el.dataset.nombre = p.nombre;
        return el;
    }

    /* Dos columnas con pocas tarjetas (sin hueco suelto en la última fila), o
       cuando en tres el nombre bajaría del 85 % de la letra elegida: el nombre
       ocupa el 15 % del ancho de DENTRO de la tarjeta (ver .nombre en el CSS),
       así que se descuentan su relleno (0,2rem por lado) y su borde (3 px).
       Sin descontarlos, «papel higiénico» salía a 13,7 px en un móvil de 360. */
    function columnasPara(n, contenedor) {
        if (n <= 2) return Math.max(1, n);
        if (n === 4) return 2;
        const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
        const ancho = (contenedor || document.querySelector('main')).clientWidth;
        const dentroEn3 = (ancho - 2 * 0.5 * rem) / 3 - 0.4 * rem - 6;
        /* Tres en una sola fila cuando caben: en dos columnas, tres tarjetas
           ocupan dos filas, y en ¿Qué falta? eso solo ya no cabía */
        return dentroEn3 * 0.15 >= 0.85 * rem ? 3 : 2;
    }

    function iniciar(opciones) {
        const id = opciones.id;
        const nivelMaximo = opciones.nivelMaximo || 1;
        let escala = Math.min(ESCALAS.length - 1, Math.max(0, leer('mayores.letra', 1)));
        let sonido = leer('mayores.sonido', true);
        /* La paleta de los juegos de botones de colores: la elige quien
           juega, según la que mejor distinga, y vale para todos */
        let paletaId = leer('mayores.paleta', PALETAS[0].id);
        if (!PALETAS.some(p => p.id === paletaId)) paletaId = PALETAS[0].id;
        let estadoNivel = leer('mayores.' + id + '.nivel', nivelInicial());
        if (!estadoNivel || typeof estadoNivel.nivel !== 'number') estadoNivel = nivelInicial();
        estadoNivel.nivel = Math.min(nivelMaximo, Math.max(1, estadoNivel.nivel));

        /* ---------- barra de arriba ---------- */
        const barra = document.createElement('div');
        barra.className = 'barra';
        barra.innerHTML =
            '<button type="button" class="salir" data-b="salir" aria-label="Salir al portal de juegos">← Salir</button>' +
            '<button type="button" data-b="menos" aria-label="Letra más pequeña">A−</button>' +
            '<button type="button" data-b="mas" aria-label="Letra más grande">A+</button>' +
            '<button type="button" data-b="sonido"></button>';
        document.body.insertBefore(barra, document.body.firstChild);
        const bMenos = barra.querySelector('[data-b="menos"]');
        const bMas = barra.querySelector('[data-b="mas"]');
        const bSonido = barra.querySelector('[data-b="sonido"]');

        function aplicarEscala() {
            document.documentElement.style.setProperty('--escala', ESCALAS[escala]);
            bMenos.disabled = escala === 0;
            bMas.disabled = escala === ESCALAS.length - 1;
        }
        function aplicarSonido() {
            bSonido.textContent = sonido ? '🔊' : '🔇';
            bSonido.setAttribute('aria-label', sonido ? 'Quitar el sonido' : 'Poner el sonido');
            bSonido.setAttribute('aria-pressed', String(sonido));
        }
        aplicarEscala();
        aplicarSonido();

        /* ---------- toques ----------
           Un toque doble involuntario no debe contar como dos respuestas:
           se ignora todo toque que llegue antes de ANTIRREBOTE_MS del
           anterior que sí se atendió. */
        /* Cada juego puede querer recolocar su pantalla al cambiar la letra */
        const avisosLetra = [];

        let ultimoToque = 0;
        function tocar(el, accion) {
            el.addEventListener('click', (e) => {
                const ahora = Date.now();
                if (ahora - ultimoToque < ANTIRREBOTE_MS) { e.preventDefault(); return; }
                ultimoToque = ahora;
                audio();
                if (ctxAudio && ctxAudio.state === 'suspended') ctxAudio.resume();
                accion(e);
            });
        }

        const cambiarLetra = (d) => {
            const nueva = Math.min(ESCALAS.length - 1, Math.max(0, escala + d));
            if (nueva === escala) return;
            escala = nueva;
            guardar('mayores.letra', escala);
            aplicarEscala();
            avisosLetra.forEach(f => f());
        };
        tocar(bMenos, () => cambiarLetra(-1));
        tocar(bMas, () => cambiarLetra(1));
        tocar(bSonido, () => {
            sonido = !sonido;
            guardar('mayores.sonido', sonido);
            aplicarSonido();
            if (!sonido && 'speechSynthesis' in window) speechSynthesis.cancel();
            else decir('Sonido puesto');
        });
        tocar(barra.querySelector('[data-b="salir"]'), () => {
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            /* Los juegos viven en webs/ y la portada en la raíz */
            location.href = '../';
        });

        function decir(texto) {
            if (!sonido || !('speechSynthesis' in window) || !texto) return;
            try {
                /* cancel antes de hablar: si no, las frases se encolan y la
                   voz va contando lo de hace tres toques */
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(texto);
                u.lang = 'es-ES';
                if (vozElegida) u.voice = vozElegida;
                u.rate = 0.9;
                /* Chrome a veces deja la síntesis en pausa tras pasar la
                   pestaña a segundo plano, y speak() ya no suena */
                speechSynthesis.resume();
                speechSynthesis.speak(u);
            } catch (e) {}
        }

        /* Un tono por botón: do, mi, sol y do agudo. Suenan bien juntos y
           se distinguen sin ver el color */
        const TONOS = [262, 330, 392, 523];
        function tono(i, dur) {
            if (sonido) nota(TONOS[i % TONOS.length], 0, (dur || 600) / 1000, 0.2);
        }

        function sonar(tipo) {
            if (!sonido) return;
            if (tipo === 'bien') { nota(784, 0, 0.25, 0.18); nota(1047, 0.12, 0.35, 0.16); }
            else if (tipo === 'fin') { nota(659, 0, 0.3, 0.16); nota(784, 0.15, 0.3, 0.16); nota(1047, 0.3, 0.5, 0.16); }
            else nota(220, 0, 0.18, 0.12);
        }

        function mostrar(idPantalla) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.toggle('activa', p.id === idPantalla));
            window.scrollTo(0, 0);
            /* El foco a la pantalla nueva: quien navega con lector de
               pantalla o teclado no se queda en un botón que ya no se ve */
            const h = document.querySelector('#' + idPantalla + ' [data-foco]') ||
                      document.querySelector('#' + idPantalla + ' h1');
            if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && 'speechSynthesis' in window) speechSynthesis.cancel();
        });

        /* ¿Cabe la pantalla sin desplazar? Se mide lo que de verdad se ve,
           no se estima: el tamaño de letra, la pantalla y hasta la fuente
           del sistema cambian de un aparato a otro. Se mira también el
           ancho, porque una rejilla con una palabra larga puede ensanchar
           la página en vez de bajar de línea. */
        function cabe() {
            const raiz = document.scrollingElement || document.documentElement;
            const ancho = document.documentElement.clientWidth;
            const sale = [...document.querySelectorAll('.pantalla.activa *')]
                .some(e => e.offsetParent !== null && e.getBoundingClientRect().right > ancho + 1);
            /* Sin tolerancia: con 1 px de margen se colaban pantallas que se
               pasaban justo ese píxel y obligaban a desplazar */
            return raiz.scrollHeight <= window.innerHeight && !sale;
        }

        /* Reservar el alto del mensaje más largo que puede salir en una pista.
           Sin esto, al fallar, «¿Qué se hace primero?» pasaba a «Eso se hace
           más tarde. ¿Qué se hace primero?», ocupaba un renglón más y todo lo
           de debajo bajaba: la tarjeta siguiente ya no estaba bajo el dedo.
           `medido` es el bloque que ocupa sitio; `texto`, dónde va el mensaje
           (el mismo elemento o uno de dentro). Se recalcula al cambiar la
           letra, y como deja puesto el min-height, cabe() ya lo cuenta. */
        const reservas = new Map();
        function reservar(medido, textos, texto) {
            texto = texto || medido;
            reservas.set(medido, { textos, texto });
            const antes = texto.textContent;
            medido.style.minHeight = '';
            let alto = 0;
            for (const t of textos) {
                texto.textContent = t;
                alto = Math.max(alto, medido.getBoundingClientRect().height);
            }
            texto.textContent = antes;
            medido.style.minHeight = Math.ceil(alto) + 'px';
        }
        avisosLetra.push(() => reservas.forEach((r, el) => { if (el.offsetParent !== null) reservar(el, r.textos, r.texto); }));

        return {
            tocar, decir, sonar, tono, mostrar, cabe, tarjeta, columnasPara, reservar,
            get paleta() { return PALETAS.find(p => p.id === paletaId); },
            elegirPaleta(id) {
                if (!PALETAS.some(p => p.id === id)) return;
                paletaId = id;
                guardar('mayores.paleta', id);
            },
            alCambiarLetra(f) { avisosLetra.push(f); },
            get letraGrande() { return escala >= 2; },
            get nivel() { return estadoNivel.nivel; },
            anotar(resultado) {
                estadoNivel = adaptarNivel(estadoNivel, resultado, nivelMaximo);
                guardar('mayores.' + id + '.nivel', estadoNivel);
                return estadoNivel.nivel;
            },
            get hayVoz() { return 'speechSynthesis' in window; },
            get sonidoActivo() { return sonido; }
        };
    }

    return { iniciar };
})();
</script>
<script>
/* ==========================================================
   MOTOR DE MAGIC SORT
   Sin DOM: lo usan el juego de Ingenio, el de mayores y las pruebas de Node.

   Un tubo es un array de colores (enteros 0…) de abajo arriba. Cada color
   tiene `cap × k` capas en total, así que al final cada color llena uno o
   más tubos enteros. Se gana cuando todo tubo con algo está LLENO y de un
   solo color (los vacíos dan igual).

   Verter mueve el bloque de arriba del mismo color, o lo que quepa.
   Ocultas: capas tapadas (?) que se destapan al quedar arriba. Deshacer no
   las vuelve a tapar: lo visto, visto está.
   ========================================================== */
const Sort = (() => {
    'use strict';

    /* ---------- Azar con semilla (mulberry32, con Math.imul: sale igual en
       todos los navegadores) ---------- */
    function azar(semilla) {
        let a = semilla >>> 0;
        return function () {
            a = (a + 0x6D2B79F5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    /* FNV-1a para sacar semillas de un texto («2026-11-20», «nivel 37»…) */
    function hash(texto) {
        let h = 0x811c9dc5;
        for (let i = 0; i < texto.length; i++) { h ^= texto.charCodeAt(i); h = Math.imul(h, 0x01000193); }
        return h >>> 0;
    }

    /* ---------- Estado ---------- */
    function crear(nivel) {
        const tubos = nivel.tubos.map((t) => t.slice());
        const ocultas = tubos.map((t, i) => t.map((_, j) =>
            !!(nivel.ocultas && j < t.length - 1 && (nivel.ocultas === true || (nivel.ocultas[i] && nivel.ocultas[i][j])))));
        return { cap: nivel.cap, tubos, ocultas, extra: 0, movs: 0, historial: [] };
    }

    const arriba = (t) => (t.length ? t[t.length - 1] : -1);
    function bloque(t) {
        if (!t.length) return 0;
        const c = t[t.length - 1];
        let n = 0;
        for (let i = t.length - 1; i >= 0 && t[i] === c; i--) n++;
        return n;
    }
    const uniforme = (t) => t.every((c) => c === t[0]);
    const completo = (t, cap) => t.length === cap && uniforme(t);

    /* Cuántas capas pasarían de o a d (0 = no se puede) */
    function cuantas(e, o, d) {
        if (o === d) return 0;
        const to = e.tubos[o], td = e.tubos[d];
        if (!to || !td || !to.length || td.length >= e.cap) return 0;
        if (td.length && arriba(td) !== arriba(to)) return 0;
        return Math.min(bloque(to), e.cap - td.length);
    }
    /* Por qué no, en palabras (para el aviso) */
    function motivo(e, o, d) {
        const to = e.tubos[o], td = e.tubos[d];
        if (o === d) return 'mismo';
        if (!to.length) return 'origenVacio';
        if (td.length >= e.cap) return 'lleno';
        if (td.length && arriba(td) !== arriba(to)) return 'color';
        return null;
    }

    function verter(e, o, d) {
        const n = cuantas(e, o, d);
        if (!n) return 0;
        const to = e.tubos[o], td = e.tubos[d];
        const color = arriba(to);
        for (let i = 0; i < n; i++) { to.pop(); e.ocultas[o].pop(); td.push(color); e.ocultas[d].push(false); }
        const destapada = destapar(e, o);
        e.movs++;
        e.historial.push({ o, d, n, destapada });
        return n;
    }
    function destapar(e, i) {
        const oc = e.ocultas[i];
        if (oc.length && oc[oc.length - 1]) { oc[oc.length - 1] = false; return true; }
        return false;
    }

    function deshacer(e) {
        const h = e.historial.pop();
        if (!h) return null;
        const to = e.tubos[h.o], td = e.tubos[h.d];
        for (let i = 0; i < h.n; i++) { to.push(td.pop()); e.ocultas[h.d].pop(); e.ocultas[h.o].push(false); }
        e.movs++;               // deshacer también cuenta como movimiento: lo que se ve es lo hecho
        return h;
    }

    /* Tubo vacío de más; solo uno por nivel */
    function tuboExtra(e) {
        if (e.extra) return false;
        e.tubos.push([]); e.ocultas.push([]); e.extra = 1;
        return true;
    }

    function ganado(e) {
        return e.tubos.every((t) => !t.length || completo(t, e.cap));
    }
    function completos(e) { return e.tubos.filter((t) => completo(t, e.cap)).length; }

    /* Jugadas que sirven de algo (las que no, aunque valgan, no se cuentan
       para decir «no quedan movimientos» ni las propone la pista):
       - sacar de un tubo ya completo;
       - pasar un tubo de un solo color entero a uno vacío (es lo mismo). */
    function jugadasUtiles(e) {
        const l = [];
        const n = e.tubos.length;
        for (let o = 0; o < n; o++) {
            const to = e.tubos[o];
            if (!to.length || completo(to, e.cap)) continue;
            for (let d = 0; d < n; d++) {
                const k = cuantas(e, o, d);
                if (!k) continue;
                if (!e.tubos[d].length && uniforme(to)) continue;
                l.push([o, d, k]);
            }
        }
        return l;
    }

    /* ---------- Resolvedor ----------
       Búsqueda en profundidad con memoria de posiciones (los tubos ordenados:
       dos tableros con los mismos tubos en otro orden son el mismo). Orden de
       las jugadas: primero las que completan o juntan sobre su color, después
       las que van a un vacío (y a un solo vacío: da igual cuál). Con las
       ocultas mira el tablero de verdad (para la pista vale: es una ayuda).
       Devuelve la lista de jugadas, o null si no hay (o se acaba el tope). */
    function clave(tubos) {
        return tubos.map((t) => t.join(',')).sort().join('|');
    }
    function resolver(e, tope) {
        tope = tope || 200000;
        const tubos = e.tubos.map((t) => t.slice());
        const cap = e.cap;
        const vistos = new Set();
        const camino = [];
        let nodos = 0, agotado = false;
        const bloq = (t) => { let k = 0; const c = t[t.length - 1]; for (let i = t.length - 1; i >= 0 && t[i] === c; i--) k++; return k; };
        const hecho = () => tubos.every((t) => !t.length || (t.length === cap && t.every((c) => c === t[0])));
        function jugadas() {
            const l = [];
            let primerVacio = -1;
            for (let d = 0; d < tubos.length; d++) if (!tubos[d].length) { primerVacio = d; break; }
            for (let o = 0; o < tubos.length; o++) {
                const to = tubos[o];
                if (!to.length) continue;
                const uni = to.every((c) => c === to[0]);
                if (uni && to.length === cap) continue;
                const c = to[to.length - 1], b = bloq(to);
                for (let d = 0; d < tubos.length; d++) {
                    if (d === o) continue;
                    const td = tubos[d];
                    if (td.length >= cap) continue;
                    if (td.length) {
                        if (td[td.length - 1] !== c) continue;
                        const k = Math.min(b, cap - td.length);
                        const destUni = td.every((x) => x === c);
                        // completa el destino > pasa el bloque entero > sobre un tubo de su color > vacía el origen
                        const p = (td.length + k === cap && destUni ? 100 : 0) + (k === b ? 20 : 0) + (destUni ? 10 : 0) + (uni ? 5 : 0);
                        l.push([p, o, d, k]);
                    } else if (!uni && d === primerVacio) {
                        // a un vacío, solo al primero: todos los vacíos son iguales
                        l.push([1, o, d, b]);
                    }
                }
            }
            l.sort((a, b2) => b2[0] - a[0]);
            return l;
        }
        function paso() {
            if (hecho()) return true;
            if (++nodos > tope) { agotado = true; return false; }
            const k = clave(tubos);
            if (vistos.has(k)) return false;
            vistos.add(k);
            for (const [, o, d, n] of jugadas()) {
                const c = tubos[o][tubos[o].length - 1];
                for (let i = 0; i < n; i++) { tubos[o].pop(); tubos[d].push(c); }
                camino.push([o, d]);
                if (paso()) return true;
                camino.pop();
                for (let i = 0; i < n; i++) { tubos[d].pop(); tubos[o].push(c); }
                if (agotado) return false;
            }
            return false;
        }
        const ok = paso();
        return { ok, jugadas: ok ? camino.slice() : null, nodos, agotado };
    }

    /* Pista: la siguiente jugada de una solución desde aquí. Si desde aquí no
       hay salida, cuántas hay que deshacer para volver a tenerla. */
    function pista(e, tope) {
        const r = resolver(e, tope);
        if (r.ok) return r.jugadas.length ? { tipo: 'jugada', o: r.jugadas[0][0], d: r.jugadas[0][1], quedan: r.jugadas.length } : { tipo: 'hecho' };
        if (r.agotado) return { tipo: 'nose' };
        // Atrás en el historial hasta encontrar una posición con salida
        const copia = { cap: e.cap, tubos: e.tubos.map((t) => t.slice()), ocultas: e.ocultas.map((o) => o.slice()), extra: e.extra, movs: 0, historial: e.historial.slice() };
        for (let k = 1; copia.historial.length; k++) {
            deshacer(copia);
            const r2 = resolver(copia, tope);
            if (r2.ok) return { tipo: 'deshaz', cuantas: k };
            if (r2.agotado) return { tipo: 'nose' };
        }
        return { tipo: 'sinSalida' };
    }

    /* ---------- Generar ----------
       Barajar todas las capas y repartirlas en tubos llenos, más los vacíos.
       No vale un reparto con algún tubo ya completo. Con 2 vacíos casi todo
       reparto al azar tiene solución (medido: 299 de 300 hasta 14 colores);
       la dificultad no la da eso, sino lo fácil que es meterse en un
       callejón: la mide simular(). */
    function repartir(r, p) {
        const capas = [];
        for (let c = 0; c < p.colores; c++) for (let i = 0; i < p.cap * (p.k || 1); i++) capas.push(c);
        for (let i = capas.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = capas[i]; capas[i] = capas[j]; capas[j] = x; }
        const tubos = [];
        for (let i = 0; i < capas.length / p.cap; i++) tubos.push(capas.slice(i * p.cap, (i + 1) * p.cap));
        for (let i = 0; i < p.vacios; i++) tubos.push([]);
        return { cap: p.cap, tubos, ocultas: !!p.ocultas };
    }

    /* Jugador simulado: entre las jugadas útiles, con probabilidad `listo`
       la que mejor pinta (la misma puntuación que ordena el resolvedor) y si
       no una al azar; nunca deshace ni repite la contraria de la anterior.
       Sirve para medir lo fácil que es atascarse: % de partidas que gana. */
    function puntuar(e, o, d, k) {
        const to = e.tubos[o], td = e.tubos[d];
        if (!td.length) return 1;
        const c = to[to.length - 1];
        const destUni = td.every((x) => x === c);
        return (td.length + k === e.cap && destUni ? 100 : 0) + (k === bloque(to) ? 20 : 0) + (destUni ? 10 : 0) + (uniforme(to) ? 5 : 0);
    }
    function simular(nivel, r, listo, maxMovs) {
        const e = crear(Object.assign({}, nivel, { ocultas: false }));
        let ant = null;
        maxMovs = maxMovs || 400;
        while (e.movs < maxMovs) {
            if (ganado(e)) return true;
            let l = jugadasUtiles(e);
            if (ant) l = l.filter((j) => !(j[0] === ant[1] && j[1] === ant[0]));
            if (!l.length) return false;
            let j;
            if (r() < listo) {
                let mejor = -1;
                for (const x of l) { const p = puntuar(e, x[0], x[1], x[2]); if (p > mejor) { mejor = p; j = x; } }
            } else j = l[Math.floor(r() * l.length)];
            verter(e, j[0], j[1]);
            ant = j;
        }
        return ganado(e);
    }
    function exito(nivel, semilla, partidas, listo) {
        const r = azar(semilla);
        let g = 0;
        for (let i = 0; i < partidas; i++) if (simular(nivel, r, listo)) g++;
        return g / partidas;
    }

    /* Esfuerzo: un jugador que prueba y deshace. Búsqueda en profundidad
       con el orden de jugadas de la puntuación más ruido, sin memoria de
       posiciones vistas más allá de la rama (una persona no recuerda todo).
       Cuenta las vueltas atrás hasta ganar: la mediana de varios intentos
       es la dificultad. Al simulado sin vuelta atrás los tableros grandes le
       salen todos imposibles (0 % desde 10 colores), no discrimina. */
    function esfuerzo(nivel, semilla, ensayos, ruido, tope) {
        const r = azar(semilla);
        ensayos = ensayos || 7; ruido = ruido == null ? 40 : ruido; tope = tope || 20000;
        const vals = [];
        for (let k = 0; k < ensayos; k++) {
            const e = crear(Object.assign({}, nivel, { ocultas: false }));
            const vistos = new Set();
            let atras = 0, nodos = 0;
            const rama = (ant) => {
                if (ganado(e)) return true;
                if (++nodos > tope) return false;
                const kk = clave(e.tubos);
                if (vistos.has(kk)) return false;
                vistos.add(kk);
                let l = jugadasUtiles(e);
                // a vacíos, solo a uno
                let pv = -1;
                l = l.filter((j) => { if (e.tubos[j[1]].length) return true; if (pv < 0) pv = j[1]; return j[1] === pv; });
                if (ant) l = l.filter((j) => !(j[0] === ant[1] && j[1] === ant[0]));
                const pun = l.map((j) => [puntuar(e, j[0], j[1], j[2]) + r() * ruido, j]);
                pun.sort((a, b) => b[0] - a[0]);
                for (const [, j] of pun) {
                    verter(e, j[0], j[1]);
                    if (rama(j)) return true;
                    deshacer(e); e.historial.length = e.historial.length; atras++;
                }
                return false;
            };
            const ok = rama(null);
            vals.push(ok ? atras : tope);
        }
        vals.sort((a, b) => a - b);
        return vals[vals.length >> 1];
    }

    /* Nivel con semilla y una banda de esfuerzo [min, max] (vueltas atrás,
       ver esfuerzo). Prueba repartos hasta dar con uno dentro; si no, el que
       más se acerque. Siempre con solución comprobada por el resolvedor. */
    function generar(p, semilla, banda, op) {
        op = op || {};
        const r = azar(semilla);
        let mejor = null, dist = Infinity;
        const intentos = op.intentos || 40;
        for (let i = 0; i < intentos; i++) {
            const nivel = repartir(r, p);
            if (nivel.tubos.some((t) => t.length && completo(t, p.cap))) continue;
            const sol = resolver(crear(nivel), op.topeResolver || 60000);
            if (!sol.ok) continue;
            const x = banda ? esfuerzo(nivel, semilla + i * 7919, op.ensayos || 7, 40, op.tope || 20000) : 0;
            const fuera = !banda ? 0 : x < banda[0] ? (banda[0] - x) / (banda[0] + 1) : x > banda[1] ? (x - banda[1]) / (banda[1] + 1) : 0;
            if (fuera < dist) { dist = fuera; mejor = { nivel, esfuerzo: x, largo: sol.jugadas.length, intento: i }; }
            if (fuera === 0) break;
        }
        return mejor;
    }

    /* ---------- Texto compacto ----------
       «4|o|abcd/bcda//» → cap 4, con ocultas, tubos de letras (a = color 0),
       los vacíos sin nada entre barras. */
    function aTexto(nivel) {
        return nivel.cap + '|' + (nivel.ocultas ? 'o' : '') + '|' + nivel.tubos.map((t) => t.map((c) => String.fromCharCode(97 + c)).join('')).join('/');
    }
    function deTexto(s) {
        const [cap, oc, t] = s.split('|');
        return { cap: Number(cap), ocultas: oc === 'o', tubos: t.split('/').map((x) => [...x].map((ch) => ch.charCodeAt(0) - 97)) };
    }

    /* ---------- Guardar ---------- */
    function guardar(e) {
        return { v: 1, cap: e.cap, tubos: e.tubos, ocultas: e.ocultas.map((o) => o.map((x) => (x ? 1 : 0))), extra: e.extra, movs: e.movs,
                 historial: e.historial.map((h) => [h.o, h.d, h.n]) };
    }
    /* Lo leído se valida entero: si algo no cuadra, null (y se ignora). */
    function restaurar(g) {
        try {
            if (!g || g.v !== 1 || !Number.isInteger(g.cap) || g.cap < 2 || g.cap > 8 || !Array.isArray(g.tubos) || g.tubos.length > 40) return null;
            const cuenta = {};
            for (const t of g.tubos) {
                if (!Array.isArray(t) || t.length > g.cap) return null;
                for (const c of t) { if (!Number.isInteger(c) || c < 0 || c > 30) return null; cuenta[c] = (cuenta[c] || 0) + 1; }
            }
            if (Object.values(cuenta).some((n) => n % g.cap !== 0)) return null;
            if (!Array.isArray(g.ocultas) || g.ocultas.length !== g.tubos.length) return null;
            const e = { cap: g.cap, tubos: g.tubos.map((t) => t.slice()), ocultas: g.tubos.map((t, i) => t.map((_, j) => !!(g.ocultas[i] && g.ocultas[i][j]))),
                        extra: g.extra ? 1 : 0, movs: Number.isInteger(g.movs) && g.movs >= 0 ? g.movs : 0, historial: [] };
            for (const h of g.historial || []) {
                if (!Array.isArray(h) || h.length !== 3 || !h.every((x) => Number.isInteger(x) && x >= 0 && x < 40)) return null;
                e.historial.push({ o: h[0], d: h[1], n: h[2], destapada: false });
            }
            return e;
        } catch (x) { return null; }
    }

    return { azar, hash, crear, arriba, bloque, uniforme, completo, cuantas, motivo, verter, deshacer, tuboExtra,
             ganado, completos, jugadasUtiles, resolver, pista, clave, guardar, restaurar,
             repartir, puntuar, simular, exito, esfuerzo, generar, aTexto, deTexto };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Sort;
</script>
<script>
/* ==========================================================
   ORDENA LOS COLORES (Magic Sort para mayores)
   Con el motor de Magic Sort (Sort). Pocos frascos, muy grandes, y cada
   color con su forma y su nombre por la voz.
   Nunca se pierde: verter mal no cambia nada; a los dos errores brillan
   el frasco que hay que coger y dónde echarlo; si se mete en un callejón
   sin salida, se avisa y se deshace solo. 3 tableros por sesión;
   dificultad «3 arriba, 1 abajo» como los demás.
   ========================================================== */
const ORDENA_RONDAS = 3;
const ORDENA_ERRORES_AYUDA = 2;
/* Niveles: colores, capas por frasco y frascos vacíos. Pocos y separados:
   con 5 colores ya hay 7 frascos, lo más que cabe grande en un móvil. */
const ORDENA_NIVELES = [
    { colores: 2, cap: 3, vacios: 1 }, { colores: 2, cap: 4, vacios: 1 },
    { colores: 3, cap: 3, vacios: 2 }, { colores: 3, cap: 4, vacios: 2 },
    { colores: 4, cap: 3, vacios: 2 }, { colores: 4, cap: 4, vacios: 2 },
    { colores: 5, cap: 3, vacios: 2 }, { colores: 5, cap: 4, vacios: 2 }
];
/* Los colores más separados entre sí, con su forma y su nombre. Rojo y
   verde no van juntos hasta el 4.º color, y con forma distinta. */
const ORDENA_COLORES = [
    { color: '#d62828', nombre: 'rojo', forma: 'circulo', tinta: '#ffffff' },
    { color: '#1f5fd1', nombre: 'azul', forma: 'cuadrado', tinta: '#ffffff' },
    { color: '#f4d03f', nombre: 'amarillo', forma: 'triangulo', tinta: '#2b2b2b' },
    { color: '#1e9e55', nombre: 'verde', forma: 'estrella', tinta: '#ffffff' },
    { color: '#7d3fc9', nombre: 'morado', forma: 'corazon', tinta: '#ffffff' }
];
const ORDENA_SVG = {
    circulo: '<circle cx="12" cy="12" r="8"/>',
    cuadrado: '<rect x="4.5" y="4.5" width="15" height="15"/>',
    triangulo: '<path d="M12 3 L21 20 L3 20 Z"/>',
    estrella: '<path d="M12 2.5 L14.6 9 L21.5 9.3 L16 13.6 L18 20.5 L12 16.5 L6 20.5 L8 13.6 L2.5 9.3 L9.4 9 Z"/>',
    corazon: '<path d="M12 21 C3 14 2 9.5 5 6.5 C7.5 4 10.5 5 12 7.5 C13.5 5 16.5 4 19 6.5 C22 9.5 21 14 12 21 Z"/>'
};

const M = Mayores.iniciar({ id: 'sort', nivelMaximo: ORDENA_NIVELES.length });
const $ = (id) => document.getElementById(id);
const juego = { ronda: 0, e: null, cogido: -1, errores: 0, erroresSeguidos: 0, ayudas: 0, esperando: false };

function nuevoTablero(nivel) {
    const p = ORDENA_NIVELES[nivel - 1];
    // Con solución y sin rodeos: esfuerzo 0 = el simulado lo saca sin volver atrás
    const g = Sort.generar({ colores: p.colores, cap: p.cap, k: 1, vacios: p.vacios }, (Math.random() * 4294967296) >>> 0, [0, nivel <= 4 ? 0 : 3], { intentos: 30 });
    return Sort.crear(g.nivel);
}

function nombreDe(c) { return ORDENA_COLORES[c].nombre; }

function pintar() {
    const mesa = $('mesa');
    mesa.textContent = '';
    const e = juego.e;
    e.tubos.forEach((t, i) => {
        const col = document.createElement('div');
        col.className = 'columna-sort';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'frasco' + (i === juego.cogido ? ' cogido' : '') + (Sort.completo(t, e.cap) ? ' hecho' : '');
        b.style.setProperty('--cap', e.cap);
        b.dataset.i = i;
        b.setAttribute('aria-label', 'Frasco ' + (i + 1) + ': ' + (t.length ? t.slice().reverse().map(nombreDe).join(', ') + ' (de arriba abajo)' : 'vacío') + (i === juego.cogido ? '. Cogido.' : ''));
        for (const c of t) {
            const capa = document.createElement('span');
            capa.className = 'capa';
            capa.style.background = ORDENA_COLORES[c].color;
            capa.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="' + ORDENA_COLORES[c].tinta + '">' + ORDENA_SVG[ORDENA_COLORES[c].forma] + '</svg>';
            b.appendChild(capa);
        }
        M.tocar(b, () => tocar(i));
        col.appendChild(b);
        mesa.appendChild(col);
    });
    $('marcador').textContent = 'Tablero ' + juego.ronda + ' de ' + ORDENA_RONDAS + ' · ' + Sort.completos(e) + ' de ' + (e.tubos.reduce((s, t) => s + t.length, 0) / e.cap) + ' colores hechos';
}

function quitarAyuda() { document.querySelectorAll('.frasco.ayuda').forEach((b) => b.classList.remove('ayuda')); }

function tocar(i) {
    if (juego.esperando) return;
    const e = juego.e;
    quitarAyuda();
    const t = e.tubos[i];
    if (juego.cogido < 0) {
        if (!t.length) { decirPista('Ese está vacío. Coge uno que tenga color.'); return; }
        if (Sort.completo(t, e.cap)) { decirPista('Ese ya está terminado.'); return; }
        juego.cogido = i;
        pintar();
        decirPista('Cogido el ' + nombreDe(Sort.arriba(t)) + '. ¿Dónde lo echas?', 'Cogido. Arriba tiene ' + nombreDe(Sort.arriba(t)) + '. Ahora toca dónde echarlo.');
        return;
    }
    if (i === juego.cogido) { juego.cogido = -1; pintar(); decirPista('Suelto. Toca un frasco para cogerlo.'); return; }
    const o = juego.cogido;
    const n = Sort.verter(e, o, i);
    if (!n) {
        // Verter mal no cambia nada; se dice por qué en palabras sencillas
        juego.errores++; juego.erroresSeguidos++;
        M.sonar('suave');
        const m = Sort.motivo(e, o, i);
        if (juego.erroresSeguidos >= ORDENA_ERRORES_AYUDA) return ayudar('Coge el que brilla y échalo en el otro.', 'Mira: coge el que brilla primero y échalo en el otro que brilla.');
        if (m === 'lleno') decirPista('Ese está lleno. Prueba otro.');
        else decirPista('Ahí no: solo sobre el mismo color.', 'Ahí no: arriba tiene ' + nombreDe(Sort.arriba(e.tubos[i])) + '. Solo encima del mismo color o en uno vacío.');
        return;
    }
    juego.erroresSeguidos = 0;
    juego.cogido = -1;
    const color = Sort.arriba(e.tubos[i]);
    pintar();
    if (Sort.ganado(e)) return terminarTablero();
    if (Sort.completo(e.tubos[i], e.cap)) { M.sonar('bien'); decirPista('¡Muy bien!', '¡Muy bien! El ' + nombreDe(color) + ' ya está junto.'); }
    else decirPista('Echado el ' + nombreDe(color) + '.');
    // ¿Callejón? Se avisa y se deshace solo (no se pierde nunca)
    const p = Sort.pista(e, 50000);
    if (p.tipo === 'deshaz' || p.tipo === 'sinSalida') {
        juego.errores++;
        juego.esperando = true;
        decirPista('Por ahí no sale. Lo deshago.', 'Por ahí no se puede terminar. Lo deshago.');
        setTimeout(() => {
            for (let k = 0; k < (p.cuantas || 1); k++) Sort.deshacer(e);
            juego.esperando = false;
            pintar();
            ayudar('Prueba con el que brilla.');
        }, 1600);
    }
}

function ayudar(texto, voz) {
    const p = Sort.pista(juego.e, 50000);
    juego.cogido = -1;
    pintar();
    if (p.tipo !== 'jugada') { decirPista(texto, voz); return; }
    const frascos = document.querySelectorAll('.frasco');
    frascos[p.o].classList.add('ayuda');
    frascos[p.d].classList.add('ayuda');
    juego.erroresSeguidos = 0;
    decirPista(texto, voz);
}

/* En pantalla, la frase corta (un mensaje largo bajaba todo un renglón);
   la voz dice la entera. */
function decirPista(t, voz) { $('pista').textContent = t; M.decir(voz || t); }

function deshacer() {
    if (juego.esperando) return;
    if (!Sort.deshacer(juego.e)) { decirPista('No hay nada que deshacer.'); return; }
    juego.cogido = -1;
    pintar();
    decirPista('Deshecho.');
}

function terminarTablero() {
    juego.esperando = true;
    M.anotar(resultadoDeRonda(juego.errores, juego.ayudas));
    M.sonar('fin');
    decirPista('¡Muy bien! Cada color en su frasco.');
    document.querySelectorAll('.frasco').forEach((b) => { b.disabled = true; });
    $('btnSiguiente').textContent = juego.ronda >= ORDENA_RONDAS ? 'TERMINAR' : 'SIGUIENTE';
    $('btnSiguiente').style.display = '';
    $('btnDeshacer').disabled = true; $('btnAyudame').disabled = true;
}

/* Que quepa sin desplazar. El ancho sale de la pantalla (una fila hasta 4
   frascos, dos filas desde 5) y no de la letra: con la letra grande, medir
   en rem hacía frascos enormes en tres filas. Luego se encogen las capas
   hasta que cabe; los frascos nunca quedan bajo el borde. */
function ajustar() {
    const mesa = $('mesa');
    const n = juego.e.tubos.length;
    const filas = n <= 4 ? 1 : 2, porFila = Math.ceil(n / filas);
    const hueco = 10;
    const ancho = Math.max(44, Math.min(88, Math.floor((mesa.clientWidth - hueco * (porFila - 1)) / porFila) - 6));
    mesa.style.setProperty('--ancho-sort', ancho + 'px');
    let capa = Math.min(64, Math.round(ancho * 0.85));
    mesa.style.setProperty('--capa-sort', capa + 'px');
    const fondo = () => Math.max(...[...mesa.querySelectorAll('.frasco')].map((f) => f.getBoundingClientRect().bottom)) + window.scrollY;
    while (!M.cabe() && capa > 22) {
        capa -= 2;
        mesa.style.setProperty('--capa-sort', capa + 'px');
    }
    /* Si ni así cabe todo (pantalla pequeña con letra grande), que por lo
       menos los frascos se vean enteros: lo que queda bajo el borde son
       los botones de abajo. */
    while (fondo() > window.innerHeight && capa > 16) {
        capa -= 2;
        mesa.style.setProperty('--capa-sort', capa + 'px');
    }
}

function nuevaRonda() {
    juego.ronda++;
    juego.e = nuevoTablero(M.nivel);
    juego.cogido = -1; juego.errores = 0; juego.erroresSeguidos = 0; juego.ayudas = 0; juego.esperando = false;
    $('btnSiguiente').style.display = 'none';
    $('btnDeshacer').disabled = false; $('btnAyudame').disabled = false;
    M.mostrar('juego');
    pintar();
    M.reservar($('pista'), ['Cogido el amarillo. ¿Dónde lo echas?', 'Ahí no: solo sobre el mismo color.', 'Coge el que brilla y échalo en el otro.',
        'Por ahí no sale. Lo deshago.', 'Ese está vacío. Coge uno que tenga color.', '¡Muy bien! Cada color en su frasco.', 'Otro tablero. Toca un frasco para cogerlo.']);
    decirPista(juego.ronda === 1 ? 'Toca un frasco para cogerlo.' : 'Otro tablero. Toca un frasco para cogerlo.');
    ajustar();
}

function empezarSesion() { juego.ronda = 0; nuevaRonda(); }
function terminarSesion() {
    $('textoFinal').textContent = 'Has ordenado ' + ORDENA_RONDAS + ' tableros de colores.';
    M.sonar('fin');
    M.mostrar('final');
    M.decir('¡Muy bien! Has ordenado ' + ORDENA_RONDAS + ' tableros de colores.');
}

M.alCambiarLetra(() => { if (juego.e && document.getElementById('juego').classList.contains('activa')) ajustar(); });
M.tocar($('btnEmpezar'), empezarSesion);
M.tocar($('btnDeshacer'), deshacer);
M.tocar($('btnAyudame'), () => { if (juego.esperando) return; juego.ayudas++; ayudar('Coge el que brilla y échalo en el otro.', 'Coge el que brilla primero y échalo en el otro que brilla.'); });
M.tocar($('btnSiguiente'), () => (juego.ronda >= ORDENA_RONDAS ? terminarSesion() : nuevaRonda()));
M.tocar($('btnOtraVez'), empezarSesion);
M.tocar($('btnSalirFinal'), () => { location.href = '../'; });

/* Solo para las pruebas */
window.__ordena = { juego, tocar, pista: () => Sort.pista(juego.e, 50000) };
</script>
</body>
</html>
