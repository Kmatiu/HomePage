<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8ee">
<title>Paga justo</title>
<style>
/* ==========================================================
   BASE DE LOS JUEGOS PARA MAYORES
   Tema claro a propósito, distinto del oscuro del resto del portal: con la
   vista cansada se lee mejor texto oscuro sobre fondo claro. Todos los
   colores de texto pasan de 7:1 de contraste sobre el fondo (nivel AAA).

   Todo lo de dentro del juego va en rem, y el tamaño de letra se cambia
   tocando solo --escala: así A− / A+ agrandan textos, botones y tarjetas a
   la vez. La barra de arriba va en px a propósito: tiene que caber y estar
   al alcance con la letra al máximo.
   Base de 18 px (el navegador trae 16) y escalones hasta 26 px. Se probó
   llegar a 33 px y a 29 px: en un móvil no cabía ni una pregunta.
   ========================================================== */
:root {
    --escala: 1;
    --fondo: #fff8ee;
    --tarjeta: #ffffff;
    --texto: #1b1b1b;
    --suave: #4a4a4a;
    --azul: #174f94;
    --azul-claro: #e3edf9;
    --verde: #0d5524;
    --verde-claro: #e2f3e6;
    --naranja: #763800;
    --naranja-claro: #fdeedd;
    --borde: #c9bfae;
    /* Alto de la barra de arriba: 16 + 52 + 6 de relleno y botón, más 2 de
       borde. Lo usan los juegos que dimensionan su tablero con el alto libre. */
    --alto-barra: calc(env(safe-area-inset-top, 0px) + 76px);
}

* { box-sizing: border-box; }

html {
    font-size: calc(18px * var(--escala));
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    margin: 0;
    min-height: 100svh;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.35;
    /* Sin zoom por doble toque ni selección de texto al pulsar fuerte:
       con temblor, un toque doble involuntario es lo normal */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

/* ---------- BARRA DE ARRIBA ---------- */
.barra {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
    /* 16 px y no 6 por arriba: en el iPhone, Safari difumina lo que queda
       justo debajo de la hora y la batería, y con 6 px el difuminado caía
       sobre los botones. Se suma al hueco de seguridad, no lo sustituye
       (max() lo sustituiría; trampa ya pagada en este proyecto). */
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 10px 6px;
    background: var(--fondo);
    border-bottom: 2px solid var(--borde);
}
.barra button {
    min-width: 56px;
    height: 52px;
    padding: 0 12px;
    border: 2px solid var(--azul);
    border-radius: 12px;
    background: var(--tarjeta);
    color: var(--azul);
    font: 700 20px/1 system-ui, -apple-system, Roboto, Arial, sans-serif;
    cursor: pointer;
}
.barra .salir { margin-right: auto; }
.barra button:disabled { opacity: 0.35; }

/* ---------- PANTALLAS ---------- */
.pantalla { display: none; padding: 0.6rem 0.8rem calc(env(safe-area-inset-bottom, 0px) + 0.8rem); max-width: 34rem; margin: 0 auto; }
.pantalla.activa { display: block; }

h1 { font-size: 1.5rem; margin: 0.4rem 0 0.6rem; line-height: 1.2; text-align: center; }
.explicacion { font-size: 1.1rem; text-align: center; margin: 0 0 1rem; }
.pista { font-size: 1rem; text-align: center; color: var(--suave); margin: 0.4rem 0; min-height: 1.35em; }
.fila-botones { display: flex; gap: 0.5rem; }
.fila-botones .boton { margin: 0.4rem 0; }
.fila-botones .boton:first-child { flex: 2; }
.fila-botones .boton:not(:first-child) { flex: 1; }

/* ---------- BOTONES ---------- */
.boton {
    display: block;
    width: 100%;
    min-height: 3.2rem;
    margin: 0.6rem 0;
    padding: 0.6rem 1rem;
    border: 3px solid var(--azul);
    border-radius: 0.8rem;
    background: var(--azul);
    color: #fff;
    font: 700 1.25rem/1.2 system-ui, -apple-system, Roboto, Arial, sans-serif;
    cursor: pointer;
}
.boton.secundario { background: var(--tarjeta); color: var(--azul); }
.boton:disabled { opacity: 0.4; }

:focus-visible { outline: 4px solid #e08a00; outline-offset: 3px; }

/* ---------- MENSAJES ---------- */
.bien { color: var(--verde); }
.felicidad { font-size: 1.4rem; font-weight: 700; text-align: center; color: var(--verde); margin: 0.6rem 0; }

/* ---------- REJILLAS Y TARJETAS DE OBJETO ----------
   Las usan la compra y ¿Qué falta?: dibujo y nombre siempre juntos. */
/* minmax(0, 1fr) y no 1fr a secas: con 1fr la columna crece hasta el ancho
   de la palabra más larga y la rejilla se salía de la pantalla por la
   derecha con la letra grande */
.lista, .estantes, .mesa, .opciones-obj {
    display: grid;
    grid-template-columns: repeat(var(--columnas, 3), minmax(0, 1fr));
    gap: 0.5rem;
    margin: 0.4rem 0 0.6rem;
}
.lista .producto { cursor: default; }


.producto {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.35rem 0.2rem;
    /* El ancho de la tarjeta manda en el tamaño del nombre (unidades cqi) */
    container-type: inline-size;
    border: 3px solid var(--borde);
    border-radius: 0.8rem;
    background: var(--tarjeta);
    color: var(--texto);
    font: 600 1rem/1.15 system-ui, -apple-system, Roboto, Arial, sans-serif;
    cursor: pointer;
    position: relative;
    text-align: center;
}
.producto .icono { font-size: 2rem; line-height: 1.1; }
/* El nombre crece con la letra hasta donde quepa la palabra más larga
   («mantequilla», 11 letras) sin partirla. La primera versión partía las
   palabras por cualquier sitio («mant-equill-a») con la letra grande, que
   es lo peor para quien ya lee con esfuerzo. 15cqi = 15 % del ancho de la
   tarjeta; en negrita una letra ocupa algo más de media eme. */
.producto .nombre { margin-top: 0.1rem; font-size: 1rem; }
@supports (font-size: 1cqi) {
    .producto .nombre { font-size: min(1rem, 15cqi); }
    .producto .icono { font-size: min(2rem, 40cqi); }
}

.producto.en-cesta { border-color: var(--verde); background: var(--verde-claro); }
.producto.en-cesta::after {
    content: '✓';
    position: absolute; top: 0.1rem; right: 0.35rem;
    color: var(--verde); font-size: 1.3rem; font-weight: 900;
}
/* El que no estaba se apaga pero se sigue leyendo: no desaparece, para que
   la tienda no cambie de sitio debajo del dedo */
.producto.no-estaba { opacity: 0.38; border-style: dashed; }
/* El aviso late con un halo, sin cambiar de tamaño: la primera versión
   crecía y encogía (scale) y un blanco que se mueve es más difícil de
   acertar con temblor. Hasta Playwright se negaba a pulsarla. */
.producto.ayuda { border-color: var(--naranja); background: var(--naranja-claro); animation: halo 1.2s ease-in-out infinite; }
@keyframes halo { 50% { box-shadow: 0 0 0 0.35rem rgba(118, 56, 0, 0.35); } }

.pie { display: flex; align-items: center; gap: 0.6rem; }
.cesta { flex: 1; font-size: 1.05rem; font-weight: 700; margin: 0; }
.pie .boton { width: auto; flex: 0 0 auto; margin: 0.3rem 0; }
.pista.titulo { font-size: 1.15rem; font-weight: 700; color: var(--texto); margin: 0.2rem 0; }

/* ---------- CARTAS DE MEMORY ----------
   Cuadradas y del ancho de su columna; el alto lo da aspect-ratio, sin
   height fijo (con height explícito aspect-ratio no hace nada; trampa ya
   pagada en este proyecto). */
.cartas {
    display: grid;
    grid-template-columns: repeat(var(--columnas, 3), minmax(0, 1fr));
    gap: 0.5rem;
    width: min(100%, var(--ancho-cartas, 100%));
    margin: 0.4rem auto 0.6rem;
}
.carta {
    position: relative;
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0.2rem; overflow: hidden;
    border: 3px solid var(--azul); border-radius: 0.8rem;
    background: var(--azul-claro); color: var(--azul);
    font: 700 1rem/1.15 system-ui, -apple-system, Roboto, Arial, sans-serif;
    cursor: pointer;
    container-type: inline-size;
}
.carta.abierta { background: var(--tarjeta); border-color: var(--texto); color: var(--texto); outline: 0.3rem solid var(--texto); outline-offset: 0.1rem; }
.carta.hecha { background: var(--verde-claro); border-color: var(--verde); color: var(--texto); cursor: default; }
.carta.ayuda { animation: halo 1.2s ease-in-out infinite; }
.carta .icono { font-size: min(2.2rem, 42cqi); line-height: 1.1; }
.carta .nombre { font-size: min(1rem, 15cqi); margin-top: 0.1rem; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- PROPIO DE ESTE JUEGO ---------- */
.ticket {
    display: flex; align-items: center; gap: 0.6rem;
    margin: 0.2rem 0 0.4rem; padding: 0.5rem 0.8rem;
    border: 3px dashed var(--borde); border-radius: 0.8rem; background: var(--tarjeta);
}
.ticket .que { font-size: 1rem; color: var(--suave); }
.ticket .precio { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
.ticket .oir { margin-left: auto; width: 52px; height: 52px; flex: 0 0 auto;
    border: 2px solid var(--azul); border-radius: 0.6rem; background: var(--tarjeta); color: var(--azul); font-size: 1.3rem; cursor: pointer; }

.puesto { font-size: 1.1rem; font-weight: 700; margin: 0.3rem 0 0.1rem; }
.puesto.justo { color: var(--verde); }
.puesto.pasado { color: var(--naranja); }

/* La bandeja: lo que ya ha puesto, una etiqueta por tipo con cuántas
   lleva («2 € ×2»). Tocarla quita una. La primera versión dibujaba cada
   moneda en pequeño: con siete puestas la pantalla bajaba 500 px y la
   cifra de las pequeñas quedaba en 9,6 px. */
.bandeja {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: 0.35rem;
    min-height: 2.9rem; padding: 0.3rem;
    border: 2px solid var(--borde); border-radius: 0.8rem; background: #f3ead9;
}
.bandeja:empty::before { content: 'Aquí van tus monedas'; color: var(--suave); font-size: 0.95rem; padding-left: 0.4rem; }
.ficha {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem;
    min-height: 2.5rem; padding: 0.15rem 0.3rem;
    border: 2px solid rgba(0, 0, 0, 0.45); border-radius: 1.2rem;
    background: var(--tarjeta); color: var(--texto);
    font: 700 1rem/1 system-ui, -apple-system, Roboto, Arial, sans-serif; cursor: pointer;
}
.ficha .punto { width: 1rem; height: 1rem; flex: 0 0 auto; border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.45); }
.ficha .punto.billete { border-radius: 0.2rem; width: 1.4rem; height: 0.8rem; }
.ficha.ayuda { animation: halo 1.2s ease-in-out infinite; }
.ficha:disabled { opacity: 0.5; cursor: default; }

/* El monedero: cuatro columnas y cada moneda al tamaño que le toca dentro
   de su casilla, proporcionado al real (de 16,25 mm el céntimo a 25,75 mm
   los 2 euros). Se mide con el ancho del monedero (cqi), no con la letra:
   con la letra al máximo, ocho monedas a escala de letra no cabían. */
/* Con ancho tope: en una tableta en horizontal las monedas crecían con el
   ancho hasta no caber en alto */
.monedero {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.4rem; align-items: center; justify-items: center;
    width: min(100%, 24rem); margin: 0.4rem auto; container-type: inline-size;
}
.pieza {
    display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
    font: 800 1rem/1 system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: #1b1b1b;
    container-type: inline-size;
}
/* 36 % del ancho de la propia moneda: en la de 1 céntimo, la más pequeña,
   la cifra queda en unos 17 px en un móvil de 360 */
.pieza .valor { font-size: 36cqi; white-space: nowrap; }
.moneda {
    width: calc(var(--mm) / 25.75 * (100cqi - 1.2rem) / 4);
    min-width: 46px;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid rgba(0, 0, 0, 0.45);
}
/* Colores claros a propósito, para que la cifra oscura encima pase de 7:1 */
.cobre { background: radial-gradient(circle at 35% 35%, #f0c09a, #d99a66); }
.oro   { background: radial-gradient(circle at 35% 35%, #fbe7a1, #e6c35c); }
/* 1 €: centro dorado y anillo plateado; 2 €: al revés. Como las de verdad */
.euro1 { background: radial-gradient(circle, #f0d77a 0 55%, #d8dcdf 56%); }
.euro2 { background: radial-gradient(circle, #d8dcdf 0 55%, #f0d77a 56%); }
/* 1,6 : 1 y no 2 : 1 como un billete de verdad: en un móvil pequeño, a
   2 : 1 el billete medía 36 px de alto, poco para acertar con el dedo */
.pieza.billete {
    width: 100%; aspect-ratio: 1.6 / 1;
    border-radius: 0.4rem; border: 3px solid rgba(0, 0, 0, 0.45);
}
.pieza.billete .valor { font-size: 28cqi; }
.b500  { background: #c9cfc4; }
.b1000 { background: #f2b3a8; }
.b2000 { background: #b3c9ec; }
.pieza.ayuda { animation: halo 1.2s ease-in-out infinite; }
.pieza:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<main>
    <section class="pantalla activa" id="inicio">
        <h1>💶 Paga justo</h1>
        <p class="explicacion">Te digo cuánto hay que pagar. Toca las monedas hasta tener justo esa cantidad.</p>
        <button class="boton" id="btnEmpezar" type="button">EMPEZAR</button>
    </section>

    <section class="pantalla" id="juego">
        <div class="ticket" data-foco>
            <div>
                <div class="que">Hay que pagar</div>
                <div class="precio" id="precio"></div>
            </div>
            <button class="oir" id="btnOir" type="button" aria-label="Oír cuánto hay que pagar">🔊</button>
        </div>
        <!-- El monedero ANTES que la bandeja: la bandeja crece al poner
             monedas, y puesta encima empujaba el monedero hacia abajo, con
             lo que la moneda siguiente ya no estaba bajo el dedo -->
        <div class="monedero" id="monedero" aria-label="Tus monedas"></div>
        <p class="pista" id="pista" aria-live="polite"></p>
        <p class="puesto" id="puesto" aria-live="polite"></p>
        <div class="bandeja" id="bandeja" aria-label="Lo que has puesto"></div>
        <button class="boton secundario" id="btnAyuda" type="button">AYÚDAME</button>
        <button class="boton" id="btnSiguiente" type="button">SIGUIENTE</button>
    </section>

    <section class="pantalla" id="final">
        <h1 data-foco>¡Muy bien!</h1>
        <p class="felicidad" id="textoFinal"></p>
        <button class="boton" id="btnOtraVez" type="button">OTRA VEZ</button>
        <button class="boton secundario" id="btnSalirFinal" type="button">SALIR</button>
    </section>
</main>

<script>
/* ==========================================================
   LÓGICA DE LOS JUEGOS PARA MAYORES
   Lo que no toca la pantalla: cómo se ajusta la dificultad y qué sale en
   cada ronda. Sirve igual en el navegador y en Node, donde se prueba.

   Toda elección al azar recibe la función `azar`, para que las pruebas
   puedan repetir exactamente la misma partida.
   ========================================================== */

/* ---------- DIFICULTAD QUE SE AJUSTA SOLA ----------
   La meta es que acierten casi siempre (en torno a 8 de cada 10): con estas
   personas, fallar seguido no enseña, desanima.
   Sube tras 3 rondas limpias seguidas y baja con la primera que no lo sea.
   Es la escalera «3 arriba, 1 abajo», que se estabiliza donde acertar tres
   veces seguidas tiene un 50 % de probabilidad: 0,79³ ≈ 0,5, o sea en un 79 %
   de aciertos. Medido con jugadores simulados (prueba-logica.js): 77-79 % de
   rondas limpias, y un 70 % el más flojo porque se queda en el nivel 1, que
   es el suelo. La primera versión bajaba tras DOS rondas malas y perdonaba
   un error suelto: parecía más amable y dejaba a todos en un 48 %.
   - 'bien': sin errores y sin pedir ayuda
   - 'mal':  cualquier error o ayuda. Bajar no se le enseña al jugador:
             solo hace la siguiente ronda un poco más fácil. */
const SUBIR_TRAS = 3, BAJAR_TRAS = 1;

function nivelInicial() {
    return { nivel: 1, seguidasBien: 0 };
}

function adaptarNivel(estado, resultado, nivelMaximo) {
    let { nivel, seguidasBien } = estado;
    if (resultado === 'bien') {
        seguidasBien++;
        if (seguidasBien >= SUBIR_TRAS && nivel < nivelMaximo) { nivel++; seguidasBien = 0; }
    } else {
        seguidasBien = 0;
        if (nivel > 1) nivel--;
    }
    return { nivel, seguidasBien };
}

function resultadoDeRonda(errores, ayudas) {
    return errores === 0 && ayudas === 0 ? 'bien' : 'mal';
}

function barajar(lista, azar) {
    const l = lista.slice();
    for (let i = l.length - 1; i > 0; i--) {
        const j = Math.floor(azar() * (i + 1));
        [l[i], l[j]] = [l[j], l[i]];
    }
    return l;
}

/* ==========================================================
   LA LISTA DE LA COMPRA
   Solo emojis hasta la versión 12 (2019): los más nuevos salen como un
   cuadrado vacío en móviles algo viejos. Y ninguno que se preste a
   confusión: la seta del emoji es una seta venenosa roja con lunares, no
   un champiñón, así que no está.
   ========================================================== */
const PRODUCTOS = [
    { nombre: 'pan',          icono: '🍞', grupo: 'desayuno' },
    { nombre: 'leche',        icono: '🥛', grupo: 'desayuno' },
    { nombre: 'huevos',       icono: '🥚', grupo: 'desayuno' },
    { nombre: 'queso',        icono: '🧀', grupo: 'desayuno' },
    { nombre: 'café',         icono: '☕', grupo: 'desayuno' },
    { nombre: 'galletas',     icono: '🍪', grupo: 'desayuno' },
    { nombre: 'mantequilla',  icono: '🧈', grupo: 'desayuno' },

    { nombre: 'manzanas',     icono: '🍎', grupo: 'fruta' },
    { nombre: 'plátanos',     icono: '🍌', grupo: 'fruta' },
    { nombre: 'naranjas',     icono: '🍊', grupo: 'fruta' },
    { nombre: 'uvas',         icono: '🍇', grupo: 'fruta' },
    { nombre: 'fresas',       icono: '🍓', grupo: 'fruta' },
    { nombre: 'peras',        icono: '🍐', grupo: 'fruta' },
    { nombre: 'limones',      icono: '🍋', grupo: 'fruta' },
    { nombre: 'sandía',       icono: '🍉', grupo: 'fruta' },
    { nombre: 'piña',         icono: '🍍', grupo: 'fruta' },
    { nombre: 'cerezas',      icono: '🍒', grupo: 'fruta' },

    { nombre: 'tomates',      icono: '🍅', grupo: 'verdura' },
    { nombre: 'patatas',      icono: '🥔', grupo: 'verdura' },
    { nombre: 'zanahorias',   icono: '🥕', grupo: 'verdura' },
    { nombre: 'cebollas',     icono: '🧅', grupo: 'verdura' },
    { nombre: 'ajos',         icono: '🧄', grupo: 'verdura' },
    { nombre: 'lechuga',      icono: '🥬', grupo: 'verdura' },
    { nombre: 'pepino',       icono: '🥒', grupo: 'verdura' },
    { nombre: 'berenjena',    icono: '🍆', grupo: 'verdura' },
    { nombre: 'maíz',         icono: '🌽', grupo: 'verdura' },
    { nombre: 'brócoli',      icono: '🥦', grupo: 'verdura' },

    { nombre: 'pollo',        icono: '🍗', grupo: 'carne y pescado' },
    { nombre: 'pescado',      icono: '🐟', grupo: 'carne y pescado' },
    { nombre: 'gambas',       icono: '🦐', grupo: 'carne y pescado' },
    { nombre: 'filetes',      icono: '🥩', grupo: 'carne y pescado' },

    { nombre: 'arroz',        icono: '🍚', grupo: 'despensa' },
    { nombre: 'sal',          icono: '🧂', grupo: 'despensa' },
    { nombre: 'miel',         icono: '🍯', grupo: 'despensa' },
    { nombre: 'chocolate',    icono: '🍫', grupo: 'despensa' },
    { nombre: 'vino',         icono: '🍷', grupo: 'despensa' },

    { nombre: 'jabón',        icono: '🧼', grupo: 'limpieza' },
    { nombre: 'papel higiénico', icono: '🧻', grupo: 'limpieza' },
    { nombre: 'esponja',      icono: '🧽', grupo: 'limpieza' }
];

/* Cuántos productos hay que recordar y cuántos de más hay en la tienda.
   Nunca más de 9 en la tienda: con la letra al máximo en un móvil pequeño
   no caben más sin desplazar la pantalla, y desplazar es otra dificultad
   que no es la que se quiere entrenar. Desde el nivel 6 los que sobran son
   del mismo tipo que los de la lista (frutas entre frutas), que obliga a
   recordar de verdad y no a reconocer «algo de fruta». */
const NIVELES_COMPRA = [
    { lista: 2, otros: 2, parecidos: false },
    { lista: 2, otros: 4, parecidos: false },
    { lista: 3, otros: 3, parecidos: false },
    { lista: 3, otros: 6, parecidos: false },
    { lista: 4, otros: 5, parecidos: false },
    { lista: 4, otros: 5, parecidos: true },
    { lista: 5, otros: 4, parecidos: true },
    { lista: 6, otros: 3, parecidos: true }
];

/* `evitar`: nombres de la lista anterior, para que no se repita la compra */
function rondaCompra(nivel, azar, evitar) {
    const cfg = NIVELES_COMPRA[Math.min(nivel, NIVELES_COMPRA.length) - 1];
    const fuera = new Set(evitar || []);
    const candidatos = PRODUCTOS.filter(p => !fuera.has(p.nombre));

    const lista = barajar(candidatos, azar).slice(0, cfg.lista);
    const enLista = new Set(lista.map(p => p.nombre));
    const resto = barajar(PRODUCTOS.filter(p => !enLista.has(p.nombre)), azar);

    let otros;
    if (cfg.parecidos) {
        const grupos = new Set(lista.map(p => p.grupo));
        const mismos = resto.filter(p => grupos.has(p.grupo));
        const distintos = resto.filter(p => !grupos.has(p.grupo));
        otros = mismos.concat(distintos).slice(0, cfg.otros);
    } else {
        otros = resto.slice(0, cfg.otros);
    }
    return { lista, tienda: barajar(lista.concat(otros), azar) };
}

/* Nivel: cuántos finales se ofrecen y hasta qué fama de refrán entra */
const NIVELES_REFRANES = [
    { opciones: 2, fama: 1 },
    { opciones: 3, fama: 1 },
    { opciones: 3, fama: 2 },
    { opciones: 4, fama: 2 }
];

const primeraPalabra = (t) => t.toLowerCase().split(/\s+/)[0];
const dosPalabras = (t) => t.toLowerCase().split(/\s+/).slice(0, 2).join(' ');

/* Un final de otro refrán que empiece igual que este («Más vale…») no sirve
   de distractor: «Más vale prevenir que nunca» casi suena bien, y para
   quien duda eso no es un reto, es una trampa. */
function sirveDeDistractor(objetivo, otro) {
    if (otro === objetivo || otro.final === objetivo.final) return false;
    return dosPalabras(otro.inicio) !== dosPalabras(objetivo.inicio) &&
           primeraPalabra(otro.inicio) !== primeraPalabra(objetivo.inicio);
}

/* `usados`: inicios ya salidos en la sesión, para no repetir refrán */
function rondaRefran(nivel, azar, usados) {
    const cfg = NIVELES_REFRANES[Math.min(nivel, NIVELES_REFRANES.length) - 1];
    const vistos = new Set(usados || []);
    let pool = REFRANES.filter(r => r.fama <= cfg.fama && !vistos.has(r.inicio));
    if (!pool.length) pool = REFRANES.filter(r => r.fama <= cfg.fama);

    const refran = pool[Math.floor(azar() * pool.length)];
    const distractores = barajar(REFRANES.filter(r => sirveDeDistractor(refran, r)), azar)
        .slice(0, cfg.opciones - 1)
        .map(r => r.final);
    return { refran, opciones: barajar([refran.final].concat(distractores), azar) };
}

/* ==========================================================

   Cuatro colores escalonados también en CLARIDAD, no solo en tono: así se
   distinguen con la vista borrosa, con el cristalino amarillento de la edad
   o con daltonismo. Los colores del Simón de toda la vida (rojo, verde,
   azul, amarillo) se midieron y el rojo y el verde tenían la misma claridad
   (1,03:1): con daltonismo rojo-verde eran el mismo botón.
   Medido con prueba-logica.js (distancia ΔE en CIELAB entre el par más
   parecido, con daltonismo simulado según Machado y otros, 2009):
     azul y naranja → ≥ 53 en los cuatro casos, claridad ≥ 2:1  (la de serie)
     clásicos       → 35 normal, 15-19 con daltonismo rojo-verde
     grises         → 25 en todos (no usa el color), claridad ≥ 1,8:1
   Cada botón lleva además forma y nombre: el color nunca va solo. La forma
   va pintada en `tinta` sobre el color (≥ 3:1); el nombre, en una etiqueta
   blanca aparte, porque escrito sobre los colores de claridad media no
   llegaba a 7:1 ni en blanco ni en negro. */

/* ==========================================================
   REPITE LOS COLORES
   Una secuencia por ronda, que no crece dentro de la ronda como en el
   Simón clásico: así cada ronda es corta y se puede repetir sin agobio.
   ========================================================== */
const NIVELES_SIMON = [
    { botones: 2, largo: 2 },
    { botones: 3, largo: 2 },
    { botones: 3, largo: 3 },
    { botones: 4, largo: 3 },
    { botones: 4, largo: 4 },
    { botones: 4, largo: 5 },
    { botones: 4, largo: 6 }
];

/* Nunca el mismo botón tres veces seguidas (se ve como uno que no se
   apaga) y siempre al menos dos botones distintos en la secuencia */
function rondaSimon(nivel, azar) {
    const cfg = NIVELES_SIMON[Math.min(nivel, NIVELES_SIMON.length) - 1];
    let secuencia;
    do {
        secuencia = [];
        while (secuencia.length < cfg.largo) {
            const b = Math.floor(azar() * cfg.botones);
            const n = secuencia.length;
            if (n >= 2 && secuencia[n - 1] === b && secuencia[n - 2] === b) continue;
            secuencia.push(b);
        }
    } while (new Set(secuencia).size < 2);
    return { botones: cfg.botones, secuencia };
}

/* Del más fácil (euros enteros con monedas de 1 y 2) al de cualquier

const NIVELES_MONEDAS = [

       con ellas el monedero no cabía en un móvil */
    { valores: [5, 10, 20, 50, 100, 200, 500, 1000],      minimo: 600, maximo: 2000, paso: 5 }
];

function precioMonedas(nivel, azar, evitar) {
    const cfg = NIVELES_MONEDAS[Math.min(nivel, NIVELES_MONEDAS.length) - 1];
    const pasos = Math.floor((cfg.maximo - cfg.minimo) / cfg.paso) + 1;
    let precio;
    do {
        precio = cfg.minimo + Math.floor(azar() * pasos) * cfg.paso;
    } while (precio === evitar && pasos > 1);
    return { precio, valores: cfg.valores };
}

/* La ayuda: la moneda o billete más grande que no se pasa de lo que falta.
   Con los valores del euro eso da siempre el pago con menos piezas
   (prueba-logica.js lo compara con el mínimo exacto). */
function siguientePieza(falta, valores) {
    const caben = valores.filter(v => v <= falta);
    return caben.length ? Math.max(...caben) : -1;
}

/* 2,35 € → «2 euros con 35 céntimos»; la voz lee mejor las cifras sueltas */
function importeEnTexto(centimos) {
    const e = Math.floor(centimos / 100), c = centimos % 100;
    const euros = e === 1 ? '1 euro' : e + ' euros';
    const cents = c === 1 ? '1 céntimo' : c + ' céntimos';
    if (!c) return euros;
    if (!e) return cents;
    return euros + ' con ' + cents;
}
const importeEnCifra = (centimos) => Math.floor(centimos / 100) + ',' + String(centimos % 100).padStart(2, '0') + ' €';

function rondaCambio(nivel, azar, evitar) {

/* Con menos pasos que la tarea se quitan del medio: el primero y el último
   se quedan siempre, que son los que dan sentido a la tarea */
function rondaOrden(nivel, azar, evitar) {
    const n = NIVELES_ORDEN[Math.min(nivel, NIVELES_ORDEN.length) - 1].pasos;
    let candidatas = TAREAS.filter(t => t.pasos.length >= n && t.nombre !== evitar);
    if (!candidatas.length) candidatas = TAREAS.filter(t => t.pasos.length >= n);
    const tarea = candidatas[Math.floor(azar() * candidatas.length)];
    const medio = barajar(tarea.pasos.slice(1, -1).map((_, i) => i + 1), azar).slice(0, n - 2).sort((a, b) => a - b);
    const pasos = [0].concat(medio, [tarea.pasos.length - 1]).map(i => tarea.pasos[i]);
    /* Desordenados de verdad: si el azar los deja en su sitio, no hay juego */
    let barajados;
    do { barajados = barajar(pasos, azar); } while (barajados.every((p, i) => p === pasos[i]));
    return { tarea: tarea.nombre, pasos, barajados };
}

/* Cada grupo sale al menos una vez, y nada se repite */
function rondaClasificar(nivel, azar) {
    const cfg = NIVELES_CLASIFICAR[Math.min(nivel, NIVELES_CLASIFICAR.length) - 1];
    const c = CLASIFICACIONES[cfg.clasificacion];
    const bolsas = c.grupos.map(g => barajar(g.cosas, azar));
    const cosas = [];
    for (let k = 0; cosas.length < cfg.cosas; k++) {
        const g = k < c.grupos.length ? k : Math.floor(azar() * c.grupos.length);
        const obj = bolsas[g].pop();
        if (obj) cosas.push({ obj, grupo: g });
    }
    return { pregunta: c.pregunta, grupos: c.grupos.map(g => ({ nombre: g.nombre, icono: g.icono })), cosas: barajar(cosas, azar) };
}

   MEMORY (de oído y de fotos)
   Un jugador con memoria perfecta falla, como mucho, parejas − 1 veces:
   las que no puede evitar porque aún no ha visto la carta compañera
   (medido en 20.000 partidas por tamaño, de 2 a 6 parejas; nunca más).
   Así que solo cuentan como error los fallos de más.
   ========================================================== */
function erroresMemoria(fallos, pares) {
    return Math.max(0, fallos - (pares - 1));
}

/* Palabras que no se parezcan al oído: nada de sol/col ni pan/flan */
const PALABRAS_OIDO = [
    { nombre: 'gato', icono: '🐈' }, { nombre: 'luna', icono: '🌙' }, { nombre: 'reloj', icono: '⏰' },
    { nombre: 'flor', icono: '🌷' }, { nombre: 'coche', icono: '🚗' }, { nombre: 'árbol', icono: '🌳' },
    { nombre: 'campana', icono: '🔔' }, { nombre: 'llave', icono: '🔑' }, { nombre: 'zapato', icono: '👞' },
    { nombre: 'naranja', icono: '🍊' }, { nombre: 'libro', icono: '📕' }, { nombre: 'guitarra', icono: '🎸' },
    { nombre: 'pelota', icono: '⚽' }, { nombre: 'caballo', icono: '🐎' }, { nombre: 'paraguas', icono: '☂️' },
    { nombre: 'tren', icono: '🚂' }
];
const NIVELES_OIDO = [{ pares: 2 }, { pares: 3 }, { pares: 4 }, { pares: 5 }, { pares: 6 }];
const NIVELES_FOTOS = [{ pares: 2 }, { pares: 3 }, { pares: 4 }, { pares: 6 }];

function barajarParejas(cosas, pares, azar) {
    const elegidas = barajar(cosas, azar).slice(0, pares);
    return barajar(elegidas.concat(elegidas).map((c, i) => ({ id: i, cosa: c })), azar);
}

function rondaOido(nivel, azar) {
    const pares = NIVELES_OIDO[Math.min(nivel, NIVELES_OIDO.length) - 1].pares;
    return { pares, cartas: barajarParejas(PALABRAS_OIDO, pares, azar) };
}

/* Con fotos: nunca más parejas que fotos haya cargado */
function rondaFotos(nivel, azar, fotos) {
    const quiere = NIVELES_FOTOS[Math.min(nivel, NIVELES_FOTOS.length) - 1].pares;
    const pares = Math.min(quiere, fotos.length);
    return { pares, cartas: barajarParejas(fotos, pares, azar) };
}
</script>
<script>
/* ==========================================================
   BASE DE LOS JUEGOS PARA MAYORES
   Lo común a todos: barra de arriba, tamaño de letra, voz, sonidos suaves,
   memoria del nivel y protección contra toques dobles.

   Uso:
     const M = Mayores.iniciar({ id: 'compra', nivelMaximo: 8 });
     M.tocar(boton, () => ...);   M.decir('texto');   M.sonar('bien');
     M.mostrar('juego');   M.nivel   M.anotar('bien' | 'mal')
   ========================================================== */
const Mayores = (() => {
    /* 18, 21, 23 y 26 px. Un escalón de 29 px se probó y en un móvil de
       360 de ancho dejaba ocho letras por renglón: el refrán solo ocupaba
       media pantalla y no cabían ni dos respuestas. */
    const ESCALAS = [1, 1.15, 1.3, 1.45];
    const ANTIRREBOTE_MS = 450;

    /* localStorage falla en navegación privada y en algunos iframes: se
       cae a memoria y el juego sigue, solo que sin recordar entre visitas */
    const memoria = {};
    function leer(clave, porDefecto) {
        try {
            const v = localStorage.getItem(clave);
            return v === null ? porDefecto : JSON.parse(v);
        } catch (e) {
            return clave in memoria ? memoria[clave] : porDefecto;
        }
    }
    function guardar(clave, valor) {
        memoria[clave] = valor;
        try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
    }

    /* ---------- VOZ ----------
       La del propio navegador: en Android e iPhone habla castellano sin
       instalar nada. Un poco más lenta que la normal (0,9). */
    let vozElegida = null;
    function elegirVoz() {
        if (!('speechSynthesis' in window)) return;
        const voces = speechSynthesis.getVoices();
        vozElegida = voces.find(v => v.lang === 'es-ES') ||
                     voces.find(v => /^es[-_]/i.test(v.lang)) || null;
    }
    if ('speechSynthesis' in window) {
        elegirVoz();
        /* En Chrome la lista de voces llega más tarde que la página */
        speechSynthesis.addEventListener('voiceschanged', elegirVoz);
    }

    /* ---------- SONIDOS ----------
       El acierto suena a campanilla; el error, a un «toc» grave y corto.
       Nada de zumbidos de «has fallado». El contexto de audio se crea con
       el primer toque, que es cuando el navegador deja. */
    let ctxAudio = null;
    function audio() {
        if (ctxAudio) return ctxAudio;
        try { ctxAudio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctxAudio = null; }
        return ctxAudio;
    }
    function nota(frec, inicio, dur, vol) {
        const ctx = audio();
        if (!ctx) return;
        const t = ctx.currentTime + inicio;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = frec;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(ctx.destination);
        o.start(t);
        o.stop(t + dur + 0.05);
    }

    /* Tarjeta de objeto (producto, cosa de la mesa): dibujo y nombre siempre
       juntos. El dibujo cambia de un móvil a otro y la palabra es lo que de
       verdad se recuerda. */
    function tarjeta(p, etiqueta) {
        const el = document.createElement(etiqueta || 'div');
        el.className = 'producto';
        if (etiqueta === 'button') el.type = 'button';
        el.innerHTML = '<span class="icono" aria-hidden="true"></span><span class="nombre"></span>';
        el.querySelector('.icono').textContent = p.icono;
        el.querySelector('.nombre').textContent = p.nombre;
        el.dataset.nombre = p.nombre;
        return el;
    }

    /* Dos columnas con pocas tarjetas (sin hueco suelto en la última fila), o
       cuando en tres el nombre bajaría del 85 % de la letra elegida: el nombre
       ocupa el 15 % del ancho de DENTRO de la tarjeta (ver .nombre en el CSS),
       así que se descuentan su relleno (0,2rem por lado) y su borde (3 px).
       Sin descontarlos, «papel higiénico» salía a 13,7 px en un móvil de 360. */
    function columnasPara(n, contenedor) {
        if (n <= 2) return Math.max(1, n);
        if (n === 4) return 2;
        const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
        const ancho = (contenedor || document.querySelector('main')).clientWidth;
        const dentroEn3 = (ancho - 2 * 0.5 * rem) / 3 - 0.4 * rem - 6;
        /* Tres en una sola fila cuando caben: en dos columnas, tres tarjetas
           ocupan dos filas, y en ¿Qué falta? eso solo ya no cabía */
        return dentroEn3 * 0.15 >= 0.85 * rem ? 3 : 2;
    }

    function iniciar(opciones) {
        const id = opciones.id;
        const nivelMaximo = opciones.nivelMaximo || 1;
        let escala = Math.min(ESCALAS.length - 1, Math.max(0, leer('mayores.letra', 1)));
        let sonido = leer('mayores.sonido', true);
        /* La paleta de los juegos de botones de colores: la elige quien
           juega, según la que mejor distinga, y vale para todos */
        let paletaId = leer('mayores.paleta', PALETAS[0].id);
        if (!PALETAS.some(p => p.id === paletaId)) paletaId = PALETAS[0].id;
        let estadoNivel = leer('mayores.' + id + '.nivel', nivelInicial());
        if (!estadoNivel || typeof estadoNivel.nivel !== 'number') estadoNivel = nivelInicial();
        estadoNivel.nivel = Math.min(nivelMaximo, Math.max(1, estadoNivel.nivel));

        /* ---------- barra de arriba ---------- */
        const barra = document.createElement('div');
        barra.className = 'barra';
        barra.innerHTML =
            '<button type="button" class="salir" data-b="salir" aria-label="Salir al portal de juegos">← Salir</button>' +
            '<button type="button" data-b="menos" aria-label="Letra más pequeña">A−</button>' +
            '<button type="button" data-b="mas" aria-label="Letra más grande">A+</button>' +
            '<button type="button" data-b="sonido"></button>';
        document.body.insertBefore(barra, document.body.firstChild);
        const bMenos = barra.querySelector('[data-b="menos"]');
        const bMas = barra.querySelector('[data-b="mas"]');
        const bSonido = barra.querySelector('[data-b="sonido"]');

        function aplicarEscala() {
            document.documentElement.style.setProperty('--escala', ESCALAS[escala]);
            bMenos.disabled = escala === 0;
            bMas.disabled = escala === ESCALAS.length - 1;
        }
        function aplicarSonido() {
            bSonido.textContent = sonido ? '🔊' : '🔇';
            bSonido.setAttribute('aria-label', sonido ? 'Quitar el sonido' : 'Poner el sonido');
            bSonido.setAttribute('aria-pressed', String(sonido));
        }
        aplicarEscala();
        aplicarSonido();

        /* ---------- toques ----------
           Un toque doble involuntario no debe contar como dos respuestas:
           se ignora todo toque que llegue antes de ANTIRREBOTE_MS del
           anterior que sí se atendió. */
        /* Cada juego puede querer recolocar su pantalla al cambiar la letra */
        const avisosLetra = [];

        let ultimoToque = 0;
        function tocar(el, accion) {
            el.addEventListener('click', (e) => {
                const ahora = Date.now();
                if (ahora - ultimoToque < ANTIRREBOTE_MS) { e.preventDefault(); return; }
                ultimoToque = ahora;
                audio();
                if (ctxAudio && ctxAudio.state === 'suspended') ctxAudio.resume();
                accion(e);
            });
        }

        const cambiarLetra = (d) => {
            const nueva = Math.min(ESCALAS.length - 1, Math.max(0, escala + d));
            if (nueva === escala) return;
            escala = nueva;
            guardar('mayores.letra', escala);
            aplicarEscala();
            avisosLetra.forEach(f => f());
        };
        tocar(bMenos, () => cambiarLetra(-1));
        tocar(bMas, () => cambiarLetra(1));
        tocar(bSonido, () => {
            sonido = !sonido;
            guardar('mayores.sonido', sonido);
            aplicarSonido();
            if (!sonido && 'speechSynthesis' in window) speechSynthesis.cancel();
            else decir('Sonido puesto');
        });
        tocar(barra.querySelector('[data-b="salir"]'), () => {
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            /* Los juegos viven en webs/ y la portada en la raíz */
            location.href = '../';
        });

        function decir(texto) {
            if (!sonido || !('speechSynthesis' in window) || !texto) return;
            try {
                /* cancel antes de hablar: si no, las frases se encolan y la
                   voz va contando lo de hace tres toques */
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(texto);
                u.lang = 'es-ES';
                if (vozElegida) u.voice = vozElegida;
                u.rate = 0.9;
                /* Chrome a veces deja la síntesis en pausa tras pasar la
                   pestaña a segundo plano, y speak() ya no suena */
                speechSynthesis.resume();
                speechSynthesis.speak(u);
            } catch (e) {}
        }

        /* Un tono por botón: do, mi, sol y do agudo. Suenan bien juntos y
           se distinguen sin ver el color */
        const TONOS = [262, 330, 392, 523];
        function tono(i, dur) {
            if (sonido) nota(TONOS[i % TONOS.length], 0, (dur || 600) / 1000, 0.2);
        }

        function sonar(tipo) {
            if (!sonido) return;
            if (tipo === 'bien') { nota(784, 0, 0.25, 0.18); nota(1047, 0.12, 0.35, 0.16); }
            else if (tipo === 'fin') { nota(659, 0, 0.3, 0.16); nota(784, 0.15, 0.3, 0.16); nota(1047, 0.3, 0.5, 0.16); }
            else nota(220, 0, 0.18, 0.12);
        }

        function mostrar(idPantalla) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.toggle('activa', p.id === idPantalla));
            window.scrollTo(0, 0);
            /* El foco a la pantalla nueva: quien navega con lector de
               pantalla o teclado no se queda en un botón que ya no se ve */
            const h = document.querySelector('#' + idPantalla + ' [data-foco]') ||
                      document.querySelector('#' + idPantalla + ' h1');
            if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && 'speechSynthesis' in window) speechSynthesis.cancel();
        });

        /* ¿Cabe la pantalla sin desplazar? Se mide lo que de verdad se ve,
           no se estima: el tamaño de letra, la pantalla y hasta la fuente
           del sistema cambian de un aparato a otro. Se mira también el
           ancho, porque una rejilla con una palabra larga puede ensanchar
           la página en vez de bajar de línea. */
        function cabe() {
            const raiz = document.scrollingElement || document.documentElement;
            const ancho = document.documentElement.clientWidth;
            const sale = [...document.querySelectorAll('.pantalla.activa *')]
                .some(e => e.offsetParent !== null && e.getBoundingClientRect().right > ancho + 1);
            /* Sin tolerancia: con 1 px de margen se colaban pantallas que se
               pasaban justo ese píxel y obligaban a desplazar */
            return raiz.scrollHeight <= window.innerHeight && !sale;
        }

        /* Reservar el alto del mensaje más largo que puede salir en una pista.
           Sin esto, al fallar, «¿Qué se hace primero?» pasaba a «Eso se hace
           más tarde. ¿Qué se hace primero?», ocupaba un renglón más y todo lo
           de debajo bajaba: la tarjeta siguiente ya no estaba bajo el dedo.
           `medido` es el bloque que ocupa sitio; `texto`, dónde va el mensaje
           (el mismo elemento o uno de dentro). Se recalcula al cambiar la
           letra, y como deja puesto el min-height, cabe() ya lo cuenta. */
        const reservas = new Map();
        function reservar(medido, textos, texto) {
            texto = texto || medido;
            reservas.set(medido, { textos, texto });
            const antes = texto.textContent;
            medido.style.minHeight = '';
            let alto = 0;
            for (const t of textos) {
                texto.textContent = t;
                alto = Math.max(alto, medido.getBoundingClientRect().height);
            }
            texto.textContent = antes;
            medido.style.minHeight = Math.ceil(alto) + 'px';
        }
        avisosLetra.push(() => reservas.forEach((r, el) => { if (el.offsetParent !== null) reservar(el, r.textos, r.texto); }));

        return {
            tocar, decir, sonar, tono, mostrar, cabe, tarjeta, columnasPara, reservar,
            get paleta() { return PALETAS.find(p => p.id === paletaId); },
            elegirPaleta(id) {
                if (!PALETAS.some(p => p.id === id)) return;
                paletaId = id;
                guardar('mayores.paleta', id);
            },
            alCambiarLetra(f) { avisosLetra.push(f); },
            get letraGrande() { return escala >= 2; },
            get nivel() { return estadoNivel.nivel; },
            anotar(resultado) {
                estadoNivel = adaptarNivel(estadoNivel, resultado, nivelMaximo);
                guardar('mayores.' + id + '.nivel', estadoNivel);
                return estadoNivel.nivel;
            },
            get hayVoz() { return 'speechSynthesis' in window; },
            get sonidoActivo() { return sonido; }
        };
    }

    return { iniciar };
})();
</script>
<script>
/* ==========================================================
   PAGA JUSTO
   Nunca se pierde: si se pasa, se le dice y se quita tocando la moneda.
   A los dos errores (o con AYÚDAME) brilla la pieza que toca poner, o la
   que sobra si se ha pasado.
   ========================================================== */
const RONDAS = 5;
const ERRORES_ANTES_DE_AYUDAR = 2;

const M = Mayores.iniciar({ id: 'monedas', nivelMaximo: NIVELES_MONEDAS.length });
const $ = (id) => document.getElementById(id);

const partida = { ronda: 0, precio: 0, valores: [], puestas: [], errores: 0, ayudas: 0, resuelta: false, anterior: -1 };

if (!M.hayVoz) $('btnOir').style.display = 'none';

const datosDe = (valor) => DINERO.find(d => d.valor === valor);
const etiqueta = (valor) => (valor >= 100 ? (valor / 100) + ' €' : valor + ' c');
const nombreLargo = (valor) => (valor >= 500 ? 'billete de ' + (valor / 100) + ' euros' : importeEnTexto(valor));

function pieza(valor) {
    const d = datosDe(valor);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pieza ' + (d.tipo === 'billete' ? 'billete b' + valor : 'moneda ' + d.tipo);
    if (d.mm) b.style.setProperty('--mm', d.mm);
    b.innerHTML = '<span class="valor"></span>';
    b.querySelector('.valor').textContent = etiqueta(valor);
    b.dataset.valor = valor;
    return b;
}

const suma = () => partida.puestas.reduce((a, b) => a + b, 0);

function pintarMonedero() {
    const m = $('monedero');
    m.innerHTML = '';
    partida.valores.forEach(v => {
        const b = pieza(v);
        b.setAttribute('aria-label', 'Poner ' + nombreLargo(v));
        M.tocar(b, () => poner(v));
        m.appendChild(b);
    });
}

function pintarBandeja() {
    const ban = $('bandeja');
    ban.innerHTML = '';
    /* Una etiqueta por tipo, de mayor a menor, con cuántas lleva */
    const cuantas = {};
    partida.puestas.forEach(v => { cuantas[v] = (cuantas[v] || 0) + 1; });
    Object.keys(cuantas).map(Number).sort((a, b) => b - a).forEach(v => {
        const d = datosDe(v);
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ficha';
        b.dataset.valor = v;
        b.innerHTML = '<span class="punto ' + (d.tipo === 'billete' ? 'billete b' + v : d.tipo) + '"></span><span></span>';
        b.lastChild.textContent = etiqueta(v) + (cuantas[v] > 1 ? ' ×' + cuantas[v] : '');
        b.setAttribute('aria-label', 'Quitar ' + nombreLargo(v) + (cuantas[v] > 1 ? ', tienes ' + cuantas[v] : ''));
        M.tocar(b, () => quitar(v));
        ban.appendChild(b);
    });
    const s = suma();
    const p = $('puesto');
    p.textContent = 'Has puesto: ' + importeEnCifra(s);
    p.classList.toggle('justo', s === partida.precio);
    p.classList.toggle('pasado', s > partida.precio);
}

function quitarAyudas() { document.querySelectorAll('.ayuda').forEach(b => b.classList.remove('ayuda')); }

function poner(v) {
    if (partida.resuelta) return;
    quitarAyudas();
    partida.puestas.push(v);
    pintarBandeja();
    const s = suma();
    if (s === partida.precio) return resuelta();
    if (s > partida.precio) {
        partida.errores++;
        M.sonar('suave');
        $('pista').textContent = 'Te has pasado. Toca una de las de abajo para quitarla.';
        M.decir('Te has pasado. Toca una de las de abajo para quitarla.');
        if (partida.errores >= ERRORES_ANTES_DE_AYUDAR) senalar();
        return;
    }
    M.tono(1, 120);
    $('pista').textContent = 'Te faltan ' + importeEnCifra(partida.precio - s);
    M.decir(nombreLargo(v) + '. Te faltan ' + importeEnTexto(partida.precio - s) + '.');
}

function quitar(v) {
    if (partida.resuelta) return;
    quitarAyudas();
    const k = partida.puestas.lastIndexOf(v);
    if (k === -1) return;
    partida.puestas.splice(k, 1);
    pintarBandeja();
    const s = suma();
    if (s === partida.precio) return resuelta();
    $('pista').textContent = s > partida.precio ? 'Todavía te pasas.' : 'Te faltan ' + importeEnCifra(partida.precio - s);
    M.decir('Quitas ' + nombreLargo(v) + '.');
}

/* Si se ha pasado, brilla la última que puso (la que sobra); si no, la
   pieza más grande que no se pasa de lo que falta */
function senalar() {
    quitarAyudas();
    const s = suma();
    if (s > partida.precio) {
        /* La que sobra es la última que puso */
        const ultima = partida.puestas[partida.puestas.length - 1];
        const f = $('bandeja').querySelector('[data-valor="' + ultima + '"]');
        if (f) f.classList.add('ayuda');
        $('pista').textContent = 'Quita la que brilla.';
        M.decir('Quita la que brilla.');
        return;
    }
    const v = siguientePieza(partida.precio - s, partida.valores);
    const b = $('monedero').querySelector('[data-valor="' + v + '"]');
    if (b) b.classList.add('ayuda');
    $('pista').textContent = 'Pon la que brilla: ' + etiqueta(v) + '.';
    M.decir('Pon ' + nombreLargo(v) + '.');
}

function resuelta() {
    partida.resuelta = true;
    M.anotar(resultadoDeRonda(partida.errores, partida.ayudas));
    document.querySelectorAll('#monedero .pieza, #bandeja .ficha').forEach(b => { b.disabled = true; });
    M.sonar('bien');
    $('pista').textContent = '¡Justo! Muy bien.';
    M.decir('¡Justo! Muy bien.');
    $('btnAyuda').style.display = 'none';
    $('btnSiguiente').textContent = partida.ronda >= RONDAS ? 'TERMINAR' : 'SIGUIENTE';
    $('btnSiguiente').style.display = '';
}

function decirPrecio() { M.decir('Hay que pagar ' + importeEnTexto(partida.precio) + '.'); }

function nuevaRonda() {
    partida.ronda++;
    const r = precioMonedas(M.nivel, Math.random, partida.anterior);
    partida.precio = r.precio;
    partida.anterior = r.precio;
    partida.valores = r.valores;
    partida.puestas = [];
    partida.errores = 0;
    partida.ayudas = 0;
    partida.resuelta = false;
    $('precio').textContent = importeEnCifra(r.precio);
    $('pista').textContent = '';
    pintarMonedero();
    pintarBandeja();
    $('btnAyuda').style.display = '';
    $('btnSiguiente').style.display = 'none';
    M.mostrar('juego');
    M.reservar($('pista'), ['Te faltan ' + importeEnCifra(r.precio), 'Te has pasado. Toca una de las de abajo para quitarla.',
        'Todavía te pasas.', 'Quita la que brilla.', 'Pon la que brilla: 50 c.', '¡Justo! Muy bien.']);
    decirPrecio();
}

function empezarSesion() { partida.ronda = 0; nuevaRonda(); }

function terminarSesion() {
    $('textoFinal').textContent = 'Has pagado ' + RONDAS + ' veces justo.';
    M.sonar('fin');
    M.mostrar('final');
    M.decir('¡Muy bien! Has pagado ' + RONDAS + ' veces justo.');
}

M.tocar($('btnEmpezar'), empezarSesion);
M.tocar($('btnOir'), decirPrecio);
M.tocar($('btnAyuda'), () => { if (!partida.resuelta) { partida.ayudas++; senalar(); } });
M.tocar($('btnSiguiente'), () => (partida.ronda >= RONDAS ? terminarSesion() : nuevaRonda()));
M.tocar($('btnOtraVez'), empezarSesion);
M.tocar($('btnSalirFinal'), () => { location.href = '../'; });
</script>
