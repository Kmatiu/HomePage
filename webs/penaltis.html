                this.ctx.arc(x - radius * 0.28, y - radius * 0.28, radius * 0.18, 0, Math.PI * 2);
                this.ctx.fill();
            }
            
            drawAimingLine() {
                this.ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
                this.ctx.lineWidth = 6;
                this.ctx.setLineDash([20, 14]);
                this.ctx.beginPath();
                this.ctx.moveTo(this.penaltyX, this.penaltyY);
                this.ctx.lineTo(this.mouseX, this.mouseY);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
                
                const angle = Math.atan2(this.mouseY - this.penaltyY, this.mouseX - this.penaltyX);
                const arrowSize = 38;
                
                this.ctx.fillStyle = 'rgba(255, 255, 0, 0.9)';
                this.ctx.strokeStyle = 'rgba(255, 150, 0, 0.95)';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(this.mouseX, this.mouseY);
                this.ctx.lineTo(
                this.mouseX - arrowSize * Math.cos(angle - Math.PI / 6),
                this.mouseY - arrowSize * Math.sin(angle - Math.PI / 6)
                );
                this.ctx.lineTo(
                this.mouseX - arrowSize * Math.cos(angle + Math.PI / 6),
                this.mouseY - arrowSize * Math.sin(angle + Math.PI / 6)
                );
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                
                this.ctx.strokeStyle = 'rgba(255, 100, 0, 1)';
                this.ctx.lineWidth = 6;
                this.ctx.beginPath();
                this.ctx.arc(this.mouseX, this.mouseY, 28, 0, Math.PI * 2);
                this.ctx.stroke();
                
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 1)';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(this.mouseX - 35, this.mouseY);
                this.ctx.lineTo(this.mouseX + 35, this.mouseY);
                this.ctx.moveTo(this.mouseX, this.mouseY - 35);
                this.ctx.lineTo(this.mouseX, this.mouseY + 35);
                this.ctx.stroke();
            }
            
            drawPowerBar() {
                if (!this.canShoot && !this.charging) return;
                
                const barWidth = 440;
                const barHeight = 60;
                const barX = this.canvas.width / 2- barWidth / 2;
                const barY = this.canvas.height - 140;
                
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                this.ctx.fillRect(barX - 8, barY - 8, barWidth + 16, barHeight + 16);
                
                const optimalStart = barWidth * 0.35;
                const optimalWidth = barWidth * 0.3;
                
                this.ctx.fillStyle = 'rgba(0, 255, 0, 0.4)';
                this.ctx.fillRect(barX + optimalStart, barY, optimalWidth, barHeight);
                
                this.ctx.fillStyle = 'rgba(255, 255, 0, 0.4)';
                this.ctx.fillRect(barX + optimalStart * 0.5, barY, optimalStart * 0.5, barHeight);
                this.ctx.fillRect(barX + optimalStart + optimalWidth, barY, optimalStart * 0.5, barHeight);
                
                this.ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                this.ctx.fillRect(barX, barY, optimalStart * 0.5, barHeight);
                this.ctx.fillRect(barX + optimalStart + optimalWidth + optimalStart * 0.5, barY, 
                barWidth - (optimalStart + optimalWidth + optimalStart * 0.5), barHeight);
                
                const indicatorX = barX + this.powerBar.value * barWidth;
                
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                this.ctx.beginPath();
                this.ctx.moveTo(indicatorX + 3, barY - 14 + 3);
                this.ctx.lineTo(indicatorX - 16 + 3, barY + 3);
                this.ctx.lineTo(indicatorX + 16 + 3, barY + 3);
                this.ctx.closePath();
                this.ctx.fill();
                
                this.ctx.beginPath();
                this.ctx.moveTo(indicatorX + 3, barY + barHeight + 14 + 3);
                this.ctx.lineTo(indicatorX - 16 + 3, barY + barHeight + 3);
                this.ctx.lineTo(indicatorX + 16 + 3, barY + barHeight + 3);
                this.ctx.closePath();
                this.ctx.fill();
                
                let indicatorColor;
                if (this.powerBar.value >= 0.35 && this.powerBar.value <= 0.65) {
                    indicatorColor = '#00FF00';
                } else if (this.powerBar.value >= 0.2 && this.powerBar.value <= 0.8) {
                    indicatorColor = '#FFFF00';
                } else {
                    indicatorColor = '#FF0000';
                }
                
                this.ctx.fillStyle = indicatorColor;
                this.ctx.strokeStyle = '#FFF';
                this.ctx.lineWidth = 4;
                
                this.ctx.beginPath();
                this.ctx.moveTo(indicatorX, barY - 14);
                this.ctx.lineTo(indicatorX - 16, barY);
                this.ctx.lineTo(indicatorX + 16, barY);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                
                this.ctx.beginPath();
                this.ctx.moveTo(indicatorX, barY + barHeight + 14);
                this.ctx.lineTo(indicatorX - 16, barY + barHeight);
                this.ctx.lineTo(indicatorX + 16, barY + barHeight);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                
                this.ctx.strokeStyle = indicatorColor;
                this.ctx.lineWidth = 6;
                this.ctx.beginPath();
                this.ctx.moveTo(indicatorX, barY);
                this.ctx.lineTo(indicatorX, barY + barHeight);
                this.ctx.stroke();
                
                this.ctx.strokeStyle = '#FFF';
                this.ctx.lineWidth = 5;
                this.ctx.strokeRect(barX, barY, barWidth, barHeight);
                
                this.ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                this.ctx.shadowBlur = 12;
                this.ctx.fillStyle = 'white';
                this.ctx.font = 'bold 24px Arial';
                this.ctx.textAlign = 'center';
                
                let powerText;
                if (this.powerBar.value >= 0.35 && this.powerBar.value <= 0.65) {
                    powerText = '✓ POTENCIA ÓPTIMA';
                } else if (this.powerBar.value >= 0.2 && this.powerBar.value <= 0.8) {
                    powerText = '⚠ ARRIESGADO';
                } else {
                    powerText = '✗ ¡MUY PELIGROSO!';
                }
                
                this.ctx.fillText(powerText, this.canvas.width / 2, barY - 32);
                this.ctx.fillText('¡Suelta para disparar!', this.canvas.width / 2, barY + barHeight + 42);
                this.ctx.shadowBlur = 0;
            }
            
            drawHeightBar() {
                const barX = this.canvas.width - 90;
                const barY = this.canvas.height / 2 - 300;
                const barHeight = 600;
                
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                this.ctx.fillRect(barX - 8, barY - 8, 52, barHeight + 16);
                
                const goalTop = this.goalCenterY - this.goalHeight3D / 2;
                const goalBottom = this.goalCenterY + this.goalHeight3D / 2;
                const goalTopBar = barY + (goalTop / this.canvas.height) * barHeight;
                const goalHeightBar = ((goalBottom - goalTop) / this.canvas.height) * barHeight;
                
                this.ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                this.ctx.fillRect(barX, goalTopBar, 36, goalHeightBar);
                
                const barGradient = this.ctx.createLinearGradient(barX, barY, barX, barY + barHeight);
                barGradient.addColorStop(0, 'rgba(255, 50, 50, 0.7)');
                barGradient.addColorStop(0.3, 'rgba(255, 255, 50, 0.7)');
                barGradient.addColorStop(0.7, 'rgba(50, 255, 50, 0.7)');
                barGradient.addColorStop(1, 'rgba(50, 50, 255, 0.7)');
                this.ctx.fillStyle = barGradient;
                this.ctx.fillRect(barX, barY, 36, barHeight);
                
                const mousePercent = Math.max(0, Math.min(1, this.mouseY / this.canvas.height));
                const indicatorY = barY + mousePercent * barHeight;
                
                const inGoalZone = this.mouseY >= goalTop && this.mouseY <= goalBottom;
                this.ctx.fillStyle = inGoalZone ? '#00FF00' : '#FF0000';
                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 3;
                
                this.ctx.beginPath();
                this.ctx.moveTo(barX - 22, indicatorY);
                this.ctx.lineTo(barX - 5, indicatorY - 14);
                this.ctx.lineTo(barX - 5, indicatorY + 14);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                
                this.ctx.beginPath();
                this.ctx.moveTo(barX + 36 + 22, indicatorY);
                this.ctx.lineTo(barX + 36 + 5, indicatorY - 14);
                this.ctx.lineTo(barX + 36 + 5, indicatorY + 14);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                
                this.ctx.strokeStyle = '#FFF';
                this.ctx.lineWidth = 5;
                this.ctx.strokeRect(barX, barY, 36, barHeight);
                
                this.ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                this.ctx.shadowBlur = 10;
                this.ctx.fillStyle = 'white';
                this.ctx.font = 'bold 22px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('↑', barX + 18, barY - 38);
                this.ctx.fillText('ALTURA', barX + 18, barY - 14);
                this.ctx.fillText('↓', barX + 18, barY + barHeight + 38);
                this.ctx.shadowBlur = 0;
            }
            
            lightenColor(color, percent) {
                const num = parseInt(color.replace("#",""), 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.min(255, (num >> 16) + amt);
                const G = Math.min(255, (num >> 8 & 0x00FF) + amt);
                const B = Math.min(255, (num & 0x0000FF) + amt);
                return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
            }
            
            shadeColor(color, percent) {
                const num = parseInt(color.replace("#",""), 16);
                const amt = Math.round(2.55 * percent);
                const R = (num >> 16) + amt;
                const G = (num >> 8 & 0x00FF) + amt;
                const B = (num & 0x0000FF) + amt;
                return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 +
                (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255))
                .toString(16).slice(1);
            }
            
            gameLoop() {
                const now = Date.now();
                const dt = Math.min((now - this.lastTime) / 1000, 0.1);
                this.lastTime = now;
                
                this.update(dt);
                this.draw();
                
                requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // Inicializar juego
        let game;
        window.addEventListener('load', () => {
            game = new PenaltyGame();
        });
    </script>
