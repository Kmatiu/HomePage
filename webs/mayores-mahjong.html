/* ==========================================================
   MOTOR DEL MAHJONG (solitario de parejas)
   Sin DOM: se prueba en Node (prueba-motor.js). Lo usan el de Ingenio y
   el de mayores.

   Posiciones en MEDIAS fichas: una ficha en (x, y, z) ocupa x..x+2 de
   ancho e y..y+2 de alto en el piso z. Así caben las filas desplazadas
   media ficha.
   Ficha LIBRE = nada encima (ninguna ficha del piso z+1 que la pise) y
   al menos un lado (izquierdo o derecho) sin ficha pegada en su piso.

   Tableros siempre resolubles: se «juega» el tablero vacío de dibujos
   quitando parejas de fichas libres al azar hasta vaciarlo, y a cada
   pareja quitada se le da el mismo dibujo. Ese orden es una solución.
   Mezclar hace lo mismo con las que quedan. No hay que buscar si tiene
   solución: la tiene por construcción.
   ========================================================== */
const Mahjong = (() => {
    'use strict';
    const TEMAS = typeof TEMAS_MAHJONG !== 'undefined' ? TEMAS_MAHJONG : require('./temas.js');
    const FORMAS = typeof FORMAS_MAHJONG !== 'undefined' ? FORMAS_MAHJONG : require('./formas.js');
    const ORDEN_TEMAS = ['clasico', 'animales', 'frutas', 'caras', 'deportes', 'transporte', 'casa'];
    const NIVEL_COMODINES = 6, NIVEL_OCULTAS = 12;
    const PUNTOS_PAREJA = 10, RACHA_MAX = 10;

    function azar(s) {
        let x = (s >>> 0) || 1;
        return () => { x = (Math.imul(x, 1103515245) + 12345) >>> 0; return (x >>> 8) / 16777216; };
    }
    const barajar = (r, a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    /* ---------- FORMA → POSICIONES ---------- */
    function posiciones(forma) {
        const ancho = Math.max(...forma.filas.map(f => f.length));
        const pos = [];
        forma.filas.forEach((fila, r) => {
            const off = ancho - fila.length;           // centrada: media ficha por casilla de menos
            [...fila].forEach((ch, c) => {
                const h = ch === '.' ? 0 : Number(ch);
                for (let z = 0; z < h; z++) pos.push({ x: off + 2 * c, y: 2 * r, z });
            });
        });
        /* Impar (una fila impar con cifra impar en el centro): se quita la de
           más arriba del centro */
        if (pos.length % 2) {
            let k = 0;
            pos.forEach((p, i) => { if (p.z > pos[k].z || (p.z === pos[k].z && Math.abs(p.x - ancho + 1) < Math.abs(pos[k].x - ancho + 1))) k = i; });
            pos.splice(k, 1);
        }
        return pos;
    }

    /* Forma al azar (con semilla) para los niveles de la 25 en adelante:
       simétrica, de 5 a 8 filas, con montones más altos hacia el centro */
    function formaAzar(r, objetivo) {
        for (let intento = 0; intento < 50; intento++) {
            const filas = 5 + Math.floor(r() * 4), mitad = 4;
            const h = Array.from({ length: filas }, () => Array(mitad).fill(0));
            for (let y = 0; y < filas; y++) for (let x = 0; x < mitad; x++) if (r() < 0.78) h[y][x] = 1;
            /* Altura: más cuanto más lejos del borde y más al centro */
            for (let y = 0; y < filas; y++) for (let x = 0; x < mitad; x++) {
                if (!h[y][x]) continue;
                const borde = Math.min(y, filas - 1 - y, x);
                h[y][x] = Math.max(1, Math.min(4, 1 + borde + (r() < 0.3 ? 1 : 0) - (r() < 0.2 ? 1 : 0)));
            }
            const filasTxt = h.map(fila => {
                const mitadTxt = fila.map(v => v ? String(v) : '.').join('');
                return mitadTxt + [...mitadTxt].reverse().join('');
            });
            const forma = { nombre: 'Sorpresa', filas: filasTxt };
            const n = posiciones(forma).length;
            if (Math.abs(n - objetivo) <= 14 && n >= 40) return forma;
        }
        return FORMAS.niveles[20 + Math.floor(r() * 4)];
    }

    /* ---------- LIBRE ---------- */
    function cubre(a, b) { return b.z === a.z + 1 && Math.abs(b.x - a.x) < 2 && Math.abs(b.y - a.y) < 2; }
    function ladoIzq(a, b) { return b.z === a.z && b.x === a.x - 2 && Math.abs(b.y - a.y) < 2; }
    function ladoDer(a, b) { return b.z === a.z && b.x === a.x + 2 && Math.abs(b.y - a.y) < 2; }
    /* Por qué no está libre: null si lo está, 'encima' o 'lados' */
    function bloqueo(fichas, a) {
        let izq = false, der = false;
        for (const b of fichas) {
            if (!b.viva || b === a) continue;
            if (cubre(a, b)) return 'encima';
            if (ladoIzq(a, b)) izq = true; else if (ladoDer(a, b)) der = true;
        }
        return izq && der ? 'lados' : null;
    }
    const libre = (fichas, a) => a.viva && bloqueo(fichas, a) === null;
    const libres = (fichas) => fichas.filter(f => libre(fichas, f));

    /* ---------- DIBUJOS ----------
       «clase» decide con qué casa: la de un dibujo normal es su número; las
       flores casan entre sí y las estaciones entre sí */
    const casan = (a, b) => a !== b && a.clase === b.clase;

    /* Quita parejas de libres al azar hasta vaciar: el orden es la solución.
       Devuelve la lista de parejas [i, j] (índices de `fichas`) o null si se
       queda con menos de dos libres (pasa con montones muy altos: se repite) */
    function ordenDeRetirada(fichas, r) {
        const vivas = fichas.map(f => f.viva);
        const copia = fichas.map((f, i) => ({ x: f.x, y: f.y, z: f.z, viva: vivas[i], i }));
        const orden = [];
        let quedan = copia.filter(f => f.viva).length;
        while (quedan > 0) {
            const ls = copia.filter(f => libre(copia, f));
            if (ls.length < 2) return null;
            /* De preferencia, una de las de más arriba: si no, los montones
               altos se quedan para el final y se atasca a menudo */
            barajar(r, ls);
            ls.sort((a, b) => b.z - a.z);
            const a = ls[Math.floor(r() * Math.min(ls.length, 3))];
            const resto = ls.filter(f => f !== a);
            const b = resto[Math.floor(r() * resto.length)];
            a.viva = false; b.viva = false; quedan -= 2;
            orden.push([a.i, b.i]);
        }
        return orden;
    }

    /* Reparte dibujos a las fichas vivas de forma que se pueda resolver.
       `clases`: lista de clases de pareja (una por pareja) ya barajada */
    function repartir(fichas, clasesPares, r, simbolosGrupo) {
        for (let intento = 0; intento < 400; intento++) {
            const orden = ordenDeRetirada(fichas, r);
            if (!orden) continue;
            const clases = barajar(r, clasesPares.slice());
            const restoGrupo = {};
            for (const g in simbolosGrupo) restoGrupo[g] = barajar(r, simbolosGrupo[g].slice());
            orden.forEach(([i, j], k) => {
                const cl = clases[k];
                for (const idx of [i, j]) {
                    fichas[idx].clase = cl;
                    fichas[idx].s = typeof cl === 'number' ? cl : restoGrupo[cl].pop();
                }
            });
            return orden;
        }
        throw new Error('no se pudo repartir el tablero');
    }

    /* ---------- CREAR ----------
       op: { nivel, semilla, tema ('auto' o el id), diario (aaaammdd),
       jugadores, forma (para pruebas), mayores } */
    function crear(op) {
        const o = Object.assign({ nivel: 1, tema: 'auto', jugadores: 1 }, op || {});
        const semilla = o.semilla !== undefined ? o.semilla : (o.diario ? o.diario * 7 + 3 : o.nivel * 2654435761 + 97);
        const r = azar(semilla);
        let forma;
        if (o.forma) forma = o.forma;
        else if (o.mayores) forma = FORMAS.mayores[Math.min(FORMAS.mayores.length - 1, Math.max(0, o.nivel - 1))];
        else if (o.diario) forma = FORMAS.niveles[FORMAS.diario[o.diario % FORMAS.diario.length]];
        else if (o.nivel <= FORMAS.niveles.length) forma = FORMAS.niveles[o.nivel - 1];
        else forma = formaAzar(r, 60 + Math.min(70, (o.nivel - 25) * 2));
        const temaId = o.tema && o.tema !== 'auto' ? o.tema : ORDEN_TEMAS[((o.diario ? o.diario : o.nivel) - 1) % ORDEN_TEMAS.length];
        const tema = TEMAS.porId(temaId);
        const fichas = posiciones(forma).map((p, id) => ({ id, x: p.x, y: p.y, z: p.z, viva: true, clase: null, s: null, oculta: false }));
        const pares = fichas.length / 2;
        /* Comodines: dos parejas de flores y dos de estaciones */
        const comodines = !o.mayores && (o.comodines !== undefined ? o.comodines : (o.nivel >= NIVEL_COMODINES || o.diario) && fichas.length >= 34);
        const clases = [];
        /* Con menos de 48 fichas, solo las flores: con las dos, en un tablero
           de 34 eran comodines casi una de cada cuatro (8 de 34) */
        if (comodines) clases.push('flor', 'flor');
        if (comodines && fichas.length >= 48) clases.push('estacion', 'estacion');
        /* Cada dibujo, dos parejas (cuatro fichas): así hay que elegir cuál
           de las cuatro quitar primero, que es lo que da juego. Con más
           parejas que dibujos×2, alguno sale tres veces */
        const normales = pares - clases.length;
        /* En el de mayores, cada dibujo es UNA pareja (dos fichas iguales):
           sin tener que elegir cuál de cuatro, y solo de los de su lista */
        const porDibujo = o.mayores ? 1 : 2;
        const posibles = o.mayores && TEMAS.mayores[tema.id] ? TEMAS.mayores[tema.id].slice() : tema.simbolos.map((_, i) => i);
        const elegidos = barajar(r, posibles).slice(0, Math.min(posibles.length, Math.ceil(normales / porDibujo)));
        for (let k = 0; k < normales; k++) clases.push(elegidos[k % elegidos.length]);
        const orden = repartir(fichas, clases, r, { flor: [0, 1, 2, 3], estacion: [0, 1, 2, 3] });
        /* Ocultas: un 20 % de las fichas en algunos niveles (cada tres desde
           la 12) y en el diario de los domingos */
        const ocultas = !o.mayores && (o.ocultas !== undefined ? o.ocultas : (o.nivel >= NIVEL_OCULTAS && o.nivel % 3 === 0) || (o.diario && diaSemana(o.diario) === 0));
        if (ocultas) for (const f of fichas) if (r() < 0.2) f.oculta = true;
        const p = {
            nivel: o.nivel, diario: o.diario || null, mayores: !!o.mayores, forma: forma.nombre, tema: tema.id, temaElegido: o.tema || 'auto',
            fichas, solucion: orden, comodines, ocultas,
            sel: null, turno: 1, nj: o.jugadores,
            jugadores: Array.from({ length: o.jugadores }, () => ({ puntos: 0, parejas: 0, racha: 0, mejorRacha: 0 })),
            historial: [], ayudas: { pistas: 0, mezclas: 0, deshechas: 0 }, eventos: [], terminada: false, semilla
        };
        return p;
    }
    function diaSemana(aaaammdd) {
        const a = Math.floor(aaaammdd / 10000), m = Math.floor(aaaammdd / 100) % 100, d = aaaammdd % 100;
        return new Date(Date.UTC(a, m - 1, d)).getUTCDay();
    }

    /* ---------- JUGAR ---------- */
    const vivas = (p) => p.fichas.filter(f => f.viva);
    /* Parejas que se pueden quitar AHORA (el «Coincidencias» de las
       capturas): por cada clase, cuántas parejas salen de sus libres */
    function parejasDisponibles(p) {
        const cuenta = {};
        for (const f of libres(p.fichas)) cuenta[f.clase] = (cuenta[f.clase] || 0) + 1;
        let n = 0;
        for (const k in cuenta) n += Math.floor(cuenta[k] / 2);
        return n;
    }
    function ev(p, tipo, datos) { p.eventos.push(Object.assign({}, datos, { tipo })); }
    const jugador = (p) => p.jugadores[p.turno - 1];

    /* Tocar una ficha. Devuelve lo que pasó (y lo deja en eventos) */
    function tocar(p, id) {
        if (p.terminada) return { que: 'nada' };
        const f = p.fichas[id];
        if (!f || !f.viva) return { que: 'nada' };
        const porque = bloqueo(p.fichas, f);
        if (porque) {
            /* Una bloqueada no cuenta como fallo ni pasa el turno: se explica.
               Si está oculta, se enseña un momento (memoria) */
            ev(p, 'bloqueada', { id, porque, oculta: f.oculta });
            return { que: 'bloqueada', porque };
        }
        if (p.sel === null) { p.sel = id; ev(p, 'elige', { id }); return { que: 'elige' }; }
        if (p.sel === id) { p.sel = null; ev(p, 'suelta', { id }); return { que: 'suelta' }; }
        const a = p.fichas[p.sel];
        if (!casan(a, f)) {
            const antes = p.sel;
            p.sel = null;
            const j = jugador(p);
            j.racha = 0;
            ev(p, 'distinta', { a: antes, b: id, turno: p.turno });
            if (p.nj === 2) { p.turno = 3 - p.turno; ev(p, 'turno', { turno: p.turno }); }
            return { que: 'distinta' };
        }
        quitar(p, a, f, false);
        return { que: 'quita' };
    }

    function quitar(p, a, b, conPista) {
        a.viva = false; b.viva = false;
        p.sel = null;
        const j = jugador(p);
        j.racha++;
        j.mejorRacha = Math.max(j.mejorRacha, j.racha);
        j.parejas++;
        const pts = PUNTOS_PAREJA * (conPista ? 1 : Math.min(RACHA_MAX, j.racha));
        j.puntos += pts;
        p.historial.push({ tipo: 'pareja', a: a.id, b: b.id, turno: p.turno, pts, racha: j.racha - 1 });
        ev(p, 'quita', { a: a.id, b: b.id, puntos: pts, racha: j.racha, turno: p.turno });
        if (j.racha > 1 && j.racha % 5 === 0) ev(p, 'combo', { racha: j.racha, turno: p.turno });
        if (!vivas(p).length) {
            p.terminada = true;
            const limpia = !p.ayudas.pistas && !p.ayudas.mezclas && !p.ayudas.deshechas;
            const bonus = p.nj === 1 ? (limpia ? 2 : 1) * (50 + 5 * p.fichas.length) : 0;
            j.puntos += bonus;
            ev(p, 'fin', { bonus, limpia });
        } else if (!parejasDisponibles(p)) ev(p, 'atasco', {});
    }

    /* ---------- RESOLVER ----------
       Búsqueda en profundidad con memoria de estados y primero las jugadas
       «seguras» (una clase con todas sus fichas libres: quitarlas no puede
       estropear nada). Con tope de nodos: si no llega, devuelve null. */
    function resolver(p, tope) {
        /* Varios intentos cortos con desempates al azar en vez de uno largo:
           una mala elección temprana deja una rama enorme sin salida, y
           volver a empezar por otro lado sale mucho antes (medido: con un
           solo intento de 200.000 nodos, 3 de 80 niveles no salían) */
        const total = tope || 200000;
        const r = azar(p.semilla ^ 0x5bd1e995 ^ p.historial.length);
        let gastado = 0;
        for (let k = 0; gastado < total; k++) {
            const t = Math.min(total - gastado, k === 0 ? 4000 : 4000 * Math.min(8, k));
            const res = resolverUna(p, t, k === 0 ? null : r);
            if (res.camino) return res.camino;
            gastado += res.nodos;
            if (res.completo) return null;       // recorrió todo: no tiene solución
        }
        return null;
    }
    function resolverUna(p, tope, r) {
        const fs = p.fichas;
        const n = fs.length;
        /* Vecinas precalculadas: quién cubre a quién y quién está al lado */
        const encima = fs.map(a => fs.filter(b => cubre(a, b)).map(b => b.id));
        const izq = fs.map(a => fs.filter(b => ladoIzq(a, b)).map(b => b.id));
        const der = fs.map(a => fs.filter(b => ladoDer(a, b)).map(b => b.id));
        const tapa = fs.map(a => fs.filter(b => cubre(b, a)).map(b => b.id));   // las que tiene debajo
        const vivo = fs.map(f => f.viva);
        const vistos = new Set();
        let nodos = 0;
        const max = tope || 200000;
        const esLibre = (i) => vivo[i] && !encima[i].some(k => vivo[k]) && (!izq[i].some(k => vivo[k]) || !der[i].some(k => vivo[k]));
        const camino = [];
        let agotado = false;
        function clave() { let s = ''; for (let i = 0; i < n; i += 30) { let v = 0; for (let k = i; k < Math.min(n, i + 30); k++) v = v * 2 + (vivo[k] ? 1 : 0); s += v.toString(36) + ','; } return s; }
        function buscar() {
            if (++nodos > max) { agotado = true; return false; }
            let quedan = 0;
            for (let i = 0; i < n; i++) if (vivo[i]) quedan++;
            if (!quedan) return true;
            const k = clave();
            if (vistos.has(k)) return false;
            vistos.add(k);
            const porClase = new Map();
            const totalClase = new Map();
            for (let i = 0; i < n; i++) if (vivo[i]) {
                totalClase.set(fs[i].clase, (totalClase.get(fs[i].clase) || 0) + 1);
                if (esLibre(i)) { if (!porClase.has(fs[i].clase)) porClase.set(fs[i].clase, []); porClase.get(fs[i].clase).push(i); }
            }
            const jugadas = [];
            for (const [cl, ls] of porClase) {
                if (ls.length < 2) continue;
                const segura = ls.length === totalClase.get(cl);
                for (let a = 0; a < ls.length; a++) for (let b = a + 1; b < ls.length; b++) jugadas.push({ a: ls[a], b: ls[b], segura, libera: encima[ls[a]].length + encima[ls[b]].length });
            }
            if (!jugadas.length) return false;
            /* Sin salida si en una clase con solo dos fichas una está encima de
               la otra: para quitar la de abajo hay que quitar antes la de
               arriba, que no tiene con quién */
            for (const [cl, t] of totalClase) {
                if (t !== 2) continue;
                const dos = [];
                for (let i = 0; i < n && dos.length < 2; i++) if (vivo[i] && fs[i].clase === cl) dos.push(i);
                if (encima[dos[0]].includes(dos[1]) || encima[dos[1]].includes(dos[0])) return false;
            }
            /* Las seguras primero; luego las que tienen más debajo (liberan más) */
            const debajo = (i) => tapa[i].reduce((s, k) => s + (vivo[k] ? 1 : 0), 0) + fs[i].z * 2;
            if (r) for (const j of jugadas) j.ruido = r() * 3;
            jugadas.sort((x, y) => (y.segura - x.segura) || (debajo(y.a) + debajo(y.b) + (y.ruido || 0) - debajo(x.a) - debajo(x.b) - (x.ruido || 0)));
            const lista = jugadas[0].segura ? [jugadas[0]] : jugadas;
            for (const j of lista) {
                vivo[j.a] = false; vivo[j.b] = false; camino.push([j.a, j.b]);
                if (buscar()) return true;
                vivo[j.a] = true; vivo[j.b] = true; camino.pop();
            }
            return false;
        }
        const ok = buscar();
        return { camino: ok ? camino.slice() : null, nodos, completo: !ok && !agotado };
    }

    /* ---------- AYUDAS ---------- */
    /* Pista: la primera jugada de una solución desde aquí (así la pista no
       te mete en un callejón). Si el resolvedor no llega a tiempo, una
       pareja libre cualquiera. null si no hay ninguna. */
    function pista(p, contar) {
        if (p.terminada) return null;
        /* Tope de 25.000 nodos: en un móvil lento son unas décimas (medido en
           navegador/jugar.js con la CPU a 1/6) */
        const sol = resolver(p, 25000);
        let par = sol && sol[0];
        if (!par) {
            /* De las libres, una «segura» si la hay (todas las de su clase
               libres); si no, cualquiera */
            const ls = libres(p.fichas);
            const total = {};
            for (const f of vivas(p)) total[f.clase] = (total[f.clase] || 0) + 1;
            const pares = [];
            for (let a = 0; a < ls.length; a++) for (let b = a + 1; b < ls.length; b++) if (casan(ls[a], ls[b])) pares.push([ls[a], ls[b]]);
            pares.sort((x, y) => (ls.filter(f => f.clase === y[0].clase).length === total[y[0].clase]) - (ls.filter(f => f.clase === x[0].clase).length === total[x[0].clase]));
            if (pares.length) par = [pares[0][0].id, pares[0][1].id];
        }
        if (par && contar !== false) p.ayudas.pistas++;
        if (par) ev(p, 'pista', { a: par[0], b: par[1], segura: !!sol });
        return par;
    }

    /* Mezclar: los dibujos de las que quedan, repartidos otra vez de forma
       que se pueda acabar. Ni se añaden ni se quitan fichas. */
    function mezclar(p, r, contar) {
        if (p.terminada) return;
        const rnd = r || azar((p.semilla ^ (p.historial.length * 7919 + 1)) >>> 0);
        const antes = p.fichas.map(f => [f.clase, f.s]);
        const vivasL = vivas(p);
        const cuenta = new Map();
        const grupoResto = { flor: [], estacion: [] };
        for (const f of vivasL) {
            cuenta.set(f.clase, (cuenta.get(f.clase) || 0) + 1);
            if (f.clase === 'flor' || f.clase === 'estacion') grupoResto[f.clase].push(f.s);
        }
        const clases = [];
        for (const [cl, k] of cuenta) for (let i = 0; i < k / 2; i++) clases.push(cl);
        /* La nueva solución se guarda: las pruebas la repasan con su propia
           regla de ficha libre */
        p.solucion = repartir(p.fichas, clases, rnd, grupoResto);
        p.sel = null;
        if (contar !== false) p.ayudas.mezclas++;
        p.historial.push({ tipo: 'mezcla', antes });
        ev(p, 'mezcla', {});
    }

    function deshacer(p) {
        const h = p.historial.pop();
        if (!h) return false;
        if (h.tipo === 'mezcla') {
            h.antes.forEach(([cl, s], i) => { p.fichas[i].clase = cl; p.fichas[i].s = s; });
        } else {
            p.fichas[h.a].viva = true; p.fichas[h.b].viva = true;
            const j = p.jugadores[h.turno - 1];
            j.puntos -= h.pts; j.parejas--; j.racha = h.racha;
            p.terminada = false;
        }
        p.sel = null;
        p.ayudas.deshechas++;
        ev(p, 'deshace', {});
        return true;
    }

    /* ---------- GUARDAR ----------
       Lo justo para rehacer la partida: semilla y opciones (rehacen el
       tablero igual) más qué fichas quedan y qué dibujo lleva cada una (por
       si se mezcló) */
    function guardar(p) {
        if (p.terminada) return null;
        return {
            v: 1, nivel: p.nivel, diario: p.diario, tema: p.temaElegido, nj: p.nj, mayores: p.mayores,
            semilla: p.semilla, comodines: p.comodines, ocultas: p.ocultas,
            vivas: p.fichas.map(f => f.viva ? 1 : 0).join(''),
            dibujos: p.fichas.map(f => [f.clase, f.s, f.oculta ? 1 : 0]),
            jugadores: p.jugadores.map(j => ({ ...j })), turno: p.turno, ayudas: { ...p.ayudas }
        };
    }
    function restaurar(g) {
        if (!g || g.v !== 1 || !Number.isInteger(g.nivel) || g.nivel < 1 || g.nivel > 100000 || (g.nj !== 1 && g.nj !== 2)) return null;
        let p;
        try {
            p = crear({ nivel: g.nivel, diario: g.diario || undefined, tema: g.tema, jugadores: g.nj, semilla: g.semilla, mayores: !!g.mayores, comodines: g.comodines, ocultas: g.ocultas });
        } catch (e) { return null; }
        if (typeof g.vivas !== 'string' || g.vivas.length !== p.fichas.length || !Array.isArray(g.dibujos) || g.dibujos.length !== p.fichas.length) return null;
        if (!Array.isArray(g.jugadores) || g.jugadores.length !== g.nj) return null;
        const tema = TEMAS.porId(p.tema);
        for (let i = 0; i < p.fichas.length; i++) {
            const [cl, s, oc] = g.dibujos[i] || [];
            const okClase = (cl === 'flor' || cl === 'estacion') ? Number.isInteger(s) && s >= 0 && s < 4 : Number.isInteger(cl) && cl >= 0 && cl < tema.simbolos.length && s === cl;
            if (!okClase) return null;
            Object.assign(p.fichas[i], { viva: g.vivas[i] === '1', clase: cl, s, oculta: !!oc });
        }
        /* Que lo que queda case por parejas (si no, no se podría acabar) */
        const cuenta = {};
        for (const f of p.fichas) if (f.viva) cuenta[f.clase] = (cuenta[f.clase] || 0) + 1;
        if (Object.values(cuenta).some(k => k % 2) || !vivas(p).length) return null;
        p.jugadores = g.jugadores.map(j => ({ puntos: +j.puntos || 0, parejas: +j.parejas || 0, racha: +j.racha || 0, mejorRacha: +j.mejorRacha || 0 }));
        p.turno = g.turno === 2 && g.nj === 2 ? 2 : 1;
        if (g.ayudas) p.ayudas = { pistas: +g.ayudas.pistas || 0, mezclas: +g.ayudas.mezclas || 0, deshechas: +g.ayudas.deshechas || 0 };
        return p;
    }

    /* Cambiar el tema de un tablero ya hecho (al seguir uno a medias con
       otras FICHAS elegidas): es solo el dibujo. Los dibujos que se usan se
       numeran de nuevo 0, 1, 2… en el tema nuevo (el clásico tiene 34 y los
       demás 36: con el número de antes podía no existir) */
    function cambiarTema(p, temaId) {
        if (!temaId || temaId === 'auto' || temaId === p.tema) return;
        const nuevo = TEMAS.porId(temaId);
        const usados = [...new Set(p.fichas.filter(f => typeof f.clase === 'number').map(f => f.clase))].sort((a, b) => a - b);
        if (usados.length > nuevo.simbolos.length) return;
        const a = new Map(usados.map((c, i) => [c, i]));
        for (const f of p.fichas) if (typeof f.clase === 'number') { f.clase = a.get(f.clase); f.s = f.clase; }
        for (const h of p.historial) if (h.antes) h.antes = h.antes.map(([cl, s]) => typeof cl === 'number' ? [a.get(cl), a.get(cl)] : [cl, s]);
        p.tema = nuevo.id; p.temaElegido = nuevo.id;
    }

    /* Nombre y dibujo de una ficha, para la pantalla */
    function simbolo(p, f) {
        if (f.clase === 'flor' || f.clase === 'estacion') return TEMAS.grupos[f.clase][f.s];
        return TEMAS.porId(p.tema).simbolos[f.s];
    }

    return {
        TEMAS, FORMAS, ORDEN_TEMAS, NIVEL_COMODINES, NIVEL_OCULTAS,
        crear, tocar, pista, mezclar, deshacer, resolver, guardar, restaurar, simbolo, cambiarTema,
        libre: (p, f) => libre(p.fichas, f), bloqueo: (p, f) => bloqueo(p.fichas, f), libres: (p) => libres(p.fichas),
        parejasDisponibles, casan, vivas,
        _interno: { posiciones, formaAzar, ordenDeRetirada, repartir, azar, diaSemana, quitar }
    };
})();
if (typeof module !== 'undefined') module.exports = Mahjong;
</script>
<script>
/* ==========================================================
   MAHJONG PARA MAYORES
   El mismo motor que el de Ingenio (_fuentes/mahjong), con tableros
   pequeños (de 8 a 32 fichas, en una o dos capas) y cada dibujo una sola
   pareja. Nunca se pierde:
   - Tocar una bloqueada no cuenta: se explica por qué.
   - Dos que no son iguales: la primera se queda elegida y se dice cuál
     es. A los dos fallos brilla la que hace pareja.
   - Sin parejas libres, se mezclan solas.
   - AYÚDAME hace brillar una pareja que no mete en un callejón.
   ========================================================== */
const RONDAS = 3;
const FALLOS_ANTES_DE_SENALAR = 2;

const M = Mayores.iniciar({ id: 'mahjong', nivelMaximo: Mahjong.FORMAS.mayores.length });
const $ = (id) => document.getElementById(id);

const partida = { ronda: 0, tema: 'animales', p: null, errores: 0, ayudas: 0, fallos: 0, resuelta: false };
const botonesMj = new Map();

/* «el gato» → «El gato» */
const mayus = (t) => t.charAt(0).toUpperCase() + t.slice(1);
const nombreDe = (id) => Mahjong.simbolo(partida.p, partida.p.fichas[id]).n;

function decirYPoner(texto, voz) {
    $('pista').textContent = texto;
    M.decir(voz || texto);
}

/* ---------- PINTAR ---------- */
const ALTO = 1.25, DZ_X = 0.08, DZ_Y = 0.07;
function medidas(W) {
    const fs = partida.p.fichas;
    const minX = Math.min(...fs.map(f => f.x)), maxX = Math.max(...fs.map(f => f.x));
    const minY = Math.min(...fs.map(f => f.y)), maxY = Math.max(...fs.map(f => f.y));
    const maxZ = Math.max(...fs.map(f => f.z));
    const anchoF = (maxX - minX) / 2 + 1 + maxZ * DZ_X, altoF = ((maxY - minY) / 2 + 1 + maxZ * DZ_Y + 0.07) * ALTO;
    return { minX, minY, maxZ, anchoF, altoF, ancho: anchoF * W + 16, alto: altoF * W + 16 };
}
function colocar(W) {
    const m = medidas(W), H = W * ALTO, tab = $('tablero');
    tab.style.setProperty('--ancho', m.ancho + 'px');
    tab.style.setProperty('--alto', m.alto + 'px');
    tab.style.setProperty('--w', (W - 4) + 'px');
    tab.style.setProperty('--h', (H - 4) + 'px');
    for (const f of partida.p.fichas) {
        const b = botonesMj.get(f.id);
        b.style.left = (8 + (f.x - m.minX) / 2 * W - f.z * DZ_X * W + m.maxZ * DZ_X * W) + 'px';
        b.style.top = (8 + (f.y - m.minY) / 2 * H - f.z * DZ_Y * H + m.maxZ * DZ_Y * H) + 'px';
    }
}

/* La ficha, lo más grande que quepa con AYÚDAME a la vista (como mucho 120
   px). Si para eso bajaría de 56 px, AYÚDAME se queda bajo el borde y lo
   que tiene que caber entero es el tablero (lo mismo que en el Puzle) */
const W_MAX = 120, W_MIN = 56;
function ajustarTablero() {
    const tab = $('tablero');
    const disponible = tab.parentElement.clientWidth - parseFloat(getComputedStyle(tab.parentElement).paddingLeft) * 2 - 6;
    let W = Math.min(W_MAX, (disponible - 16) / medidas(1).anchoF);
    colocar(W);
    while (!M.cabe() && W > W_MIN) { W -= 3; colocar(W); }
    if (!M.cabe()) {
        const sobra = tab.getBoundingClientRect().bottom + 8 - window.innerHeight;
        if (sobra > 0) W = Math.max(36, W - sobra / medidas(1).altoF);
        colocar(W);
    }
}

function pintarTablero() {
    const tab = $('tablero');
    tab.innerHTML = '';
    botonesMj.clear();
    for (const f of partida.p.fichas) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ficha';
        b.style.zIndex = String(f.z * 1000 + f.y * 20 + f.x);
        b.textContent = Mahjong.simbolo(partida.p, f).c;
        M.tocar(b, () => tocar(f.id));
        tab.appendChild(b);
        botonesMj.set(f.id, b);
    }
    actualizar();
}

function actualizar() {
    const p = partida.p;
    for (const f of p.fichas) {
        const b = botonesMj.get(f.id);
        b.classList.toggle('quitada', !f.viva);
        if (!f.viva) { b.tabIndex = -1; continue; }
        const libre = Mahjong.libre(p, f);
        b.classList.toggle('libre', libre);
        b.classList.toggle('bloqueada', !libre);
        b.classList.toggle('elegida', p.sel === f.id);
        b.setAttribute('aria-label', nombreDe(f.id) + (libre ? '' : ', todavía no se puede coger'));
    }
}

function quitarAyuda() { botonesMj.forEach(b => b.classList.remove('ayuda')); }
function senalar(ids) { quitarAyuda(); for (const i of ids) { const b = botonesMj.get(i); if (b) b.classList.add('ayuda'); } }

/* La pareja de la elegida, si está libre; si no, una pareja buena */
function parejaDe(id) {
    const p = partida.p, a = p.fichas[id];
    const otra = p.fichas.find(f => f.viva && f !== a && Mahjong.casan(a, f) && Mahjong.libre(p, f));
    return otra ? [otra.id] : null;
}

/* ---------- JUGAR ---------- */
function tocar(id) {
    const p = partida.p;
    if (partida.resuelta) return;
    const antes = p.sel;
    const r = Mahjong.tocar(p, id);
    p.eventos.length = 0;
    if (r.que === 'bloqueada') {
        decirYPoner('Esa todavía no. Coge una con borde azul.',
            'Esa todavía no se puede coger: ' + (r.porque === 'encima' ? 'tiene otra encima.' : 'tiene fichas a los dos lados.') + ' Coge una con borde azul.');
    } else if (r.que === 'elige') {
        quitarAyuda();
        M.tono(0, 120);
        decirYPoner(mayus(nombreDe(id)) + '. Busca otro igual.');
    } else if (r.que === 'suelta') {
        decirYPoner('Toca una ficha con borde azul.');
    } else if (r.que === 'distinta') {
        /* La primera se queda elegida: lo que se ha hecho bien no se pierde */
        p.sel = antes;
        partida.errores++; partida.fallos++;
        M.sonar('mal');
        const tengo = nombreDe(antes);
        if (partida.fallos >= FALLOS_ANTES_DE_SENALAR) {
            const otra = parejaDe(antes);
            if (otra) { senalar(otra); decirYPoner('Mira la que brilla.', 'No es igual. Tienes ' + tengo + '. Su pareja es la que brilla.'); }
            else { p.sel = null; ayudar(true); }
        } else decirYPoner('No es igual. Tienes ' + tengo + '.', 'Esa es ' + nombreDe(id) + '. No es igual. Tienes ' + tengo + ': busca otro igual.');
    } else if (r.que === 'quita') {
        quitarAyuda();
        partida.fallos = 0;
        M.sonar('bien');
        decirYPoner('¡Bien!', '¡Bien! ' + mayus(nombreDe(id)) + '.');
        if (p.terminada) { actualizar(); return resolver(); }
        if (!Mahjong.parejasDisponibles(p)) setTimeout(mezclarSolas, 900);
    }
    actualizar();
}

function mezclarSolas() {
    const p = partida.p;
    if (partida.resuelta || Mahjong.parejasDisponibles(p)) return;
    Mahjong.mezclar(p, null, false);
    p.eventos.length = 0;
    for (const f of p.fichas) botonesMj.get(f.id).textContent = Mahjong.simbolo(p, f).c;
    decirYPoner('Las he mezclado para que puedas seguir.', 'No quedaba ninguna pareja libre. Las he mezclado para que puedas seguir.');
    actualizar();
}

function ayudar(porFallos) {
    const p = partida.p;
    if (partida.resuelta) return;
    if (!porFallos) partida.ayudas++;
    if (p.sel !== null) {
        const otra = parejaDe(p.sel);
        if (otra) { senalar(otra); decirYPoner('Mira la que brilla.', 'Su pareja es la que brilla.'); return; }
        p.sel = null;
    }
    const par = Mahjong.pista(p, false);
    p.eventos.length = 0;
    if (!par) { mezclarSolas(); return; }
    senalar(par);
    actualizar();
    decirYPoner('Mira las que brillan.', 'Estas dos son iguales: ' + nombreDe(par[0]) + '. Tócalas.');
}

function resolver() {
    partida.resuelta = true;
    M.anotar(resultadoDeRonda(partida.errores, partida.ayudas));
    quitarAyuda();
    M.sonar('bien');
    decirYPoner('¡Muy bien! Ya no queda ninguna.', '¡Muy bien! Has quitado todas las fichas.');
    $('btnAyuda').style.display = 'none';
    $('btnSiguiente').textContent = partida.ronda >= RONDAS ? 'TERMINAR' : 'SIGUIENTE';
    $('btnSiguiente').style.display = '';
}

const TEXTOS = ['Toca una ficha con borde azul.', 'Esa todavía no. Coge una con borde azul.', 'Las he mezclado para que puedas seguir.',
    'No es igual. Tienes el muslo de pollo.', 'Los calcetines. Busca otro igual.', '¡Muy bien! Ya no queda ninguna.', 'Mira las que brillan.'];

function nuevaRonda() {
    partida.ronda++;
    partida.p = Mahjong.crear({ nivel: M.nivel, mayores: true, tema: partida.tema, semilla: (Math.random() * 1e9) >>> 0 });
    Object.assign(partida, { errores: 0, ayudas: 0, fallos: 0, resuelta: false });
    $('btnAyuda').style.display = '';
    $('btnSiguiente').style.display = 'none';
    $('pista').textContent = 'Toca una ficha con borde azul.';
    M.mostrar('juego');
    pintarTablero();
    M.reservar($('pista'), TEXTOS);
    ajustarTablero();
    M.decir('Junta dos fichas iguales. Toca una ficha con borde azul.');
}

function empezarSesion(tema) {
    partida.tema = tema;
    partida.ronda = 0;
    nuevaRonda();
}

function terminarSesion() {
    $('textoFinal').textContent = 'Has hecho ' + RONDAS + ' tableros.';
    M.sonar('fin');
    M.mostrar('final');
    M.decir('¡Muy bien! Has hecho ' + RONDAS + ' tableros.');
}

M.alCambiarLetra(() => { if ($('juego').classList.contains('activa')) ajustarTablero(); });
addEventListener('resize', () => { if ($('juego').classList.contains('activa')) ajustarTablero(); });

M.tocar($('btnAnimales'), () => empezarSesion('animales'));
M.tocar($('btnFrutas'), () => empezarSesion('frutas'));
M.tocar($('btnCasa'), () => empezarSesion('casa'));
M.tocar($('btnAyuda'), () => ayudar(false));
M.tocar($('btnSiguiente'), () => (partida.ronda >= RONDAS ? terminarSesion() : nuevaRonda()));
M.tocar($('btnOtraVez'), () => empezarSesion(partida.tema));
M.tocar($('btnSalirFinal'), () => { location.href = '../'; });

/* Para las pruebas */
window.__mj = { partida, botones: botonesMj, ajustar: ajustarTablero };
</script>
