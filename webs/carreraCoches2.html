<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route 66 - Retro Road Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #gameContainer {
            position: relative;
            max-width: 900px;
            width: 100%;
            aspect-ratio: 3/2;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #menuScreen, #pauseScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0 #ff006e, 8px 8px 0 #8338ec;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .menu-section {
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            margin: 10px;
            min-width: 400px;
            border: 3px solid #ff006e;
        }
        .difficulty-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .difficulty-btn {
            padding: 10px 20px;
            font-size: 1.2em;
            border: 2px solid #fff;
            background: #333;
            color: #fff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .difficulty-btn:hover {
            background: #555;
            transform: scale(1.1);
        }
        .difficulty-btn.selected {
            background: #ff006e;
            border-color: #ff006e;
            box-shadow: 0 0 20px #ff006e;
        }
        .slider-container {
            margin: 15px 0;
            text-align: left;
        }
        .slider-container label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            margin: 10px;
            border: 3px solid #8338ec;
            background: #3a0ca3;
            color: #fff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        button:hover {
            background: #5a4fcf;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(131,56,236,0.5);
        }
        button:active {
            transform: translateY(0);
        }
        #rankingList {
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
            margin: 15px 0;
        }
        .ranking-item {
            padding: 8px;
            border-bottom: 1px solid #444;
            font-size: 0.9em;
        }
        .ranking-item:nth-child(1) { color: #ffd700; }
        .ranking-item:nth-child(2) { color: #c0c0c0; }
        .ranking-item:nth-child(3) { color: #cd7f32; }
        #pauseScreen {
            background: rgba(0,0,0,0.9);
        }
        .pause-panel {
            background: rgba(30,30,60,0.95);
            padding: 40px;
            border-radius: 15px;
            border: 4px solid #ff006e;
            box-shadow: 0 0 50px rgba(255,0,110,0.5);
        }
        #instructions {
            max-width: 500px;
            text-align: left;
            line-height: 1.6;
        }
        #instructions ul {
            margin-left: 20px;
            margin-top: 10px;
        }
        #nameInput {
            padding: 10px;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            border: 2px solid #ff006e;
            background: #222;
            color: #fff;
            text-align: center;
            max-width: 300px;
        }
        .stats-display {
            margin: 20px 0;
            font-size: 1.1em;
            line-height: 1.8;
        }
        .stats-display strong {
            color: #ff006e;
        }
        #locationSign {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            border: 4px solid #ffaa00;
            color: #ffaa00;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            
            width: 250px;
            padding: 20px;
            font-size: 1.8em;
            text-align: center;
            
            left: auto;
        }
        /* MODIFICADO - Estilos para la cuenta atrás */
        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #countdownOverlay.active {
            opacity: 1;
        }
        #countdownText {
            font-size: 6em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #ff006e, 0 0 40px #ff006e, 0 0 60px #ff006e;
            animation: countdownPulse 0.8s ease-in-out;
        }
        @keyframes countdownPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        
        <!-- CARTEL DE UBICACIÓN -->
        <div id="locationSign"></div>
        
        <!-- MODIFICADO - Overlay de cuenta atrás -->
        <div id="countdownOverlay">
            <div id="countdownText"></div>
        </div>
        
        <!-- MENÚ PRINCIPAL -->
        <div id="menuScreen">
            <h1>🏎 ROUTE 66 🏎</h1>
            
            <div class="menu-section">
                <h2>Selecciona Dificultad</h2>
                <div class="difficulty-selector">
                    <button class="difficulty-btn" data-diff="easy">Pod de Tatooine (Fácil)</button>
                    <button class="difficulty-btn selected" data-diff="normal">Speeder Rebelde (Normal)</button>
                    <button class="difficulty-btn" data-diff="hard">Halcón Milenario (Difícil)</button>
                </div>
            </div>
            
            <div class="menu-section">
                <div class="slider-container">
                    <label>🎵 Volumen Música: <span id="musicVolLabel">70%</span></label>
                    <input type="range" id="musicVolSlider" min="0" max="100" value="70">
                </div>
                <div class="slider-container">
                    <label>🔊 Volumen Efectos: <span id="sfxVolLabel">80%</span></label>
                    <input type="range" id="sfxVolSlider" min="0" max="100" value="80">
                </div>
            </div>
            
            <button id="startBtn">INICIAR JUEGO</button>
            <button id="rankingBtn">VER RANKING</button>
            <button id="instructionsBtn">INSTRUCCIONES</button>
            <button id="resetRankingBtn">RESET RANKING</button>
        </div>
        
        <!-- PANTALLA DE PAUSA -->
        <div id="pauseScreen" class="hidden">
            <div class="pause-panel">
                <h1 style="font-size: 2.5em;">⏸ PAUSA</h1>
                
                <div class="menu-section">
                    <div class="slider-container">
                        <label>🎵 Volumen Música: <span id="pauseMusicVolLabel">70%</span></label>
                        <input type="range" id="pauseMusicVolSlider" min="0" max="100" value="70">
                    </div>
                    <div class="slider-container">
                        <label>🔊 Volumen Efectos: <span id="pauseSfxVolLabel">80%</span></label>
                        <input type="range" id="pauseSfxVolSlider" min="0" max="100" value="80">
                    </div>
                </div>
                
                <button id="resumeBtn">REANUDAR (P)</button>
                <button id="quitBtn">VOLVER AL MENÚ</button>
            </div>
        </div>
        
        <!-- PANTALLA GAME OVER / VICTORY -->
        <div id="gameOverScreen" class="hidden">
            <h1 id="gameOverTitle">GAME OVER</h1>
            <div class="stats-display" id="statsDisplay"></div>
            <div id="nameInputSection" class="hidden">
                <p>¡Entra en el Top 10! Introduce tu nombre:</p>
                <input type="text" id="nameInput" maxlength="18" placeholder="TU NOMBRE">
                <br>
                <button id="submitScoreBtn">GUARDAR PUNTUACIÓN</button>
            </div>
            <button id="backToMenuBtn">VOLVER AL MENÚ</button>
        </div>
    </div>
    
    <script>
        'use strict';
        
        // ==========================================
        // CONFIG - Configuración global del juego
        // ==========================================
        const CONFIG = {
            // Canvas
            canvasWidth: 900,
            canvasHeight: 600,
            
            // Juego
            initialTime: 45,
            totalCheckpoints: 5,
            
            // Dificultades
            difficulties: {
                easy: {
                    name: 'Pod de Tatooine',
                    lives: 5,
                    spawnInterval: 1400,
                    enemiesPerWave: 1,
                    enemyBaseSpeed: 0.02,
                    checkpointTimeBonus: 45
                },
                normal: {
                    name: 'Speeder Rebelde',
                    lives: 4,
                    spawnInterval: 1000,
                    enemiesPerWave: 1,
                    enemyBaseSpeed: 0.0275,
                    checkpointTimeBonus: 40
                },
                hard: {
                    name: 'Halcón Milenario',
                    lives: 3,
                    spawnInterval: 800,
                    enemiesPerWave: 1.2,
                    enemyBaseSpeed: 0.0375,
                    checkpointTimeBonus: 40
                }
            },
            
            // Carretera
            roadLanes: 3,
            laneWidth: 120,
            roadWidth: 360,
            horizonY: 180,
            vanishingPointY: 180,
            
            // Jugador
            playerAcceleration: 0.01,
            playerMaxSpeed: 1.5,
            playerBrakeDecel: 0.5,
            playerFriction: 0.05,
            laneChangeSpeed: 0.15,
            
            // Enemigos
            enemyMinDepth: 8,
            enemyMaxDepth: 30,
            
            // Obstáculos
            obstacleSpawnInterval: 2500,
            obstacleMinDepth: 8,
            obstacleMaxDepth: 35,
            
            // Scoring
            scorePerSecond: 10,
            scorePerCheckpoint: 500,
            
            // Audio
            defaultMusicVolume: 0.7,
            defaultSfxVolume: 0.8,
            
            // Persistencia
            rankingKey: 'route66_ranking_v1',
            maxRankingEntries: 10,
            
            // Ubicaciones Route 66
            locations: [
            'Desierto de Nevada',
            'Springfield',
            'Missouri',
            'California',
            'Los Ángeles'
            ]
        };
        
        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'menu';
        let currentDifficulty = 'normal';
        let difficultyConfig = CONFIG.difficulties.normal;
        
        // Estado del juego
        let lives = CONFIG.initialLives;
        let timeRemaining = CONFIG.initialTime;
        let score = 0;
        let checkpointsPassed = 0;
        let totalCollisions = 0;
        let gameStartTime = 0;
        let lastFrameTime = 0;
        let pauseStartTime = 0;
        let totalPausedTime = 0;
        
        // MODIFICADO - Variable para controlar la cuenta atrás
        let countdownActive = false;
        
        // Jugador
        let player = {
            lane: 1,
            targetLane: 1,
            speed: 0,
            depth: 5,
            sprite: null
        };
        
        // Enemigos
        let enemies = [];
        let lastEnemySpawn = 0;
        
        // Obstáculos
        let obstacles = [];
        let lastObstacleSpawn = 0;
        
        // Checkpoints
        let checkpoints = [];
        let nextCheckpointDepth = 50;
        
        // Carretera y curva
        let roadCurve = 0;
        let targetRoadCurve = 0;
        let roadScroll = 0;
        
        // Sistema día/noche mejorado
        let skyPhase = 0; // 0=noche, 1=amanecer, 2=día, 3=atardecer, 4=anochecer
        
        // Input
        let keys = {};
        
        // Sprites
        let playerCarSprite = null;
        let enemyCarSprites = [];
        let obstacleSprites = [];
        
        let currentBiome = 0;
        let biomeTransition = 0;
        
        // ==========================================
        // AUDIO - Web Audio API
        // ==========================================
        let audioContext;
        let masterGain, musicGain, sfxGain;
        let musicOscillators = [];
        let musicPattern = [];
        let currentMusicNote = 0;
        let musicInterval = null;
        let musicVariation = 0;
        
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                masterGain = audioContext.createGain();
                musicGain = audioContext.createGain();
                sfxGain = audioContext.createGain();
                
                masterGain.connect(audioContext.destination);
                musicGain.connect(masterGain);
                sfxGain.connect(masterGain);
                
                masterGain.gain.value = 1.0;
                musicGain.gain.value = CONFIG.defaultMusicVolume;
                sfxGain.gain.value = CONFIG.defaultSfxVolume;
                
                generateMusicPattern();
            } catch(e) {
                console.warn('Web Audio API no disponible:', e);
            }
        }
        
        function generateMusicPattern() {
            // TEMA PRINCIPAL DE STAR WARS (simplificado)
            // Secuencia icónica: SOL - SOL - SOL - DO - SOL - FA - MI - RE - DO'
            
            const starWarsMainTheme = [
            // Frase 1: "Ta ta ta TAAA ta"
            [196, 392, 588],  // SOL (G)
            [196, 392, 588],  // SOL
            [196, 392, 588],  // SOL
            [262, 523, 785],  // DO alto (C) - largo
            [196, 392, 784],  // SOL
            
            // Frase 2: "ta ta ta"
            [175, 349, 523],  // FA (F)
            [165, 330, 494],  // MI (E)
            [147, 294, 440],  // RE (D)
            [262, 523, 785],  // DO alto (C) - largo
            [196, 392, 588],  // SOL
            
            // Frase 3: repetición variada
            [175, 349, 523],  // FA
            [165, 330, 494],  // MI
            [147, 294, 440],  // RE
            [262, 523, 785],  // DO alto
            [196, 392, 588],  // SOL
            
            // Interludio (Marcha Imperial mezclada)
            [196, 196, 392],  // SOL bajo
            [196, 196, 392],
            [196, 196, 392],
            [185, 185, 370],  // FA# bajo
            [208, 208, 415],  // SOL#
            
            // Vuelta al tema
            [196, 392, 588],
            [262, 523, 785],
            [196, 392, 784]
            ];
            
            musicPattern = starWarsMainTheme;
        }
        
        function startMusic() {
            if (!audioContext) return;
            stopMusic();
            
            currentMusicNote = 0;
            const tempo = 320 - (musicVariation * 15); // MODIFICADO - Tempo más épico
            
            musicInterval = setInterval(() => {
                if (gameState === 'paused') return;
                
                playMusicNote(musicPattern[currentMusicNote]);
                currentMusicNote = (currentMusicNote + 1) % musicPattern.length;
            }, tempo);
        }
        
        function playMusicNote(frequencies) {
            if (!audioContext) return;
            
            frequencies.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                // MODIFICADO - Tipo de onda más "épico"
                osc.type = i === 0 ? 'sawtooth' : 'triangle';
                osc.frequency.value = freq + (musicVariation * 3);
                
                // MODIFICADO - Envolvente más dramática
                gain.gain.setValueAtTime(0.12, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.45);
                
                osc.connect(gain);
                gain.connect(musicGain);
                
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            });
        }
        
        function stopMusic() {
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        }
        
        function varyMusic() {
            musicVariation = (musicVariation + 1) % 3;
            stopMusic();
            startMusic();
        }
        
        function playSFX(type) {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(sfxGain);
            
            switch(type) {
                case 'collision':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                break;
                
                case 'checkpoint':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
                
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(sfxGain);
                osc2.type = 'sine';
                osc2.frequency.value = 660;
                gain2.gain.setValueAtTime(0.2, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.35);
                break;
                
                case 'button':
                osc.type = 'square';
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
                
                case 'overtake':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
                break;
                
                // MODIFICADO - Añadido efecto de sonido para cuenta atrás
                case 'countdown':
                osc.type = 'square';
                osc.frequency.value = 1000;
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
                break;
                
                case 'countdownGo':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                break;
            }
        }
        
        function setMusicVolume(vol) {
            if (musicGain) musicGain.gain.value = vol;
        }
        
        function setSfxVolume(vol) {
            if (sfxGain) sfxGain.gain.value = vol;
        }// ==========================================
        // SPRITES - Generación procedural 3D
        // ==========================================
        
        function createCarSprite(color, isPlayer = false) {
            const size = isPlayer ? 90 : 70;
            const spriteCanvas = document.createElement('canvas');
            spriteCanvas.width = size;
            spriteCanvas.height = size;
            const sCtx = spriteCanvas.getContext('2d');
            
            const cx = size / 2;
            const cy = size / 2;
            
            // Sombra
            sCtx.fillStyle = 'rgba(0,0,0,0.4)';
            sCtx.fillRect(cx - 30, cy + 25, 60, 8);
            
  if (isPlayer) {
    // MODIFICADO - X-34 LANDSPEEDER más pequeño y detallado
    const bodyW = 48; // Ancho reducido
    const bodyH = 32; // Alto reducido
    
    // MODIFICADO - Sombra de levitación
    sCtx.fillStyle = 'rgba(0,0,0,0.3)';
    sCtx.beginPath();
    sCtx.ellipse(cx, cy + 30, 24, 7, 0, 0, Math.PI * 2);
    sCtx.fill();
    
    // Cuerpo principal con volumen
    const bodyGradient = sCtx.createLinearGradient(cx - 24, cy - 5, cx - 24, cy + 20);
    bodyGradient.addColorStop(0, '#B22222');
    bodyGradient.addColorStop(0.4, '#8B0000');
    bodyGradient.addColorStop(1, '#5C0000');
    sCtx.fillStyle = bodyGradient;
    
    // Parte superior del casco
    sCtx.beginPath();
    sCtx.moveTo(cx - 20, cy - 6);
    sCtx.lineTo(cx - 24, cy + 8);
    sCtx.lineTo(cx - 20, cy + 20);
    sCtx.lineTo(cx + 20, cy + 20);
    sCtx.lineTo(cx + 24, cy + 8);
    sCtx.lineTo(cx + 20, cy - 6);
    sCtx.closePath();
    sCtx.fill();
    
    // Lado oscuro (sombra del casco)
    sCtx.fillStyle = '#4A0000';
    sCtx.beginPath();
    sCtx.moveTo(cx - 20, cy - 6);
    sCtx.lineTo(cx - 24, cy + 8);
    sCtx.lineTo(cx - 20, cy + 20);
    sCtx.lineTo(cx - 20, cy - 6);
    sCtx.closePath();
    sCtx.fill();
    
    // Lado claro (reflejo)
    sCtx.fillStyle = '#CD5C5C';
    sCtx.beginPath();
    sCtx.moveTo(cx + 20, cy - 6);
    sCtx.lineTo(cx + 24, cy + 8);
    sCtx.lineTo(cx + 20, cy + 20);
    sCtx.lineTo(cx + 20, cy - 6);
    sCtx.closePath();
    sCtx.fill();
    
    // Capó delantero (beige/marrón)
    const hoodGradient = sCtx.createLinearGradient(cx, cy - 4, cx, cy + 6);
    hoodGradient.addColorStop(0, '#D2B48C');
    hoodGradient.addColorStop(1, '#A0826D');
    sCtx.fillStyle = hoodGradient;
    sCtx.fillRect(cx - 18, cy - 4, 36, 10);
    
    // Líneas del capó
    sCtx.strokeStyle = '#8B7355';
    sCtx.lineWidth = 0.8;
    sCtx.beginPath();
    sCtx.moveTo(cx - 18, cy + 1);
    sCtx.lineTo(cx + 18, cy + 1);
    sCtx.stroke();
    
    // Parabrisas (cristal con reflejos)
    const windshieldGradient = sCtx.createLinearGradient(cx, cy - 2, cx, cy + 6);
    windshieldGradient.addColorStop(0, 'rgba(200, 230, 255, 0.8)');
    windshieldGradient.addColorStop(1, 'rgba(100, 150, 200, 0.6)');
    sCtx.fillStyle = windshieldGradient;
    
    sCtx.beginPath();
    sCtx.moveTo(cx - 16, cy + 6);
    sCtx.lineTo(cx - 14, cy - 2);
    sCtx.lineTo(cx + 14, cy - 2);

            // Sombra cabina
            sCtx.fillStyle = '#696969';
            sCtx.fillRect(cx + 26, cy + 6, 18, 6);
            
            // Ventana cabina (azul claro)
            sCtx.fillStyle = 'rgba(135, 206, 250, 0.85)';
            sCtx.beginPath();
            sCtx.moveTo(cx + 30, cy + 2);
            sCtx.lineTo(cx + 42, cy + 3);
            sCtx.lineTo(cx + 42, cy + 8);
            sCtx.lineTo(cx + 30, cy + 9);
            sCtx.closePath();
            sCtx.fill();
            
            // Marco ventana
            sCtx.strokeStyle = '#4F4F4F';
            sCtx.lineWidth = 1;
            sCtx.stroke();
            
            // RESPLANDOR DEL HIPERMOTOR (lo más icónico - azul brillante trasero)
            const engineY = cy + 26;
            
            // Glow exterior (halo)
            const outerGlow = sCtx.createRadialGradient(cx, engineY, 15, cx, engineY, 45);
            outerGlow.addColorStop(0, 'rgba(0, 191, 255, 0.6)');
            outerGlow.addColorStop(0.5, 'rgba(135, 206, 250, 0.3)');
            outerGlow.addColorStop(1, 'rgba(0, 191, 255, 0)');
            sCtx.fillStyle = outerGlow;
            sCtx.fillRect(cx - 45, engineY - 10, 90, 20);
            
            // Motor principal (elíptico)
            const engineGradient = sCtx.createLinearGradient(cx - 38, engineY, cx + 38, engineY);
            engineGradient.addColorStop(0, 'rgba(0, 191, 255, 0.3)');
            engineGradient.addColorStop(0.3, 'rgba(135, 206, 250, 1)');
            engineGradient.addColorStop(0.7, 'rgba(135, 206, 250, 1)');
            engineGradient.addColorStop(1, 'rgba(0, 191, 255, 0.3)');
            
            sCtx.fillStyle = engineGradient;
            sCtx.beginPath();
            sCtx.ellipse(cx, engineY, 38, 6, 0, 0, Math.PI * 2);
            sCtx.fill();
            
            // Línea central brillante
            sCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            sCtx.fillRect(cx - 35, engineY - 1, 70, 2);
            
            // Partículas de escape
            sCtx.fillStyle = 'rgba(173, 216, 230, 0.7)';
            for(let i = 0; i < 5; i++) {
                const px = cx - 30 + Math.random() * 60;
                const py = engineY + 8 + Math.random() * 6;
                sCtx.beginPath();
                sCtx.arc(px, py, 1 + Math.random() * 2, 0, Math.PI * 2);
                sCtx.fill();
            }
            
            // Marcas de desgaste (característico del Halcón)
            sCtx.fillStyle = 'rgba(80, 80, 80, 0.4)';
            sCtx.fillRect(cx - 10, cy + 8, 15, 3);
            sCtx.fillRect(cx + 8, cy - 2, 12, 2);
            sCtx.fillRect(cx - 25, cy + 12, 10, 2);
            
            return spriteCanvas;
        }
        
        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, Math.max(0, (num >> 16) + amt));
            const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
            const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
            return `rgb(${R},${G},${B})`;
        }
        
        function initSprites() {
            //playerCarSprite = createCarSprite('#d62828', true);
            
            const enemyColors = ['#2a9d8f', '#e9c46a', '#8338ec', '#457b9d'];
            enemyCarSprites = enemyColors.map(color => createCarSprite(color, false));
            
            const obstacleTypes = ['rock', 'hole', 'cone', 'barrier'];
            obstacleSprites = obstacleTypes.map(type => ({
                type: type,
                sprite: createObstacleSprite(type)
            }));
        }
        
        // ==========================================
        // INPUT - Manejo de teclado
        // ==========================================
        
        document.addEventListener('keydown', (e) => {
            // MODIFICADO - Bloquear teclas durante la cuenta atrás
            if (countdownActive) return;
            
            keys[e.key] = true;
            
            if (e.key === 'p' || e.key === 'P') {
                if (gameState === 'playing') {
                    pauseGame();
                } else if (gameState === 'paused') {
                    resumeGame();
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // ==========================================
        // GAME LOGIC - Lógica principal del juego
        // ==========================================
        
        function initGame() {
            // MODIFICADO: Mover esto al principio
            difficultyConfig = CONFIG.difficulties[currentDifficulty];
            
            // MODIFICADO: Usar las vidas de la dificultad
            lives = difficultyConfig.lives; 
            
            switch(currentDifficulty) {
                case 'easy':
                playerCarSprite = createPodracerSprite();
                break;
                case 'hard':
                playerCarSprite = createFalconSprite();
                break;
                case 'normal':
                default:
                // Usamos el sprite original (rojo) para el "Speeder Rebelde"
                playerCarSprite = createCarSprite('#d62828', true); 
                break;
            }
            
            timeRemaining = CONFIG.initialTime;
            score = 0;
            checkpointsPassed = 0;
            totalCollisions = 0;
            
            player.lane = 1;
            player.targetLane = 1;
            player.speed = 0;
            player.depth = 5;
            
            enemies = [];
            obstacles = [];
            checkpoints = [];
            lastEnemySpawn = 0;
            lastObstacleSpawn = 0;
            
            roadCurve = 0;
            targetRoadCurve = 0;
            roadScroll = 0;
            
            skyPhase = 0;
            
            currentBiome = 0;
            biomeTransition = 0;
            
            for (let i = 0; i < CONFIG.totalCheckpoints; i++) {
                checkpoints.push({
                    depth: 50 + (i * 50),
                    passed: false
                });
            }
            
            gameStartTime = performance.now();
            lastFrameTime = gameStartTime;
            totalPausedTime = 0;
            
            // Esta línea ya la movimos arriba:
            // difficultyConfig = CONFIG.difficulties[currentDifficulty]; 
            
            // MODIFICACIÓN (Paso 2): Eliminamos el cartel de aquí
            // showLocationSign(CONFIG.locations[0]); // <-- ELIMINA ESTA LÍNEA
        }
        
        // MODIFICADO - Función de cuenta atrás
        function startCountdown() {
            countdownActive = true;
            const overlay = document.getElementById('countdownOverlay');
            const text = document.getElementById('countdownText');
            
            overlay.classList.add('active');
            
            const countdownSequence = ['3', '2', '1', '¡ACELERA!'];
            let currentIndex = 0;
            
            function showNext() {
                if (currentIndex < countdownSequence.length) {
                    text.textContent = countdownSequence[currentIndex];
                    text.style.animation = 'none';
                    
                    setTimeout(() => {
                        text.style.animation = 'countdownPulse 0.8s ease-in-out';
                    }, 10);
                    
                    if (currentIndex < 3) {
                        playSFX('countdown'); // MODIFICADO
                    } else {
                        playSFX('countdownGo'); // MODIFICADO
                    }
                    
                    currentIndex++;
                    
                    if (currentIndex < countdownSequence.length) {
                        setTimeout(showNext, 1000);
                    } else {
                        setTimeout(() => {
                            overlay.classList.remove('active');
                            countdownActive = false; // MODIFICADO - Permitir jugar
                            gameState = 'playing';
                            lastFrameTime = performance.now();
                            
                            // MODIFICADO (Paso 2): Mostrar el cartel aquí
                            showLocationSign(CONFIG.locations[0]); 
                            
                        }, 1000);
                    }
                }
            }
            
            showNext();
        }
        
        function startGame() {
            initGame();
            gameState = 'countdown'; // MODIFICADO
            hideAllScreens();
            startMusic();
            
            // MODIFICADO - Iniciar la cuenta atrás
            startCountdown();
            
            gameLoop();
        }
        
        function pauseGame() {
            if (gameState !== 'playing') return;
            gameState = 'paused';
            pauseStartTime = performance.now();
            document.getElementById('pauseScreen').classList.remove('hidden');
        }
        
        function resumeGame() {
            if (gameState !== 'paused') return;
            gameState = 'playing';
            totalPausedTime += performance.now() - pauseStartTime;
            document.getElementById('pauseScreen').classList.add('hidden');
            lastFrameTime = performance.now();
        }
        
        function quitToMenu() {
            stopMusic();
            gameState = 'menu';
            showMenu();
        }
        
        function showLocationSign(location) {
            const sign = document.getElementById('locationSign');
            sign.textContent = location;
            sign.style.opacity = '1';
            
            setTimeout(() => {
                sign.style.opacity = '0';
            }, 3000);
        }
        
        function updateGame(deltaTime) {
            // MODIFICADO - No actualizar durante la cuenta atrás
            if (countdownActive) return;
            
            timeRemaining -= deltaTime / 1000;
            if (timeRemaining <= 0) {
                endGame(false);
                return;
            }
            
            if (biomeTransition < 1) {
                biomeTransition += deltaTime / 15000;
                biomeTransition = Math.min(1, biomeTransition);
            }
            
            score += (CONFIG.scorePerSecond * deltaTime) / 1000;
            
            handlePlayerInput(deltaTime);
            updateRoadCurve(deltaTime);
            
            roadScroll += player.speed * deltaTime / 100;
            
            updateEnemySpawn(deltaTime);
            updateEnemies(deltaTime);
            updateObstacleSpawn(deltaTime);
            updateObstacles(deltaTime);
            checkCollisions();
            checkCheckpoints();
            
            if (checkpointsPassed >= CONFIG.totalCheckpoints) {
                endGame(true);
            }
        }
        
        function handlePlayerInput(deltaTime) {
            if (keys['ArrowUp']) {
                player.speed = Math.min(player.speed + CONFIG.playerAcceleration, CONFIG.playerMaxSpeed);
            }
            
            if (keys['ArrowDown']) {
                player.speed = Math.max(player.speed - CONFIG.playerBrakeDecel, 0);
            }
            
            if (!keys['ArrowUp'] && !keys['ArrowDown']) {
                player.speed = Math.max(player.speed - CONFIG.playerFriction, 0);
            }
            
            if (keys['ArrowLeft'] && player.targetLane > 0) {
                player.targetLane--;
                keys['ArrowLeft'] = false;
            }
            if (keys['ArrowRight'] && player.targetLane < CONFIG.roadLanes - 1) {
                player.targetLane++;
                keys['ArrowRight'] = false;
            }
            
            const laneDiff = player.targetLane - player.lane;
            player.lane += laneDiff * CONFIG.laneChangeSpeed;
            
            targetRoadCurve = (player.targetLane - 1) * 0.35;
        }
        
        function updateRoadCurve(deltaTime) {
            const curveDiff = targetRoadCurve - roadCurve;
            roadCurve += curveDiff * 0.1;
        }
        
        function updateEnemySpawn(deltaTime) {
            lastEnemySpawn += deltaTime;
            
            const speedFactor = player.speed / CONFIG.playerMaxSpeed;
            const adjustedInterval = difficultyConfig.spawnInterval / (0.5 + speedFactor * 0.5);
            
            if (lastEnemySpawn >= adjustedInterval) {
                lastEnemySpawn = 0;
                
                for (let i = 0; i < difficultyConfig.enemiesPerWave; i++) {
                    spawnEnemy();
                }
            }
        }
        
        function spawnEnemy() {
            const occupiedLanes = new Set(
            enemies
            .filter(e => e.active && e.depth > 15 && e.depth < 25)
            .map(e => Math.round(e.lane))
            );
            
            obstacles.forEach(obs => {
                if (obs.active && obs.depth > 15 && obs.depth < 25) {
                    occupiedLanes.add(Math.round(obs.lane));
                }
            });
            
            let lane;
            if (occupiedLanes.size >= 2) {
                const availableLanes = [0, 1, 2].filter(l => !occupiedLanes.has(l));
                lane = availableLanes.length > 0 
                ? availableLanes[Math.floor(Math.random() * availableLanes.length)] 
                : Math.floor(Math.random() * CONFIG.roadLanes);
            } else {
                lane = Math.floor(Math.random() * CONFIG.roadLanes);
            }
            
            const spriteIndex = Math.floor(Math.random() * enemyCarSprites.length);
            
            enemies.push({
                lane: lane,
                depth: CONFIG.enemyMaxDepth + Math.random() * 5,
                speed: difficultyConfig.enemyBaseSpeed + (Math.random() * 0.01),
                sprite: enemyCarSprites[spriteIndex],
                wobble: Math.random() * 0.3 - 0.15,
                active: true,
                overtaken: false
            });
        }
        
        function updateObstacleSpawn(deltaTime) {
            lastObstacleSpawn += deltaTime;
            
            if (lastObstacleSpawn >= CONFIG.obstacleSpawnInterval) {
                lastObstacleSpawn = 0;
                spawnObstacle();
            }
        }
        
        function spawnObstacle() {
            const occupiedLanes = new Set();
            
            enemies.forEach(e => {
                if (e.active && e.depth > 20 && e.depth < 35) {
                    occupiedLanes.add(Math.round(e.lane));
                }
            });
            
            obstacles.forEach(obs => {
                if (obs.active && obs.depth > 20 && obs.depth < 35) {
                    occupiedLanes.add(Math.round(obs.lane));
                }
            });
            
            if (occupiedLanes.size >= 2) {
                const availableLanes = [0, 1, 2].filter(l => !occupiedLanes.has(l));
                if (availableLanes.length === 0) return;
                
                const lane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
                const obstacleData = obstacleSprites[Math.floor(Math.random() * obstacleSprites.length)];
                
                obstacles.push({
                    lane: lane,
                    depth: CONFIG.obstacleMaxDepth + Math.random() * 5,
                    type: obstacleData.type,
                    sprite: obstacleData.sprite,
                    active: true
                });
            } else {
                const lane = Math.floor(Math.random() * CONFIG.roadLanes);
                const obstacleData = obstacleSprites[Math.floor(Math.random() * obstacleSprites.length)];
                
                obstacles.push({
                    lane: lane,
                    depth: CONFIG.obstacleMaxDepth + Math.random() * 5,
                    type: obstacleData.type,
                    sprite: obstacleData.sprite,
                    active: true
                });
            }
        }
        
        function updateObstacles(deltaTime) {
            obstacles.forEach(obstacle => {
                if (!obstacle.active) return;
                
                obstacle.depth -= player.speed * deltaTime / 100;
                
                if (obstacle.depth < 2) {
                    obstacle.active = false;
                }
            });
            
            obstacles = obstacles.filter(o => o.active);
        }
        
        function updateEnemies(deltaTime) {
            enemies.forEach(enemy => {
                if (!enemy.active) return;
                
                const previousDepth = enemy.depth;
                
                enemy.depth -= (player.speed + enemy.speed) * deltaTime / 100;
                
                if (!enemy.overtaken && previousDepth > player.depth && enemy.depth <= player.depth) {
                    enemy.overtaken = true;
                    playSFX('overtake');
                }
                
                if (enemy.depth > 15) {
                    enemy.lane += enemy.wobble * deltaTime / 100;
                    enemy.lane = Math.max(0, Math.min(CONFIG.roadLanes - 1, enemy.lane));
                }
                
                if (enemy.depth < 2) {
                    enemy.active = false;
                }
            });
            
            enemies = enemies.filter(e => e.active);
        }
        
        function checkCollisions() {
            enemies.forEach(enemy => {
                if (!enemy.active) return;
                
                const laneDiff = Math.abs(enemy.lane - player.lane);
                const depthDiff = Math.abs(enemy.depth - player.depth);
                
                if (laneDiff < 0.4 && depthDiff < 1.5) {
                    handleCollision(enemy);
                }
            });
            
            obstacles.forEach(obstacle => {
                if (!obstacle.active) return;
                
                const laneDiff = Math.abs(obstacle.lane - player.lane);
                const depthDiff = Math.abs(obstacle.depth - player.depth);
                
                if (laneDiff < 0.4 && depthDiff < 1.5) {
                    handleCollision(obstacle);
                }
            });
        }
        
        function handleCollision(object) {
            object.active = false;
            lives--;
            totalCollisions++;
            
            playSFX('collision');
            createImpactEffect();
            
            player.speed *= 0.5;
            
            if (lives <= 0) {
                endGame(false);
            }
        }
        
        function createImpactEffect() {
            impactFlashTime = performance.now();
        }
        
        let impactFlashTime = 0;
        
        function checkCheckpoints() {
            checkpoints.forEach((checkpoint, index) => {
                if (checkpoint.passed) return;
                
                const distanceTraveled = roadScroll / 10;
                const checkpointDistance = checkpoint.depth - distanceTraveled;
                
                if (checkpointDistance <= 8 && checkpointDistance >= 6) {
                    checkpoint.passed = true;
                    checkpointsPassed++;
                    
                    timeRemaining += difficultyConfig.checkpointTimeBonus;
                    score += CONFIG.scorePerCheckpoint;
                    
                    playSFX('checkpoint');
                    varyMusic();
                    
                    if (checkpointsPassed > currentBiome && checkpointsPassed <= 4) {
                        currentBiome = checkpointsPassed;
                        biomeTransition = 0;
                    }
                    
                    // MODIFICADO - Mostrar cartel de ubicación y cambiar fase del cielo
                    if (checkpointsPassed <= CONFIG.locations.length) {
                        showLocationSign(CONFIG.locations[checkpointsPassed]);
                        skyPhase = checkpointsPassed;
                    }
                }
            });
        }
        
        function endGame(victory) {
            gameState = victory ? 'victory' : 'gameover';
            stopMusic();
            showGameOverScreen(victory);
        }
        
        // ==========================================
        // RENDER - Dibujado en canvas
        // ==========================================
        
        function render() {
            ctx.fillStyle = getSkyColor();
            ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
            
            renderSky();
            renderRoad();
            renderRoadside();
            renderCheckpoints();
            renderObstacles();
            renderEnemies();
            renderPlayer();
            
            if (performance.now() - impactFlashTime < 200) {
                ctx.fillStyle = 'rgba(255,0,0,0.3)';
                ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
            }
            
            renderHUD();
        }
        
        // MODIFICADO - Sistema de cielo dinámico según fase
        function getSkyColor() {
            const progress = biomeTransition;
            
            const nightSky = [25, 25, 60];
            const dawnSky = [135, 150, 200];
            const daySky = [135, 206, 250]; // MODIFICADO - Azul cielo intenso (checkpoint 2)
            const sunsetSky = [255, 150, 100]; // MODIFICADO - Atardecer (checkpoint 3)
            const duskSky = [40, 40, 80];
            
            let currentSky, nextSky;
            
            if (skyPhase === 0) {
                currentSky = nightSky;
                nextSky = dawnSky;
            } else if (skyPhase === 1) {
                currentSky = dawnSky;
                nextSky = daySky;
            } else if (skyPhase === 2) {
                // MODIFICADO - Entre checkpoint 2 y 3: día intenso
                currentSky = daySky;
                nextSky = sunsetSky;
            } else if (skyPhase === 3) {
                // MODIFICADO - Entre checkpoint 3 y 4: atardecer
                currentSky = sunsetSky;
                nextSky = duskSky;
            } else {
                currentSky = duskSky;
                nextSky = nightSky;
            }
            
            const r = Math.round(currentSky[0] + (nextSky[0] - currentSky[0]) * progress);
            const g = Math.round(currentSky[1] + (nextSky[1] - currentSky[1]) * progress);
            const b = Math.round(currentSky[2] + (nextSky[2] - currentSky[2]) * progress);
            
            return `rgb(${r},${g},${b})`;
        }
        
        function renderSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.horizonY);
            gradient.addColorStop(0, getSkyColor());
            gradient.addColorStop(1, shadeColor(getSkyColor(), -20));
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.horizonY);
            
            const celestialY = CONFIG.vanishingPointY - 50;
            const celestialX = CONFIG.canvasWidth / 2 + 200;
            
            if (skyPhase === 0) {
                renderStars();
                renderMoon(celestialX, celestialY, 1.0);
            } else if (skyPhase === 1) {
                const moonOpacity = Math.max(0, 1 - biomeTransition);
                const sunOpacity = biomeTransition;
                if (moonOpacity > 0) renderMoon(celestialX, celestialY, moonOpacity);
                if (sunOpacity > 0) renderSun(celestialX, celestialY, sunOpacity, 1.0);
                renderClouds();
            } else if (skyPhase === 2) {
                // MODIFICADO - Día pleno con sol brillante
                renderSun(celestialX, celestialY, 1.0, 1.0);
                renderClouds();
            } else if (skyPhase === 3) {
                // MODIFICADO - Atardecer: sol baja
                const sunHeight = celestialY + (CONFIG.horizonY - celestialY) * biomeTransition * 0.7;
                const sunIntensity = 1.0 - biomeTransition * 0.6;
                renderSunset(celestialX, sunHeight, sunIntensity);
                renderClouds();
            } else if (skyPhase === 4) {
                const moonOpacity = biomeTransition;
                if (moonOpacity > 0) renderMoon(celestialX, celestialY, moonOpacity);
            }
        }
        
        function renderStars() {
            ctx.fillStyle = '#fff';
            const starPositions = [
            {x: 100, y: 50}, {x: 200, y: 30}, {x: 350, y: 70},
            {x: 500, y: 40}, {x: 650, y: 60}, {x: 750, y: 35},
            {x: 150, y: 120}, {x: 400, y: 100}, {x: 600, y: 90},
            {x: 800, y: 110}, {x: 250, y: 150}, {x: 700, y: 140}
            ];
            
            starPositions.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function renderMoon(x, y, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.fillStyle = '#f0f0f0';
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(200,200,200,0.3)';
            ctx.beginPath();
            ctx.arc(x - 8, y - 5, 5, 0, Math.PI * 2);
            ctx.arc(x + 6, y + 3, 4, 0, Math.PI * 2);
            ctx.arc(x - 2, y + 8, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        
        function renderSun(x, y, opacity, intensity) {
            ctx.save();
            ctx.globalAlpha = opacity;
            
            ctx.fillStyle = `rgba(255, 220, ${100 * intensity}, ${intensity})`;
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = `rgba(255, 230, 150, ${intensity * 0.3})`;
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const x1 = x + Math.cos(angle) * 45;
                const y1 = y + Math.sin(angle) * 45;
                const x2 = x + Math.cos(angle) * 60;
                const y2 = y + Math.sin(angle) * 60;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.restore();
        }
        
        function renderSunset(x, y, intensity) {
            ctx.save();
            
            ctx.fillStyle = `rgba(255, ${150 * intensity}, ${50 * intensity}, ${intensity})`;
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI * 2);
            ctx.fill();
            
            const gradient = ctx.createRadialGradient(x, y, 35, x, y, 100);
            gradient.addColorStop(0, `rgba(255, 150, 50, ${intensity * 0.3})`);
            gradient.addColorStop(1, 'rgba(255, 100, 50, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.horizonY);
            
            ctx.restore();
        }
        
        function renderClouds() {
            if (skyPhase === 0 || skyPhase === 4) return;
            
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            
            const cloudPositions = [
            {x: 150, y: 80, scale: 1},
            {x: 500, y: 60, scale: 0.8},
            {x: 750, y: 100, scale: 1.2}
            ];
            
            cloudPositions.forEach(cloud => {
                const x = (cloud.x + roadScroll * 0.1) % CONFIG.canvasWidth;
                const y = cloud.y;const s = cloud.scale;
                
                ctx.beginPath();
                ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
                ctx.arc(x + 25 * s, y, 25 * s, 0, Math.PI * 2);
                ctx.arc(x + 50 * s, y, 20 * s, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function renderRoad() {
            let groundColor = '#7c7c7c';
            
            if (checkpointsPassed === 0 || (checkpointsPassed === 1 && biomeTransition < 0.5)) {
                groundColor = '#f4d03f';
            } else if (checkpointsPassed === 1 && biomeTransition >= 0.5) {
                const yellowToTan = biomeTransition * 2 - 1;
                groundColor = interpolateColor('#f4d03f', '#c8b88a', yellowToTan);
            } else if (checkpointsPassed === 2) {
                groundColor = interpolateColor('#c8b88a', '#8fbc8f', biomeTransition);
            } else if (checkpointsPassed === 3) {
                groundColor = interpolateColor('#8fbc8f', '#2d5016', biomeTransition);
            } else if (checkpointsPassed === 4) {
                groundColor = interpolateColor('#2d5016', '#505050', biomeTransition);
            } else if (checkpointsPassed >= 5) {
                groundColor = '#505050';
            }
            
            ctx.fillStyle = groundColor;
            ctx.fillRect(0, CONFIG.horizonY, CONFIG.canvasWidth, CONFIG.canvasHeight - CONFIG.horizonY);
            
            const numSegments = 100;
            const vanishX = CONFIG.canvasWidth / 2 + roadCurve * 400;
            
            for (let i = 0; i < numSegments; i++) {
                const z = i / numSegments;
                const perspective = z * z;
                
                const y = CONFIG.vanishingPointY + perspective * (CONFIG.canvasHeight - CONFIG.vanishingPointY);
                const width = perspective * CONFIG.roadWidth;
                const curveAmount = roadCurve * 400 * (1 - perspective);
                const centerX = CONFIG.canvasWidth / 2 + curveAmount;
                
                const xLeft = centerX - width / 2;
                const xRight = centerX + width / 2;
                
                const segmentIndex = Math.floor((roadScroll + i * 5) / 10);
                const isDark = segmentIndex % 2 === 0;
                
                ctx.fillStyle = isDark ? '#555' : '#666';
                ctx.beginPath();
                ctx.moveTo(xLeft, y);
                ctx.lineTo(xRight, y);
                ctx.lineTo(xRight, y + 6);
                ctx.lineTo(xLeft, y + 6);
                ctx.closePath();
                ctx.fill();
                
                if (i % 8 < 4 && perspective > 0.1) {
                    const laneWidth = width / CONFIG.roadLanes;
                    
                    for (let lane = 1; lane < CONFIG.roadLanes; lane++) {
                        const laneX = xLeft + lane * laneWidth;
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(laneX - 1, y, 2, 4);
                    }
                }
            }
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(vanishX - CONFIG.roadWidth / 2 * 0.01, CONFIG.vanishingPointY);
            ctx.lineTo(CONFIG.canvasWidth / 2 - CONFIG.roadWidth / 2, CONFIG.canvasHeight);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(vanishX + CONFIG.roadWidth / 2 * 0.01, CONFIG.vanishingPointY);
            ctx.lineTo(CONFIG.canvasWidth / 2 + CONFIG.roadWidth / 2, CONFIG.canvasHeight);
            ctx.stroke();
        }
        
        function interpolateColor(color1, color2, factor) {
            const c1 = color1.startsWith('#') ? hexToRgb(color1) : parseRgb(color1);
            const c2 = color2.startsWith('#') ? hexToRgb(color2) : parseRgb(color2);
            
            const r = Math.round(c1.r + (c2.r - c1.r) * factor);
            const g = Math.round(c1.g + (c2.g - c1.g) * factor);
            const b = Math.round(c1.b + (c2.b - c1.b) * factor);
            
            return `rgb(${r},${g},${b})`;
        }
        
        function hexToRgb(hex) {
            const num = parseInt(hex.replace('#', ''), 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }
        
        function parseRgb(rgb) {
            const match = rgb.match(/\d+/g);
            return {
                r: parseInt(match[0]),
                g: parseInt(match[1]),
                b: parseInt(match[2])
            };
        }
        
        function renderRoadside() {
            const vanishX = CONFIG.canvasWidth / 2 + roadCurve * 400;
            
            for (let i = 0; i < 20; i++) {
                const z = (i + (roadScroll % 30)) / 30;
                const perspective = z * z;
                
                const y = CONFIG.vanishingPointY + perspective * (CONFIG.canvasHeight - CONFIG.vanishingPointY);
                const scale = perspective * 2;
                
                if (scale < 0.1) continue;
                
                const curveAmount = roadCurve * 400 * (1 - perspective);
                const centerX = CONFIG.canvasWidth / 2 + curveAmount;
                
                const xLeft = centerX - CONFIG.roadWidth / 2 - 50 * perspective;
                const xRight = centerX + CONFIG.roadWidth / 2 + 50 * perspective;
                
                switch(currentBiome) {
                    case 0:
                    renderCactus(xLeft, y, scale);
                    renderCactus(xRight, y, scale);
                    break;
                    case 1:
                    if (biomeTransition < 0.5) {
                        renderCactus(xLeft, y, scale);
                        renderCactus(xRight, y, scale);
                    } else {
                        renderTree(xLeft, y, scale);
                        renderTree(xRight, y, scale);
                    }
                    break;
                    case 2:
                    renderTree(xLeft, y, scale);
                    renderTree(xRight, y, scale);
                    break;
                    case 3:
                    renderBush(xLeft, y, scale);
                    renderBush(xRight, y, scale);
                    break;
                    case 4:
                    renderStreetLight(xLeft, y, scale);
                    renderStreetLight(xRight, y, scale);
                    break;
                }
            }
            
            renderBiomeBackground();
        }
        
        function renderCactus(x, y, scale) {
            if (scale < 0.2) return;
            const height = 35 * scale;
            const width = 4 * scale;
            
            ctx.fillStyle = '#228B22';
            
            ctx.fillRect(x - width/2, y, width, height);
            
            const leftArmWidth = width * 0.8;
            const leftArmHeight = height * 0.3;
            const leftArmY = y + height * 0.4;
            ctx.fillRect(x - width * 2.5, leftArmY, leftArmWidth, leftArmHeight);
            ctx.fillRect(x - width * 2.5, leftArmY, width * 2, leftArmWidth);
            
            const rightArmWidth = width * 0.8;
            const rightArmHeight = height * 0.25;
            const rightArmY = y + height * 0.5;
            ctx.fillRect(x + width * 1.7, rightArmY, rightArmWidth, rightArmHeight);
            ctx.fillRect(x + width/2, rightArmY, width * 2, rightArmWidth);
        }
        
        function renderTree(x, y, scale) {
            if (scale < 0.2) return;
            const height = 40 * scale;
            
            ctx.fillStyle = '#654321';
            ctx.fillRect(x - 3 * scale, y, 6 * scale, height);
            
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.arc(x, y - 5 * scale, 12 * scale, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function renderBush(x, y, scale) {
            if(scale < 0.2) return;
            const bushWidth = 20 * scale;
            const bushHeight = 6 * scale;
            
            ctx.fillStyle = '#6B8E23';
            ctx.fillRect(x - bushWidth/2, y + 5 * scale, bushWidth, bushHeight);
            
            ctx.beginPath();
            ctx.ellipse(x - bushWidth/4, y + 8 * scale, bushWidth/8, bushHeight/2, 0, 0, Math.PI * 2);
            ctx.ellipse(x + bushWidth/4, y + 8 * scale, bushWidth/8, bushHeight/2, 0, 0, Math.PI * 2);
            ctx.ellipse(x, y + 8 * scale, bushWidth/8, bushHeight/2, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function renderStreetLight(x, y, scale) {
            if (scale < 0.2) return;
            const height = 45 * scale;
            
            ctx.fillStyle = '#888';
            ctx.fillRect(x - 1 * scale, y, 2 * scale, height);
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x, y - 5 * scale, 5 * scale, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function renderBiomeBackground() {
            const vanishX = CONFIG.canvasWidth / 2;
            const horizonY = CONFIG.vanishingPointY;
            
            let mountainScale = 0;
            if (currentBiome === 1) {
                mountainScale = biomeTransition;
            } else if (currentBiome === 2) {
                mountainScale = Math.max(0, 1.0 - biomeTransition);
            }
            
            if (mountainScale > 0) {
                ctx.fillStyle = `rgba(100, 100, 150, ${mountainScale * 0.6})`;
                for (let i = 0; i < 5; i++) {
                    const x = (vanishX - 300) + i * 150;
                    const baseHeight = 50;
                    const mountainHeight = baseHeight * mountainScale;
                    ctx.beginPath();
                    ctx.moveTo(x, horizonY);
                    ctx.lineTo(x + 50, horizonY - mountainHeight);
                    ctx.lineTo(x + 100, horizonY);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            
            // MODIFICADO - Mar aparece en checkpoint 3 (currentBiome === 3)
            // y desaparece COMPLETAMENTE al pasar checkpoint 4 (cuando currentBiome === 4 y biomeTransition > 0)
            if (currentBiome === 3) {
                const seaProgress = biomeTransition;
                const maxSeaHeight = 60;
                const seaHeight = maxSeaHeight * seaProgress;
                
                const seaGradient = ctx.createLinearGradient(0, horizonY - seaHeight, 0, horizonY);
                seaGradient.addColorStop(0, '#4169E1');
                seaGradient.addColorStop(1, '#1E90FF');
                
                ctx.fillStyle = seaGradient;
                ctx.fillRect(0, horizonY - seaHeight, CONFIG.canvasWidth, seaHeight);
                
                if (seaProgress > 0.3) {
                    renderSailboat(horizonY, seaProgress);
                }
            }
            // MODIFICADO - El mar NO se renderiza en currentBiome === 4
            // (desaparece instantáneamente al cruzar checkpoint 4)
            
            if (currentBiome === 4) {
                const buildingProgress = biomeTransition;
                const buildingStartX = vanishX - 400;
                
                for (let i = 0; i < 10; i++) {
                    const x = buildingStartX + i * 80;
                    const buildingBaseHeight = 30 + (i % 3) * 20;
                    const buildingHeight = buildingBaseHeight * buildingProgress;
                    
                    ctx.fillStyle = `rgba(60, 60, 80, ${0.8 * buildingProgress})`;
                    ctx.fillRect(x, horizonY - buildingHeight, 70, buildingHeight);
                    
                    ctx.fillStyle = `rgba(255, 255, 200, ${0.6 * buildingProgress})`;
                    const windowRows = Math.floor(buildingHeight / 15);
                    for (let row = 0; row < windowRows && row < 3; row++) {
                        for (let col = 0; col < 3; col++) {
                            const windowX = x + 10 + col * 20;
                            const windowY = horizonY - buildingHeight + 5 + row * 15;
                            ctx.fillRect(windowX, windowY, 8, 8);
                        }
                    }
                }
            }
        }
        
        function renderSailboat(horizonY, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;
            
            const boatX = 700;
            const boatY = horizonY - 20;
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(boatX - 20, boatY);
            ctx.lineTo(boatX - 15, boatY + 10);
            ctx.lineTo(boatX + 15, boatY + 10);
            ctx.lineTo(boatX + 20, boatY);
            ctx.closePath();
            ctx.fill();
            
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(boatX, boatY);
            ctx.lineTo(boatX, boatY - 25);
            ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(boatX, boatY - 25);
            ctx.lineTo(boatX + 15, boatY - 5);
            ctx.lineTo(boatX, boatY);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        function renderCheckpoints() {
            const vanishX = CONFIG.canvasWidth / 2 + roadCurve * 400;
            
            checkpoints.forEach((checkpoint, index) => {
                if (checkpoint.passed) return;
                
                const distanceTraveled = roadScroll / 10;
                const depthDiff = checkpoint.depth - distanceTraveled;
                
                if (depthDiff < 0 || depthDiff > 50) return;
                
                const z = 1 - (depthDiff / 50);
                const perspective = z * z;
                
                const y = CONFIG.vanishingPointY + perspective * (CONFIG.canvasHeight - CONFIG.vanishingPointY);
                const width = perspective * CONFIG.roadWidth;
                
                const curveAmount = roadCurve * 400 * (1 - perspective);
                const centerX = CONFIG.canvasWidth / 2 + curveAmount;
                
                const isFinishLine = (index === CONFIG.totalCheckpoints - 1);
                
                const numSquares = 8;
                const squareWidth = width / numSquares;
                
                for (let i = 0; i < numSquares; i++) {
                    ctx.fillStyle = i % 2 === 0 ? '#000' : '#fff';
                    const x = centerX - width / 2 + i * squareWidth;
                    ctx.fillRect(x, y - 5 * perspective, squareWidth, 10 * perspective);
                }
                
                if (perspective > 0.3) {
                    ctx.fillStyle = isFinishLine ? '#00ff00' : '#ffff00';
                    ctx.font = `${20 * perspective}px monospace`;
                    ctx.textAlign = 'center';
                    const text = isFinishLine ? '🏁 META 🏁' : `CHECKPOINT ${index + 1}`;
                    ctx.fillText(text, centerX, y - 15 * perspective);
                }
            });
        }
        
        function renderObstacles() {
            const vanishX = CONFIG.canvasWidth / 2 + roadCurve * 400;
            
            const sortedObstacles = [...obstacles].sort((a, b) => b.depth - a.depth);
            
            sortedObstacles.forEach(obstacle => {
                if (!obstacle.active) return;
                
                const z = 1 - (obstacle.depth / CONFIG.obstacleMaxDepth);
                const perspective = Math.max(0, z * z);
                
                if (perspective < 0.05) return;
                
                const y = CONFIG.vanishingPointY + perspective * (CONFIG.canvasHeight - CONFIG.vanishingPointY);
                
                const curveAmount = roadCurve * 400 * (1 - perspective);
                const centerX = CONFIG.canvasWidth / 2 + curveAmount;
                const laneX = centerX + (obstacle.lane - 1) * CONFIG.laneWidth * perspective;
                
                const scale = perspective * 1.0;
                const spriteWidth = obstacle.sprite.width * scale;
                const spriteHeight = obstacle.sprite.height * scale;
                
                ctx.drawImage(
                obstacle.sprite,
                laneX - spriteWidth / 2,
                y - spriteHeight,
                spriteWidth,
                spriteHeight
                );
            });
        }
        
        function renderEnemies() {
            const vanishX = CONFIG.canvasWidth / 2 + roadCurve * 400;
            
            const sortedEnemies = [...enemies].sort((a, b) => b.depth - a.depth);
            
            sortedEnemies.forEach(enemy => {
                if (!enemy.active) return;
                
                const z = 1 - (enemy.depth / CONFIG.enemyMaxDepth);
                const perspective = Math.max(0, z * z);
                
                if (perspective < 0.05) return;
                
                const y = CONFIG.vanishingPointY + perspective * (CONFIG.canvasHeight - CONFIG.vanishingPointY);
                
                const curveAmount = roadCurve * 400 * (1 - perspective);
                const centerX = CONFIG.canvasWidth / 2 + curveAmount;
                const laneX = centerX + (enemy.lane - 1) * CONFIG.laneWidth * perspective;
                
                const scale = perspective * 1.2;
                const spriteWidth = enemy.sprite.width * scale;
                const spriteHeight = enemy.sprite.height * scale;
                
                ctx.drawImage(
                enemy.sprite,
                laneX - spriteWidth / 2,
                y - spriteHeight,
                spriteWidth,
                spriteHeight
                );
            });
        }
        
        function renderPlayer() {
            const perspective = 0.8;
            const y = CONFIG.canvasHeight - 100;
            
            const laneX = CONFIG.canvasWidth / 2 + (player.lane - 1) * CONFIG.laneWidth * perspective;
            
            const scale = 1.5;
            const spriteWidth = playerCarSprite.width * scale;
            const spriteHeight = playerCarSprite.height * scale;
            
            ctx.drawImage(
            playerCarSprite,
            laneX - spriteWidth / 2,
            y - spriteHeight,
            spriteWidth,
            spriteHeight
            );
        }
        
        function renderHUD() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, CONFIG.canvasWidth, 50);
            ctx.fillRect(0, CONFIG.canvasHeight - 40, CONFIG.canvasWidth, 40);
            
            ctx.font = '20px monospace';
            ctx.textAlign = 'left';
            
            ctx.fillStyle = lives > 1 ? '#00ff00' : '#ff0000';
            ctx.fillText(`❤️ x${lives}`, 20, 30);
            
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = Math.floor(timeRemaining % 60);
            const timeStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            ctx.fillStyle = timeRemaining > 10 ? '#ffffff' : '#ff0000';
            ctx.fillText(`⏱️ ${timeStr}`, 150, 30);
            
            ctx.fillStyle = '#ffff00';
            ctx.fillText(`🏆 ${Math.floor(score)}`, 350, 30);
            
            ctx.fillStyle = '#00ffff';
            ctx.textAlign = 'right';
            ctx.fillText(`🏁 ${checkpointsPassed}/${CONFIG.totalCheckpoints}`, CONFIG.canvasWidth - 20, 30);
            
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText(`VELOCIDAD`, 20, CONFIG.canvasHeight - 15);
            
            const speedBarWidth = 200;
            const speedBarHeight = 15;
            const speedBarX = 150;
            const speedBarY = CONFIG.canvasHeight - 25;
            
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(speedBarX, speedBarY, speedBarWidth, speedBarHeight);
            
            const speedFill = (player.speed / CONFIG.playerMaxSpeed) * speedBarWidth;
            const speedGradient = ctx.createLinearGradient(speedBarX, 0, speedBarX + speedBarWidth, 0);
            speedGradient.addColorStop(0, '#00ff00');
            speedGradient.addColorStop(0.5, '#ffff00');
            speedGradient.addColorStop(1, '#ff0000');
            ctx.fillStyle = speedGradient;
            ctx.fillRect(speedBarX, speedBarY, speedFill, speedBarHeight);
        }
        
        // ==========================================
        // GAME LOOP - Bucle principal
        // ==========================================
        
        function gameLoop() {
            if (gameState !== 'playing' && gameState !== 'paused' && gameState !== 'countdown') return; // MODIFICADO
            
            const currentTime = performance.now();
            const deltaTime = currentTime - lastFrameTime;
            lastFrameTime = currentTime;
            
            if (gameState === 'playing') {
                updateGame(deltaTime);
            }
            
            render();
            
            requestAnimationFrame(gameLoop);
        }

        // UI HANDLERS - Manejo de interfaz
        // ==========================================
        
        function hideAllScreens() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
        }
        
        function showMenu() {
            hideAllScreens();
            document.getElementById('menuScreen').classList.remove('hidden');
        }
        
        function showGameOverScreen(victory) {
            hideAllScreens();
            const screen = document.getElementById('gameOverScreen');
            const title = document.getElementById('gameOverTitle');
            const statsDisplay = document.getElementById('statsDisplay');
            const nameInputSection = document.getElementById('nameInputSection');
            
            title.textContent = victory ? '🏆 ¡VICTORIA! 🏆' : '💥 GAME OVER 💥';
            title.style.color = victory ? '#00ff00' : '#ff0000';
            
            const finalScore = Math.floor(score);
            const stats = `
        <strong>Puntuación Final:</strong> ${finalScore}<br>
        <strong>Tiempo Restante:</strong> ${Math.floor(timeRemaining)}s<br>
        <strong>Checkpoints:</strong> ${checkpointsPassed}/${CONFIG.totalCheckpoints}<br>
        <strong>Colisiones:</strong> ${totalCollisions}<br>
        <strong>Dificultad:</strong> ${difficultyConfig.name}
    `;
            statsDisplay.innerHTML = stats;
            
            const ranking = loadRanking();
            const entersRanking = ranking.length < CONFIG.maxRankingEntries || 
            finalScore > ranking[ranking.length - 1]?.score;
            
            if (entersRanking) {
                document.getElementById('nameInput').value = '';
                nameInputSection.classList.remove('hidden');
                setTimeout(() => document.getElementById('nameInput').focus(), 100);
            } else {
                nameInputSection.classList.add('hidden');
            }
            
            screen.classList.remove('hidden');
        }
        
        function loadRanking() {
            try {
                const data = localStorage.getItem(CONFIG.rankingKey);
                return data ? JSON.parse(data) : [];
            } catch(e) {
                return [];
            }
        }
        
        function saveRanking(ranking) {
            try {
                localStorage.setItem(CONFIG.rankingKey, JSON.stringify(ranking));
            } catch(e) {
                console.error('Error al guardar ranking:', e);
            }
        }
        
        function addToRanking(name, score, difficulty) {
            const ranking = loadRanking();
            
            const entry = {
                name: name.trim() || 'ANÓNIMO',
                score: Math.floor(score),
                difficulty: difficulty,
                date: new Date().toLocaleDateString('es-ES')
            };
            
            ranking.push(entry);
            ranking.sort((a, b) => b.score - a.score);
            
            const topRanking = ranking.slice(0, CONFIG.maxRankingEntries);
            saveRanking(topRanking);
        }
        
        function showRanking() {
            const ranking = loadRanking();
            const rankingList = document.getElementById('rankingList');
            
            if (ranking.length === 0) {
                rankingList.innerHTML = '<p style="text-align:center; color:#888;">No hay registros aún</p>';

                rankingList.innerHTML = ranking.map((entry, index) => `

                <strong>#${index + 1}</strong> - ${entry.name} 
                <span style="float:right;">
                    ${entry.score} pts (${entry.difficulty}) - ${entry.date}
                </span>
            </div>
        `).join('');
            }
        }

        <h2 style="text-align:center; color:#ff006e;">🏆 TOP 10 RANKING 🏆</h2>

        <button id="closeRankingBtn" style="margin-top:20px; width:100%;">CERRAR</button>
    `;
            
            document.body.appendChild(modal);
            showRanking();
            
            document.getElementById('closeRankingBtn').addEventListener('click', () => {
                playSFX('button');
                document.body.removeChild(modal);
            });
        });
        
        document.getElementById('instructionsBtn').addEventListener('click', () => {
            playSFX('button');
            
            const modal = document.createElement('div');
            modal.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(20,20,40,0.98);
        padding: 30px;
        border-radius: 15px;
        border: 3px solid #8338ec;
        z-index: 1000;
        max-width: 600px;
        width: 90%;
        max-height: 80%;
        overflow-y: auto;
    `;
            
            modal.innerHTML = `
        <div id="instructions"></div>
        <button id="closeInstructionsBtn" style="margin-top:20px; width:100%;">CERRAR</button>
    `;
            
            document.body.appendChild(modal);
            showInstructions();
            
            document.getElementById('closeInstructionsBtn').addEventListener('click', () => {
                playSFX('button');
                document.body.removeChild(modal);
            });
        });
        
        document.getElementById('resetRankingBtn').addEventListener('click', () => {
            resetRanking();
        });
        
        document.getElementById('resumeBtn').addEventListener('click', () => {
            playSFX('button');
            resumeGame();
        });
        
        document.getElementById('quitBtn').addEventListener('click', () => {
            playSFX('button');
            quitToMenu();
        });
        
        document.getElementById('submitScoreBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value;
            addToRanking(name, score, difficultyConfig.name);
            playSFX('button');
            document.getElementById('nameInputSection').classList.add('hidden');
            alert('¡Puntuación guardada!');
        });
        
        document.getElementById('backToMenuBtn').addEventListener('click', () => {
            playSFX('button');
            quitToMenu();
        });
        
        window.addEventListener('DOMContentLoaded', function() {
            initAudio();
            initSprites();
        });
        
    </script>
</body>
</html>
